<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>蓝盛支付 - 封禁IP管理</title>
  <style>
    :root{--blue:#409eff;--blue-dark:#287ccc;--blue-soft:#ecf5ff;--canvas:#f3f6fa;--card:#fff;--text:#303133;--sub:#606266;--muted:#909399;--line:#e6eaf0;--line2:#dcdfe6;--danger:#f56c6c;--danger-soft:#fef0f0;--warn:#e6a23c;--warn-soft:#fdf6ec;--success:#67c23a;--success-soft:#f0f9eb;--shadow:0 4px 16px rgba(31,45,61,.05);font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--text);font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(64,158,255,.24);outline-offset:2px}.app{display:grid;grid-template-columns:72px minmax(0,1fr);min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line)}.side-brand{height:56px;background:linear-gradient(90deg,#409eff,#66aaf5)}.side-icons{display:grid}.side-icon{height:57px;display:grid;place-items:center;color:#87b7e9;border:0;background:transparent}.side-icon.active{background:#e5f2ff;color:var(--blue);border-right:2px solid var(--blue)}.side-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7}.main{min-width:0}.topbar{height:56px;background:linear-gradient(90deg,#409eff,#66aaf5);display:flex;justify-content:flex-end;align-items:center;padding:0 26px;color:#fff}.user{display:flex;align-items:center;gap:8px}.avatar{width:30px;height:30px;border-radius:50%;background:#c9d0d8;border:1px solid rgba(255,255,255,.6)}
    .tabbar{height:39px;display:flex;align-items:center;gap:6px;padding:5px 16px;background:#fff;border-bottom:1px solid var(--line)}.tab{height:29px;display:inline-flex;align-items:center;gap:7px;padding:0 12px;border:1px solid var(--line2);border-radius:4px;background:#fff;color:var(--sub)}.tab.active{border-color:var(--blue);background:var(--blue);color:#fff}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.page{padding:14px 16px 28px}.filter-card,.table-card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}.filter-card{padding:16px;margin-bottom:14px}.filter-grid{display:grid;grid-template-columns:1.05fr .8fr .85fr .8fr 1.25fr 1fr .8fr auto;gap:14px;align-items:end}.field{display:grid;gap:6px}.field label{color:#515866;font-size:13px}.control{width:100%;height:34px;padding:0 10px;border:1px solid var(--line2);border-radius:4px;background:#fff;color:#4b5563}.control::placeholder{color:#b1b6bf}.control:hover,.control:focus{border-color:#8dc4fb}.range{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}.range span{color:#a0a5ad}.actions{display:flex;gap:9px;white-space:nowrap}.btn{height:34px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;border:1px solid var(--line2);border-radius:4px;background:#fff;color:#596273;transition:.18s}.btn:hover{color:var(--blue);border-color:#a7d2fb;background:#f5faff}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue-dark)}.btn.orange{background:#f56c3f;border-color:#f56c3f;color:#fff}.btn.danger{color:var(--danger);border-color:#fab6b6;background:var(--danger-soft)}.btn:disabled{cursor:not-allowed;opacity:.46}.btn svg,.link svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8}
    .toolbar{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}.title-block{display:flex;align-items:center;gap:12px}.title-block h1{font-size:16px;margin:0}.summary{color:var(--muted);font-size:12px}.toolbar-actions{display:flex;gap:10px}.rule-tip{display:flex;align-items:flex-start;gap:9px;margin:0 14px 12px;padding:10px 12px;border:1px solid #c6e2ff;border-radius:4px;background:#f2f8ff;color:#4f6f93;font-size:12px;line-height:1.55}.rule-tip svg{width:16px;height:16px;flex:0 0 auto;margin-top:1px;fill:none;stroke:var(--blue);stroke-width:1.8}.table-scroll{overflow:auto}table{width:100%;min-width:1410px;border-collapse:collapse;table-layout:fixed}th,td{height:52px;padding:10px 12px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:middle}th{height:48px;background:#fbfcfd;color:#707784;font-weight:500;white-space:nowrap}tbody tr:hover{background:#f7fbff}.check{width:16px;height:16px;accent-color:var(--blue)}.ip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#424b57;white-space:nowrap}.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:3px;font-size:12px;white-space:nowrap}.tag.temp{color:#8a5b12;background:var(--warn-soft);border:1px solid #f5dab1}.tag.manual{color:#b44343;background:var(--danger-soft);border:1px solid #f8caca}.tag.active{color:#c45656;background:var(--danger-soft)}.tag.expired{color:#528d3d;background:var(--success-soft)}.trigger{color:#4f5968}.count{font-weight:600;color:#d97706}.muted{color:var(--muted)}.remark{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.op{display:flex;align-items:center;gap:10px;white-space:nowrap}.link{padding:0;border:0;background:none;color:var(--blue)}.link:hover{text-decoration:underline}.link.danger{color:var(--danger)}.pager{min-height:62px;display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:12px 16px;color:#667085}.page-btn{width:34px;height:34px;border:1px solid var(--line2);border-radius:4px;background:#fff;color:#6d7580}.page-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}.page-btn:disabled{opacity:.4;cursor:not-allowed}.empty-row{text-align:center;color:var(--muted);height:120px}
    .mask{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;padding:72px 18px 28px;background:rgba(17,24,39,.48);overflow:auto}.mask.show{display:flex}.modal{width:min(680px,100%);background:#fff;border-radius:6px;box-shadow:0 22px 70px rgba(15,23,42,.25)}.modal.small{width:min(480px,100%)}.modal-head{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:17px}.close{width:32px;height:32px;border:0;background:none;color:#8b95a2;font-size:23px}.modal-body{padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px}.form-item{display:grid;gap:7px}.form-item.full{grid-column:1/-1}.form-item label{color:#4d5664}.req{color:var(--danger)}.textarea{min-height:88px;padding:9px 10px;resize:vertical}.hint{margin-top:5px;color:var(--muted);font-size:12px}.readonly{min-height:36px;padding:9px 11px;border-radius:4px;background:#f5f7fa;color:#525b68}.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:15px 20px;border-top:1px solid var(--line)}.error{min-height:18px;margin-top:4px;color:var(--danger);font-size:12px}.detail-grid{display:grid;grid-template-columns:128px 1fr;border:1px solid var(--line);border-bottom:0}.detail-grid>div{padding:10px 12px;border-bottom:1px solid var(--line)}.detail-grid .key{background:#fafbfc;color:#697180}.timeline{margin-top:18px}.timeline h3{font-size:14px;margin:0 0 12px}.step{position:relative;margin-left:6px;padding:0 0 16px 22px;border-left:1px solid #d9e7f5;color:#56606e;line-height:1.5}.step:last-child{padding-bottom:0}.step::before{content:"";position:absolute;left:-5px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--blue)}.step time{display:block;color:var(--muted);font-size:12px}.toast{position:fixed;right:22px;bottom:22px;z-index:120;padding:11px 15px;border-radius:5px;background:#303744;color:#fff;box-shadow:0 10px 28px rgba(22,30,44,.24);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
    @media(max-width:1200px){.filter-grid{grid-template-columns:repeat(3,minmax(180px,1fr))}.actions{justify-content:flex-end}.page{padding:12px}}@media(max-width:720px){.app{grid-template-columns:54px 1fr}.filter-grid{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}.toolbar-actions{width:100%;overflow:auto}.form-grid{grid-template-columns:1fr}.form-item.full{grid-column:auto}.mask{padding-top:18px}.pager{justify-content:flex-start;overflow:auto}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="系统菜单"><div class="side-brand"></div><nav class="side-icons"><button class="side-icon" aria-label="地址查询"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><path d="M6 20v-2a6 6 0 0 1 12 0v2M4 20h16"/></svg></button><button class="side-icon" aria-label="代付管理"><svg viewBox="0 0 24 24"><path d="M4 8h16v11H4zM8 8V5h8v3M8 12h8"/></svg></button><button class="side-icon" aria-label="系统管理"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.5 1a8 8 0 0 0-1.8-1L14.2 3h-4.4l-.4 3.1a8 8 0 0 0-1.8 1l-2.5-1-2 3.4 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.5-1a8 8 0 0 0 1.8 1l.4 3.1h4.4l.4-3.1a8 8 0 0 0 1.8-1l2.5 1 2-3.4-2-1.5a7 7 0 0 0 .1-1z"/></svg></button><button class="side-icon active" aria-label="封禁IP管理"><svg viewBox="0 0 24 24"><path d="M6 4h12l-1 5H7L6 4zM9 9v10m6-10v10M5 20h14"/></svg></button></nav></aside>
  <main class="main">
    <header class="topbar"><div class="user"><span class="avatar"></span><span>芋道源码</span></div></header>
    <div class="tabbar"><span class="tab">订单管理 ×</span><span class="tab active"><span class="dot"></span>封禁ip管理 ×</span></div>
    <div class="page">
      <section class="filter-card" aria-label="封禁IP筛选">
        <div class="filter-grid">
          <div class="field"><label for="ipFilter">IP地址</label><input id="ipFilter" class="control" placeholder="请输入IP地址"></div>
          <div class="field"><label for="typeFilter">封禁类型</label><select id="typeFilter" class="control"><option value="">全部类型</option><option value="temp">登录临时封锁</option><option value="manual">人工永久封禁</option></select></div>
          <div class="field"><label for="triggerFilter">触发原因</label><select id="triggerFilter" class="control"><option value="">全部原因</option><option>登录密码错误</option><option>Google验证码错误</option><option>人工添加</option></select></div>
          <div class="field"><label for="statusFilter">当前状态</label><select id="statusFilter" class="control"><option value="">全部状态</option><option value="active">封禁中</option><option value="expired">已解除</option></select></div>
          <div class="field"><label>创建时间</label><div class="range"><input id="startDate" class="control" type="date"><span>—</span><input id="endDate" class="control" type="date"></div></div>
          <div class="field"><label for="remarkFilter">备注</label><input id="remarkFilter" class="control" placeholder="请输入备注"></div>
          <div class="field"><label for="releaseFilter">解除方式</label><select id="releaseFilter" class="control"><option value="">全部方式</option><option value="pending">未解除</option><option value="auto">自动解除</option><option value="manual">人工解除</option></select></div>
          <div class="actions"><button class="btn primary" id="searchBtn"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg>搜索</button><button class="btn" id="resetBtn"><svg viewBox="0 0 24 24"><path d="M4 4v6h6M20 20v-6h-6M6.5 17.5A8 8 0 0 0 20 12M17.5 6.5A8 8 0 0 0 4 12"/></svg>重置</button></div>
        </div>
      </section>
      <section class="table-card">
        <div class="toolbar"><div class="title-block"><h1>封禁IP管理</h1><span class="summary" id="summaryText">共 6 条记录，3 条封禁中</span></div><div class="toolbar-actions"><button class="btn primary" id="addBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新增</button><button class="btn orange" id="exportBtn"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14"/></svg>导出</button></div></div>
        <div class="rule-tip"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg><span>同一 IP 在 5 分钟内累计登录密码或 Google 验证码错误达到 5 次，将自动封锁 24 小时；登录 IP 白名单优先豁免，人工永久封禁优先级最高。</span></div>
        <div class="table-scroll"><table><colgroup><col style="width:66px"><col style="width:155px"><col style="width:120px"><col style="width:92px"><col style="width:145px"><col style="width:80px"><col style="width:155px"><col style="width:155px"><col style="width:155px"><col style="width:190px"><col style="width:150px"></colgroup><thead><tr><th>主键</th><th>IP地址</th><th>封禁类型</th><th>当前状态</th><th>触发原因</th><th>失败次数</th><th>封禁时间</th><th>自动解除时间</th><th>更新时间</th><th>备注</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
        <div class="pager"><span id="countText">共 6 条</span><select class="control" style="width:106px"><option>10条/页</option><option>20条/页</option></select><button class="page-btn" disabled>‹</button><button class="page-btn active">1</button><button class="page-btn" disabled>›</button><span>前往</span><input class="control" style="width:54px" value="1" aria-label="跳转页码"><span>页</span></div>
      </section>
    </div>
  </main>
</div>

<div class="mask" id="actionMask" role="dialog" aria-modal="true" aria-labelledby="actionTitle"><div class="modal" id="actionModal"><header class="modal-head"><h2 id="actionTitle">新增封禁IP</h2><button class="close" data-close aria-label="关闭">×</button></header><div class="modal-body" id="actionBody"></div><footer class="modal-foot"><button class="btn" data-close>取消</button><button class="btn primary" id="submitAction">确定</button></footer></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  const $=id=>document.getElementById(id);
  const data=[
    {id:1,ip:'203.0.113.28',type:'temp',status:'active',trigger:'登录密码错误',count:5,created:'2026-09-03 10:32:18',unlock:'2026-09-04 10:32:18',updated:'2026-09-03 10:32:18',remark:'同一IP关联3个登录账号'},
    {id:2,ip:'198.51.100.42',type:'temp',status:'active',trigger:'Google验证码错误',count:5,created:'2026-09-03 09:18:46',unlock:'2026-09-04 09:18:46',updated:'2026-09-03 09:18:46',remark:'登录验证阶段自动触发'},
    {id:3,ip:'2001:db8:2::15',type:'manual',status:'active',trigger:'人工添加',count:null,created:'2026-09-02 16:40:05',unlock:'—',updated:'2026-09-02 16:40:05',remark:'异常订单请求来源'},
    {id:4,ip:'192.0.2.86',type:'temp',status:'expired',trigger:'登录密码错误',count:5,created:'2026-09-01 13:10:22',unlock:'2026-09-02 13:10:22',updated:'2026-09-02 13:10:22',remark:'满24小时自动解除'},
    {id:5,ip:'203.0.113.77',type:'temp',status:'expired',trigger:'Google验证码错误',count:6,created:'2026-08-31 22:08:16',unlock:'2026-09-01 08:25:30',updated:'2026-09-01 08:25:30',remark:'管理员手动解除；原因：办公网络误触'},
    {id:6,ip:'198.51.100.119',type:'manual',status:'expired',trigger:'人工添加',count:null,created:'2026-08-26 11:05:54',unlock:'—',updated:'2026-08-30 17:42:09',remark:'人工永久封禁记录已删除'}
  ];
  let filtered=data.slice(),editingId=null,action='add',toastTimer;
  const typeText=x=>x.type==='temp'?'登录临时封锁':'人工永久封禁';
  const statusText=x=>x.status==='active'?'封禁中':'已解除';
  function notify(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
  function render(){
    $('rows').innerHTML=filtered.length?filtered.map(row=>`<tr><td>${row.id}</td><td class="ip">${row.ip}</td><td><span class="tag ${row.type}">${typeText(row)}</span></td><td><span class="tag ${row.status}">${statusText(row)}</span></td><td class="trigger">${row.trigger}</td><td>${row.count===null?'<span class="muted">—</span>':`<span class="count">${row.count}</span>`}</td><td>${row.created}</td><td>${row.unlock}</td><td>${row.updated}</td><td class="remark" title="${row.remark}">${row.remark}</td><td><div class="op">${row.type==='temp'?`<button class="link" data-detail="${row.id}">查看详情</button>${row.status==='active'?`<button class="link danger" data-unlock="${row.id}">解除拉黑</button>`:''}`:row.status==='active'?`<button class="link" data-edit="${row.id}">编辑</button><button class="link danger" data-delete="${row.id}">删除</button>`:'<button class="link" data-detail="'+row.id+'">查看详情</button>'}</div></td></tr>`).join(''):'<tr><td class="empty-row" colspan="11">暂无符合条件的封禁记录</td></tr>';
    $('countText').textContent=`共 ${filtered.length} 条`;$('summaryText').textContent=`共 ${filtered.length} 条记录，${filtered.filter(x=>x.status==='active').length} 条封禁中`;
  }
  function releaseWay(x){if(x.status==='active')return'pending';if(x.remark.includes('手动解除'))return'manual';return'auto'}
  function applyFilter(){const ip=$('ipFilter').value.trim().toLowerCase(),type=$('typeFilter').value,trigger=$('triggerFilter').value,status=$('statusFilter').value,start=$('startDate').value,end=$('endDate').value,remark=$('remarkFilter').value.trim(),release=$('releaseFilter').value;filtered=data.filter(x=>(!ip||x.ip.toLowerCase().includes(ip))&&(!type||x.type===type)&&(!trigger||x.trigger===trigger)&&(!status||x.status===status)&&(!start||x.created.slice(0,10)>=start)&&(!end||x.created.slice(0,10)<=end)&&(!remark||x.remark.includes(remark))&&(!release||releaseWay(x)===release));render();notify(`已找到 ${filtered.length} 条记录`)}
  function resetFilter(){['ipFilter','typeFilter','triggerFilter','statusFilter','startDate','endDate','remarkFilter','releaseFilter'].forEach(id=>$(id).value='');filtered=data.slice();render();notify('筛选条件已重置')}
  function openMask(title,body,mode,size=''){action=mode;$('actionTitle').textContent=title;$('actionBody').innerHTML=body;$('actionModal').className=`modal ${size}`;$('actionMask').classList.add('show');setTimeout(()=>$('actionBody').querySelector('input,select,textarea')?.focus(),20)}
  function closeMask(){$('actionMask').classList.remove('show');$('actionBody').innerHTML='';editingId=null}
  function banForm(row={}){return `<div class="form-grid"><div class="form-item full"><label><span class="req">*</span>IP地址</label><input id="formIp" class="control" placeholder="请输入完整IPv4或IPv6地址" value="${row.ip||''}"><div class="error" id="ipError"></div></div><div class="form-item full"><label><span class="req">*</span>备注</label><textarea id="formRemark" class="control textarea" placeholder="请输入封禁原因，便于后续审计">${row.remark||''}</textarea><div class="hint">通过“新增”创建的记录为人工永久封禁，不设置自动解除时间。</div><div class="error" id="remarkError"></div></div></div>`}
  function openAdd(){editingId=null;openMask('新增封禁IP',banForm(),'add')}
  function openEdit(id){const row=data.find(x=>x.id===id);editingId=id;openMask('编辑封禁IP',banForm(row),'edit')}
  function openUnlock(id){const row=data.find(x=>x.id===id);editingId=id;openMask('解除临时拉黑',`<div class="form-grid"><div class="form-item"><label>IP地址</label><div class="readonly">${row.ip}</div></div><div class="form-item"><label>原自动解除时间</label><div class="readonly">${row.unlock}</div></div><div class="form-item full"><label><span class="req">*</span>解除原因</label><textarea id="unlockReason" class="control textarea" placeholder="请说明提前解除原因"></textarea><div class="error" id="reasonError"></div></div><div class="form-item full"><label><span class="req">*</span>Google验证码</label><input id="googleCode" class="control" inputmode="numeric" maxlength="6" placeholder="请输入6位验证码"><div class="hint">手动解除属于敏感操作，提交后记录操作人、原因与时间。</div><div class="error" id="codeError"></div></div></div>`,'unlock')}
  function openDetail(id){const row=data.find(x=>x.id===id);editingId=id;const finalStep=row.status==='active'?'封禁仍在生效中':row.remark.includes('手动解除')?'管理员手动解除':'系统满24小时自动解除';openMask('封禁记录详情',`<div class="detail-grid"><div class="key">IP地址</div><div class="ip">${row.ip}</div><div class="key">封禁类型</div><div>${typeText(row)}</div><div class="key">当前状态</div><div>${statusText(row)}</div><div class="key">触发原因</div><div>${row.trigger}</div><div class="key">失败次数</div><div>${row.count??'—'}</div><div class="key">备注</div><div>${row.remark}</div></div><div class="timeline"><h3>处理轨迹</h3><div class="step"><time>${row.created}</time>${row.type==='temp'?`5分钟内失败达到${row.count}次，系统自动拉黑`:'管理员创建永久封禁记录'}</div><div class="step"><time>${row.updated}</time>${finalStep}</div></div>`,'detail','small');$('submitAction').textContent='关闭'}
  function validIp(value){return /^(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.|$)){4}$/.test(value)||/^[0-9a-f:]+$/i.test(value)}
  function submit(){
    if(action==='detail'){closeMask();return}
    if(action==='delete'){const row=data.find(x=>x.id===editingId);row.status='expired';row.updated='2026-09-03 14:12:00';row.remark+='；永久封禁记录已删除';filtered=data.slice();render();closeMask();notify('永久封禁记录已删除');return}
    if(action==='unlock'){const reason=$('unlockReason').value.trim(),code=$('googleCode').value.trim();$('reasonError').textContent=reason?'':'请输入解除原因';$('codeError').textContent=/^\d{6}$/.test(code)?'':'请输入6位Google验证码';if(!reason||!/^\d{6}$/.test(code))return;const row=data.find(x=>x.id===editingId);row.status='expired';row.updated='2026-09-03 14:12:00';row.remark=`管理员手动解除；原因：${reason}`;filtered=data.slice();render();closeMask();notify('该IP已解除临时拉黑');return}
    const ip=$('formIp').value.trim(),remark=$('formRemark').value.trim();$('ipError').textContent=validIp(ip)?'':'请输入有效的IPv4或IPv6地址';$('remarkError').textContent=remark?'':'请输入封禁备注';if(!validIp(ip)||!remark)return;if(action==='add'){data.unshift({id:Date.now(),ip,type:'manual',status:'active',trigger:'人工添加',count:null,created:'2026-09-03 14:12:00',unlock:'—',updated:'2026-09-03 14:12:00',remark})}else{const row=data.find(x=>x.id===editingId);row.ip=ip;row.remark=remark;row.updated='2026-09-03 14:12:00'}filtered=data.slice();render();closeMask();notify(action==='add'?'封禁IP已新增':'封禁IP已更新')
  }
  $('rows').addEventListener('click',e=>{const detail=e.target.closest('[data-detail]'),unlock=e.target.closest('[data-unlock]'),edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(detail)openDetail(+detail.dataset.detail);if(unlock)openUnlock(+unlock.dataset.unlock);if(edit)openEdit(+edit.dataset.edit);if(del){editingId=+del.dataset.delete;const row=data.find(x=>x.id===editingId);openMask('删除永久封禁',`<p style="margin:0;line-height:1.7;color:#56606e">确定删除 IP <b class="ip">${row.ip}</b> 的人工永久封禁？删除后该 IP 将恢复访问，操作会保留审计记录。</p>`,'delete','small')}});
  $('searchBtn').onclick=applyFilter;$('resetBtn').onclick=resetFilter;$('addBtn').onclick=openAdd;$('exportBtn').onclick=()=>notify(`已按当前条件导出 ${filtered.length} 条记录`);$('submitAction').onclick=submit;document.querySelectorAll('[data-close]').forEach(x=>x.onclick=closeMask);$('actionMask').addEventListener('click',e=>{if(e.target===$('actionMask'))closeMask()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMask();if(e.key==='Enter'&&document.activeElement===$('ipFilter'))applyFilter()});render();
</script>
</body>
</html>
