const RISK_ROLE_CAPS = {

function riskCanFor(actor, capability) { return Boolean(actor && RISK_ROLE_CAPS[actor.role]?.includes(capability)); }

function relatedReportsSection(s,c){
  const rows=riskRelatedReports(s,c.id);
  return '<section class="detail-section related-reports"><h3 class="section-title">同 APPID 的其他通报 <span class="help">'+rows.length+' 条</span></h3><p class="help">APPID '+riskEscape(c.appid)+' · 仅含已审核通报，不含当前条；按APPID关联，不认定为同一事件。</p>'+(rows.length?'<div class="related-report-list">'+rows.map(r=>'<button class="related-report" data-related-case="'+riskEscape(r.id)+'"><div class="related-report-top"><strong class="event-type">'+riskEscape(r.reason)+'</strong>'+levelTag(r.level)+'</div><p class="case-excerpt">'+riskEscape(r.description)+'</p><div class="related-report-meta"><span>'+riskEscape(r.id)+' · 审核：'+date(r.reviewedAt||r.publishedAt)+'</span><span class="related-open">查看详情 →</span></div></button>').join('')+'</div>':'<p class="related-empty">暂无其他已审核通报</p>')+'</section>';
}
function openRelatedReport(id){
  const raw=load();let records;try{records=riskReadCases(raw,currentActor())}catch(e){return toast(e.message)}
  const target=records.find(r=>r.id===id);if(!target){render();return toast('这条通报已不可查看')}
  if(!filtered({cases:records}).some(r=>r.id===id)){
    filter={reason:'',appid:target.appid,time:'',keyword:target.appid};highOnly=false;
    toast('已切换至同APPID的通报列表');
  }
  selected=id;render();requestAnimationFrame(()=>{const node=document.querySelector('article.detail');if(node){node.focus({preventScroll:true});node.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}});
}
// EXTENDED_RISK_UI_END

function openSubmit(caseId=null,demo=false){try{riskRequire(currentActor(),'submit');openBasicSubmit(caseId,demo)}catch(e){toast(e.message)}}
function closeModal(force=false){
  if(editDraft&&!force){syncEditor();const original=riskGetRecord(load(),editDraft.id);const dirty=editDraft.description!==original.description||editDraft.reason!==(original.reason||rootCase(load(),original)?.reason)||editDraft.level!==(original.level||'warning')||editDraft.note||JSON.stringify(editDraft.images)!==JSON.stringify(original.images);
    if(dirty){openModal('保留未提交修改','<p>修改还未保存，是否继续编辑？</p><div class="modal-footer"><button class="btn" id="discardEdit">放弃修改</button><button class="btn primary" id="keepEdit">继续编辑</button></div>','compact');$('discardEdit').onclick=()=>closeModal(true);$('keepEdit').onclick=renderEditor;return}
  }
  if(force)editDraft=null;closeBasicModal(force);
}
$('closeModal').onclick=()=>closeModal();document.addEventListener('keydown',e=>{if($('modalShade').hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const nodes=[...$('modalShade').querySelectorAll('button:not(:disabled),input:not(:disabled),textarea,select,[tabindex="0"]')].filter(x=>x.getClientRects().length);if(!nodes.length)return;const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('storage',e=>{if(e.key===RISK_KEY&&$('modalShade').hidden)render()});
$('pageTitle').textContent=isAdmin?'骗子库管理':'骗子库';$('accountName').textContent=isAdmin?'美人桥业务后台':'演示商户';render();
</script>
