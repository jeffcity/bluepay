<style>

to;max-width:100%;scrollbar-width:thin}table{border-collapse:collapse;table-layout:fixed;width:100%;min-width:2920px;font-size:13px}th,td{border:1px solid var(--line);padding:12px 12px;text-align:center;line-height:23px;overflow-wrap:anywhere;height:60px}th{color:var(--muted);font-weight:600;text-align:left;background:#fff;height:40px}tbody tr:nth-child(even){background:#fafafa}tbody tr:hover{background:#f5f7fa}.left{text-align:left}.links{white-space:normal}.link{border:0;background:transparent;color:var(--blue);font-size:12px;padding:1px 4px;white-space:nowrap}.link:hover{text-decoration:underline}.link.red{color:var(--danger)}.switch{width:40px;height:20px;background:#dcdfe6;border:0;border-radius:14px;position:relative;vertical-align:middle;padding:0;transition:background .15s}.switch::after{content:"";position:absolute;width:16px;height:16px;top:2px;left:2px;border-radius:50%;background:white;transition:left .15s}.switch.on{background:var(--blue)}.switch.on::after{left:22px}.sticky-last{position:sticky;right:0;background:#fff;z-index:2;box-shadow:-5px 0 10px #0000000a}tbody tr:nth-child(even) .sticky-last{background:#fafafa}.balance{display:flex;gap:5px;align-items:center;justify-content:center}.pagination{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:18px;font-size:13px}.pagination .control{width:96px}.page-button{border:0;background:transparent;padding:4px 8px;color:var(--text)}.page-button.current{color:var(--blue);font-weight:700}.pagination .jump{width:54px;text-align:center}.empty{height:130px;color:var(--muted);text-align:center}.shade{position:fixed;inset:0;z-index:1000;background:#0007;display:flex;align-items:center;justify-content:center;padding:20px}.modal{width:min(674px,100%);max-height:90vh;display:flex;flex-direction:column;background:#fff;border-radius:4px;box-shadow:0 10px 30px #0003}.modal-head{padding:20px 16px;background:#f5f7fa;display:flex;align-items:center;justify-content:space-between;margin:16px 16px 0}.modal-head h2{font-size:18px;font-weight:400;margin:0;color:#303133}.close{background:transparent;border:0;color:#303133;font-size:28px;line-height:28px;cursor:pointer}.modal-body{padding:12px 32px 10px;overflow:auto}.form-row{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:start;margin-bottom:18px}.form-label{line-height:32px;text-align:right;white-space:nowrap}.required::before{content:"* ";color:#f56c6c}.form-row .control{width:100%}.hint{font-size:12px;color:#909399;line-height:20px;margin:4px 0 0}.number-control{display:flex;height:32px}.number-control .control{border-radius:0;text-align:center}.number-control button{width:34px;flex:none;border:1px solid #dcdfe6;background:#f5f7fa;color:#909399;font-size:20px;line-height:24px}.number-control button:first-child{border-radius:4px 0 0 4px;border-right:0}.number-control button:last-child{border-radius:0 4px 4px 0;border-left:0}.radios{display:flex;align-items:center;gap:24px;min-height:32px}.radios label{display:flex;align-items:center;gap:7px}.radios input{accent-color:var(--blue)}.modal-foot{margin:0 16px 16px;border-top:1px solid #e4e7ed;padding:20px 22px 8px;display:flex;justify-content:flex-end;gap:12px}.form-error{color:#f56c6c;margin:0 0 10px;font-size:13px}.form-error:empty{display:none}.toast{position:fixed;z-index:2000;top:20px;left:50%;transform:translateX(-50%);padding:10px 16px;background:#ecf5ff;color:var(--blue);border:1px solid #d9ecff;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .15s}.toast.show{opacity:1}
@media(max-width:780px){.page{padding:18px 12px}.card{padding:18px 14px}.filters{gap:14px}.filter-actions{margin-left:0}.toolbar{gap:12px}.pagination{gap:6px;flex-wrap:wrap}.modal-body{padding:16px}.form-row{grid-template-columns:106px minmax(0,1fr);gap:10px}.modal-head{padding:16px}.shade{padding:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><h1 class="page-heading">代付通道管理</h1><main class="page"><section class="card"><div class="filters"><input class="control keyword" id="keyword" placeholder="名称/商户号/编码模糊查询" aria-label="名称/商户号/编码模糊查询"><label class="filter-field">通道类型<select class="control" id="productFilter"></select></label><label class="filter-field">通道用途<select class="control" id="categoryFilter"><option value="">请选择通道用途</option><option>普通</option><option>下分</option></select></label><label class="filter-field">通道商<select class="control" id="providerFilter"><option value="">请选择通道商</option><option>新万能通道商</option><option>远航演示通道商</option><option>北辰演示通道商</option></select></label><label class="filter-field">状态<select class="control" id="statusFilter"><option value="">请选择状态</option><option value="true">开启</option><option value="false">关闭</option></select></label><div class="filter-actions"><button class="btn primary" id="search">查询</button><button class="btn" data-demo-action="开启置顶">开启置顶</button></div></div><div class="toolbar"><button class="btn danger" data-demo-action="一键编辑配置">一键编辑配置</button><button class="btn" data-demo-action="一键编辑回调">一键编辑回调<span class="badge">99+</span></button><button class="btn muted" id="addChannel">添加代付通道</button></div><div class="table-wrap"><table id="channelTable"><colgroup id="channelCols"></colgroup><thead><tr id="channelHead"></tr></thead><tbody id="channelRows"></tbody></table></div><footer class="pagination"><span id="total"></span><select class="control" id="pageSize" aria-label="每页条数"><option value="10">10条/页</option><option value="20">20条/页</option><option value="50">50条/页</option></select><button class="page-button" id="prev" aria-label="上一页">‹</button><span id="pages"></span><button class="page-button" id="next" aria-label="下一页">›</button><span>前往</span><input class="control jump" id="jump" type="number" min="1" value="1" aria-label="页码"><span>页</span></footer></section></main><div id="modalRoot"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
// PAYOUT_CHANNEL_MODEL_START
const PAYOUT_CHANNEL_STORAGE_KEY = 'bluepay.payout-channel-demo.v1';
const PAYOUT_CHANNEL_PRODUCTS = {
  'DEMO-CRYPTO': '【DEMO-CRYPTO】虚拟币代付演示产品',
  'DEMO-BANK': '【DEMO-BANK】银行卡代付演示产品',
  'DEMO-CNY': '【DEMO-CNY】人民币代付演示产品',
};
function payoutChannelSeed() {
  const providers=['新万能通道商','远航演示通道商','北辰演示通道商'];
  const channels=Array.from({length:41},(_,i)=>({id:'PC-DEMO-'+String(i+1).padStart(3,'0'),name:i===0?'新万能下分演示通道':i===1?'远航下分演示通道':i===2?'北辰停用下分演示通道':'普通代付演示通道 '+String(i-2).padStart(2,'0'),category:i<3?'下分':'普通',productType:i<3||i%3===0?'DEMO-CRYPTO':i%3===1?'DEMO-BANK':'DEMO-CNY',provider:providers[i%3],interface:i<3||i%3===0?'USDT':'chpay',code:'DEMO-CHANNEL-'+String(i+1).padStart(3,'0'),enabled:i!==2,tg:false,balance:0,usdtBalance:0,limited:false,successRate:'0%',weight:i===3?8:1,rate:0,singleFee:0,agentProfit:0,agentName:'—',acceptCallback:true,callbackTime:0,group:''}));
  return {version:1,nextId:42,channels};
}
function readPayoutChannelState() {
  try {
    if(typeof localStorage==='undefined')return payoutChannelSeed();
    const raw=localStorage.getItem(PAYOUT_CHANNEL_STORAGE_KEY);
    if(!raw)return payoutChannelSeed();
    const state=JSON.parse(raw);
    if(state.version!==1||!Array.isArray(state.channels)||!Number.isInteger(state.nextId)||state.nextId<1||new Set(state.channels.map(c=>c.id)).size!==state.channels.length||state.channels.some(c=>!c.id||!c.name||!['普通','下分'].includes(c.category)||typeof c.enabled!=='boolean'))return payoutChannelSeed();
    return state;
  }catch{return payoutChannelSeed()}
}
function savePayoutChannelState(state) {
  try {localStorage.setItem(PAYOUT_CHANNEL_STORAGE_KEY,JSON.stringify(state))}
  catch {throw new Error('通道资料保存失败，请检查浏览器存储后重试')}
}
function eligiblePayoutChannels(state) {return state.channels.filter(c=>c.category==='下分'&&c.enabled)}
function filterPayoutChannels(state,q={}) {const needle=String(q.keyword||'').trim().toLowerCase();return state.channels.filter(c=>(!needle||[c.name,c.code,c.id].some(v=>String(v).toLowerCase().includes(needle)))&&(!q.productType||c.productType===q.productType)&&(!q.category||c.category===q.category)&&(!q.provider||c.provider===q.provider)&&(q.enabled===''||q.enabled==null||c.enabled===(q.enabled==='true'||q.enabled===true)))}
function payoutChannelFields(input) {
  const data={name:String(input.name||'').trim(),interface:input.interface,provider:input.provider,category:input.category,weight:Number(input.weight),group:String(input.group||'').trim(),enabled:input.enabled};
  if(!['chpay','USDT'].includes(data.interface))throw new Error('请选择接口类型');
  if(!data.provider)throw new Error('请选择通道商');
  if(!['普通','下分'].includes(data.category))throw new Error('请选择通道用途');
  data.productType = validatePayoutChannelProduct(input.productType, data.category);
  if(!data.name)throw new Error('请输入通道名称');
  if(!Number.isInteger(data.weight)||data.weight<1||data.weight>9)throw new Error('权重须为1至9的整数');
  if(typeof data.enabled!=='boolean')throw new Error('请选择状态');
  return data;
}
function payoutChannelProductRequired(category) {
  return category !== '下分';
}
function validatePayoutChannelProduct(value, category) {
  const productType = String(value ?? '').trim();
  if (!productType && !payoutChannelProductRequired(category)) return '';
  if (!Object.hasOwn(PAYOUT_CHANNEL_PRODUCTS, productType)) throw new Error('请选择通道类型');
  return productType;
}
function setPayoutChannelProduct(state, id, productType) {
  const channel = state.channels.find(c => c.id === id);
  if (!channel) throw new Error('通道已不存在，请刷新列表');
  channel.productType = validatePayoutChannelProduct(productType, channel.category);
}
function savePayoutChannel(state, id, input) {
  if (id) {
    const channel = state.channels.find(c => c.id === id);
    if (!channel) throw new Error('通道已不存在，请刷新列表');
    if (input.category !== undefined && input.category !== channel.category) {
      throw new Error('通道用途创建后不可修改');
    }
    const fields = payoutChannelFields({ ...input, category: channel.category });
    Object.assign(channel, fields);
    return channel;
  }

  const fields = payoutChannelFields(input);
  const channel = {
    ...payoutChannelSeed().channels[0], ...fields,
    id: 'PC-DEMO-' + String(state.nextId).padStart(3,'0'),
    code: '—', balance: 0, usdtBalance: 0,
  };
  state.nextId++;
  state.channels.unshift(channel);
  return channel;
}
// PAYOUT_CHANNEL_MODEL_END

const $=id=>document.getElementById(id),esc=text=>String(text??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CHANNEL_HEADERS=['','通道名称','操作','主类型','通道用途','三方编码','通道商','接口类型','状态','TG 通知','余额','USDT金额','限额','成功率','权重','通道费率','单笔费用','代理总利润','代理名称','接受回调','回调时间','操作'];
let state=readPayoutChannelState(),query={},page=1,size=10,selected=new Set(),returnFocus=null;
function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),2000)}
const action=(id,label,extra='')=>`<button type="button" class="link ${label==='删除'?'red':''}" data-id="${esc(id)}" data-action="${label}" ${extra}>${label}</button>`;
const toggle=(c,key,label)=>`<button type="button" class="switch ${c[key]?'on':''}" role="switch" aria-checked="${c[key]}" aria-label="${esc(c.name+' '+label)}" data-toggle="${key}" data-id="${c.id}"></button>`;
function channelCells(c){return [`<input type="checkbox" data-select="${c.id}" aria-label="选择 ${esc(c.name)}" ${selected.has(c.id)?'checked':''}>`,esc(c.name),action(c.id,'编辑')+action(c.id,'绑定商户')+'<br>'+action(c.id,'选择类型'),esc(PAYOUT_CHANNEL_PRODUCTS[c.productType] ?? '—'),esc(c.category),esc(c.code),esc(c.provider),esc(c.interface),toggle(c,'enabled','状态'),toggle(c,'tg','TG通知'),`<div class="balance">${c.balance}${action(c.id,'调额','data-field="balance"')}</div>`,`<div class="balance">${c.usdtBalance}${action(c.id,'调额','data-field="usdtBalance"')}</div>`,toggle(c,'limited','限额')+'<br>'+action(c.id,'关闭'),c.successRate,c.weight+' '+action(c.id,'设置','data-field="weight"'),c.rate+' '+action(c.id,'设置','data-field="rate"'),Number(c.singleFee).toFixed(4)+' '+action(c.id,'设置','data-field="singleFee"'),c.agentProfit+' '+action(c.id,'设置','data-field="agentProfit"'),esc(c.agentName)+' '+action(c.id,'设置','data-field="agentName"'),toggle(c,'acceptCallback','接受回调'),c.callbackTime,['费率','限额','开发','测试','删除'].map(label=>action(c.id,label)).join(' ')]}
function render(){state=readPayoutChannelState();const rows=filterPayoutChannels(state,query),count=Math.max(1,Math.ceil(rows.length/size));page=Math.min(Math.max(page,1),count);$('channelRows').innerHTML=rows.length?rows.slice((page-1)*size,page*size).map(c=>`<tr>${channelCells(c).map((cell,i)=>`<td class="${[1,2,3,4,5,6].includes(i)?'left ':''}${i===CHANNEL_HEADERS.length-1?'sticky-last links':''}">${cell}</td>`).join('')}</tr>`).join(''):'<tr><td class="empty" colspan="${CHANNEL_HEADERS.length}">暂无数据</td></tr>';$('total').textContent='共 '+rows.length+' 条';$('pages').innerHTML=Array.from({length:count},(_,i)=>`<button class="page-button ${page===i+1?'current':''}" data-page="${i+1}">${i+1}</button>`).join('');$('prev').disabled=page===1;$('next').disabled=page===count;$('jump').max=count;$('jump').value=page;$('selectAll').checked=!!rows.length&&rows.every(c=>selected.has(c.id))}
function closeModal(){$('modalRoot').innerHTML='';if(returnFocus?.isConnected)returnFocus.focus();document.body.style.overflow=''}
function openModal(title,body,onSave){returnFocus=document.activeElement;$('modalRoot').innerHTML=`<div class="shade"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modal-head"><h2 id="modalTitle">${esc(title)}</h2><button class="close" aria-label="关闭此对话框" data-close>×</button></header><div class="modal-body">${body}<p class="form-error" id="formError" role="status"></p></div><footer class="modal-foot"><button class="btn primary" id="saveModal">确 定</button><button class="btn" data-close>取 消</button></footer></section></div>`;document.body.style.overflow='hidden';$('saveModal').onclick=()=>{try{onSave()}catch(e){$('formError').textContent=e.message}};$('modalRoot').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);$('modalRoot').querySelector('.shade').onclick=e=>{if(e.target===e.currentTarget)closeModal()};$('modalRoot').querySelector('[data-close]').focus()}
function options(values,value,placeholder){return `<option value="">${placeholder}</option>`+values.map(v=>`<option ${value===v?'selected':''}>${esc(v)}</option>`).join('')}
function productOptions(value) {
  return '<option value="">请选择通道类型</option>' +
    Object.entries(PAYOUT_CHANNEL_PRODUCTS).map(([code, label]) =>
      `<option value="${code}" ${value===code?'selected':''}>${esc(label)}</option>`
    ).join('');
}
function updateProductRequirement(input, category) {
  const required = payoutChannelProductRequired(category);
  input.required = required;
  input.labels[0]?.classList.toggle('required', required);
  input.options[0].textContent = required ? '请选择通道类型' : '不绑定代付产品';
  if ($('formError').textContent === '请选择通道类型') $('formError').textContent = '';
}
function editChannel(id) {
  state = readPayoutChannelState();
  const channel = id ? state.channels.find(c => c.id === id) : null;
  if (id && !channel) return toast('通道已不存在，请刷新列表');
  const row = (label, input, required = true, labelFor = '') =>
    `<div class="form-row"><label class="form-label ${required?'required':''}" ${labelFor?`for="${labelFor}"`:''}>${label}</label><div>${input}</div></div>`;
  const body =
    row('接口类型', `<select class="control" id="editInterface" aria-label="接口类型">${options(['chpay','USDT'],channel?.interface,'请选择接口类型')}</select>`) +
    row('通道商', `<select class="control" id="editProvider" aria-label="通道商">${options(['新万能通道商','远航演示通道商','北辰演示通道商'],channel?.provider,'请选择通道商')}</select>`) +
    row('通道类型', `<select class="control" id="editProductType" aria-label="通道类型">${productOptions(channel?.productType)}</select>`, true, 'editProductType') +
    row('通道用途', channel
      ? `<input class="control" id="editCategory" aria-label="通道用途" aria-describedby="channelPurposeHint" value="${esc(channel.category)}" readonly><p class="hint" id="channelPurposeHint">通道用途创建后不可修改</p>`
      : `<select class="control" id="editCategory" aria-label="通道用途">${options(['普通','下分'],null,'请选择通道用途')}</select>`, !channel) +
    row('通道名称', `<input class="control" id="editName" aria-label="通道名称" placeholder="请输入通道名称" value="${esc(channel?.name||'')}">`) +
    row('权重[1-9]', `<div class="number-control"><button type="button" data-step="-1" aria-label="减少数值">−</button><input class="control" id="editWeight" type="number" min="1" max="9" step="1" value="${channel?.weight||1}" aria-label="权重[1-9]"><button type="button" data-step="1" aria-label="增加数值">+</button></div>`) +
    row('机器人群组ID', `<input class="control" id="editGroup" aria-label="机器人群组ID" placeholder="示例：XXX2222" value="${esc(channel?.group||'')}"><p class="hint">机器人仅在此群监听本通道需通知的关键词</p>`, false) +
    row('状态', `<div class="radios"><label><input type="radio" name="enabled" value="true" ${channel?.enabled===true?'checked':''}>开启</label><label><input type="radio" name="enabled" value="false" ${channel?.enabled===false?'checked':''}>关闭</label></div>`);
  openModal(id?'编辑':'新增', body, () => {
    const enabled = document.querySelector('input[name="enabled"]:checked');
    const fresh = readPayoutChannelState();
    savePayoutChannel(fresh, id, {
      interface: $('editInterface').value,
      provider: $('editProvider').value,
      productType: $('editProductType').value,
      category: $('editCategory').value,
      name: $('editName').value,
      weight: $('editWeight').value,
      group: $('editGroup').value,
      enabled: enabled ? enabled.value === 'true' : undefined,
    });
    savePayoutChannelState(fresh);
    closeModal();
    render();
    toast('通道已保存');
  });
  const product = $('editProductType');
  const category = $('editCategory');
  updateProductRequirement(product, category.value);
  if (!channel) category.onchange = () => updateProductRequirement(product, category.value);
  document.querySelectorAll('[data-step]').forEach(button => {
    button.onclick = () => {
      $('editWeight').value = Math.max(1, Math.min(9, Number($('editWeight').value) + Number(button.dataset.step)));
    };
  });
}

function typeChannel(id) {
  const channel = readPayoutChannelState().channels.find(c => c.id === id);
  if (!channel) return toast('通道已不存在，请刷新列表');
  openModal('选择类型', `<div class="form-row">
    <label class="form-label required" for="setProductType">通道类型</label>
    <select class="control" id="setProductType">${productOptions(channel.productType)}</select>
  </div>`, () => {
    const fresh = readPayoutChannelState();
    setPayoutChannelProduct(fresh,id,$('setProductType').value);
    savePayoutChannelState(fresh);
    closeModal();
    render();
    toast('通道类型已保存');
  });
  const product = $('setProductType');
  updateProductRequirement(product, channel.category);
  product.focus();
}
function search(){query={keyword:$('keyword').value,productType:$('productFilter').value,category:$('categoryFilter').value,provider:$('providerFilter').value,enabled:$('statusFilter').value};page=1;render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=Number(b.dataset.page);render();return}if(b.dataset.toggle){try{const fresh=readPayoutChannelState(),c=fresh.channels.find(c=>c.id===b.dataset.id);if(!c)throw new Error('通道已不存在');c[b.dataset.toggle]=!c[b.dataset.toggle];savePayoutChannelState(fresh);render()}catch(error){toast(error.message)}return}if(b.dataset.action){const id=b.dataset.id,label=b.dataset.action;if(label==='编辑')return editChannel(id);if(label==='选择类型')return typeChannel(id);if(label==='删除'){openModal('删除通道','<p>确认删除该演示通道？</p>',()=>{const fresh=readPayoutChannelState();fresh.channels=fresh.channels.filter(c=>c.id!==id);savePayoutChannelState(fresh);selected.delete(id);closeModal();render();toast('通道已删除')});return}toast('已选择'+label);return}if(b.dataset.demoAction)toast('已选择'+b.dataset.demoAction)});
document.addEventListener('change',e=>{if(e.target.dataset.select){if(e.target.checked)selected.add(e.target.dataset.select);else selected.delete(e.target.dataset.select)}if(e.target.id==='selectAll'){for(const c of filterPayoutChannels(state,query)){if(e.target.checked)selected.add(c.id);else selected.delete(c.id)}render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modalRoot').innerHTML){closeModal();return}if(e.key==='Enter'&&e.target.id==='keyword')search();if(e.key==='Tab'&&$('modalRoot').innerHTML){const nodes=[...$('modalRoot').querySelectorAll('button,input,select')].filter(n=>!n.disabled&&n.getClientRects().length),first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('search').onclick=search;$('addChannel').onclick=()=>editChannel();$('pageSize').onchange=()=>{size=Number($('pageSize').value);page=1;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('jump').onchange=()=>{page=Number($('jump').value)||1;render()};addEventListener('storage',e=>{if(e.key===PAYOUT_CHANNEL_STORAGE_KEY)render()});
$('productFilter').innerHTML=productOptions();
const widths=[50,220,170,175,120,170,160,90,90,100,120,120,100,90,105,110,110,120,120,100,110,200];$('channelCols').innerHTML=widths.map(w=>`<col style="width:${w}px">`).join('');$('channelHead').innerHTML=CHANNEL_HEADERS.map((label,i)=>`<th class="${i===CHANNEL_HEADERS.length-1?'sticky-last':''}">${i===0?'<input type="checkbox" id="selectAll" aria-label="全选通道">':label}</th>`).join('');render();
</script></body></html>
