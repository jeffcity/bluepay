  <style>

    .page-shell{min-height:100vh}.portal-top{height:64px;display:flex;align-items:center;gap:18px;padding:0 24px;border-bottom:1px solid var(--line);background:#fff}.menu-glyph{font-size:20px;color:#4d5260}.portal-top h1{margin:0;font-size:20px;color:var(--ink);font-weight:700}.top-actions{margin-left:auto;display:flex;align-items:center;gap:20px}.help{border:0;background:transparent;color:#676c78}.avatar{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:#fff;background:linear-gradient(135deg,#7256c9,#2d58e9);font-size:12px;font-weight:700}.account{color:#2d3039}.logout{height:36px;padding:0 17px;border:1px solid #dfe2e8;border-radius:8px;background:#fff;color:#565b66}.content{padding:20px}.card{background:#fff;border-radius:9px;box-shadow:0 2px 12px rgba(31,39,63,.035);padding:20px 24px 18px}.card[hidden]{display:none}.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.card-title{display:flex;align-items:center;gap:10px;margin:0;color:#2f3240;font-size:16px}.card-title::before{content:"";width:4px;height:20px;border-radius:3px;background:var(--primary)}.btn{height:36px;padding:0 18px;border:1px solid #dfe2e8;border-radius:6px;background:#fff;color:#626875;transition:color .2s,border-color .2s,background .2s}.btn:hover{border-color:#93a9ff;color:var(--primary)}.btn.primary{border-color:var(--primary);background:var(--primary);color:#fff}.btn.primary:hover{border-color:var(--primary-dark);background:var(--primary-dark);color:#fff}.btn.query{background:#fff;color:var(--primary);border-color:var(--primary)}.filters{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:14px 20px;margin-bottom:16px}.field{display:flex;align-items:center;gap:10px;min-width:0}.field label{flex:0 0 auto;color:#383c49;font-weight:600}.control{min-width:0;width:100%;height:36px;padding:0 12px;border:1px solid transparent;border-radius:4px;background:var(--soft);color:#5f6471}.control::placeholder{color:#b3b7c0}.control:focus{border-color:#9eb1ff;background:#fff;outline:2px solid rgba(36,84,245,.08)}.date-range{grid-column:span 2;display:grid;grid-template-columns:auto minmax(120px,1fr) 24px minmax(120px,1fr);align-items:center;gap:8px}.date-range label{font-weight:600;color:#383c49}.date-range span{text-align:center;color:#656a75}.filter-actions{display:flex;align-items:center;gap:14px}.table-wrap{overflow:auto}table{width:100%;min-width:1840px;border-collapse:collapse;table-layout:fixed}col.order{width:185px}col.staff{width:125px}col.merchant{width:130px}col.processor{width:110px}col.method{width:105px}col.time{width:165px}col.money{width:110px}col.rate{width:170px}col.status{width:105px}col.address{width:255px}col.action{width:85px}th,td{height:48px;padding:8px 12px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--line)}th{height:45px;background:#f7f8fb;color:#303440;font-weight:700}tbody tr:nth-child(even){background:#f8f9fc}tbody tr:hover{background:#f1f4ff}.order-cell{display:flex;align-items:center;gap:8px;text-align:left}.copy{width:28px;height:28px;padding:0;border:0;background:transparent;color:#747b89}.copy:hover{color:var(--primary)}.currency-tag{display:inline-flex;min-width:54px;justify-content:center;padding:2px 8px;border-radius:4px;color:#3156c9;background:#eef3ff;font-size:12px}.currency-tag.trx{color:#8a5b00;background:#fff7e6}.status{display:inline-flex;padding:2px 8px;border-radius:4px;font-size:12px}.status.done{color:#409c2c;background:#f0f9eb}.status.pending{color:#c17700;background:#fff7e6}.status.expired{color:#8a9099;background:#f4f4f5}.status.rejected{color:#d95b5b;background:#fff0f0}.link{border:0;background:transparent;color:#3867e9;padding:7px}.pager{min-height:64px;display:flex;align-items:center;justify-content:flex-end;gap:9px;color:#727783}.pager .total{margin-right:auto}.page-btn{width:32px;height:32px;border:1px solid #e4e6eb;border-radius:4px;background:#fff;color:#636875}.page-btn.active{border-color:var(--primary);color:var(--primary)}.page-btn:disabled{opacity:.4}.page-size{height:34px;padding:0 9px;border:1px solid #e2e5eb;border-radius:5px;background:#fff;color:#6a6f7a}.jump{width:54px;height:34px;border:1px solid #e2e5eb;border-radius:5px;text-align:center}
    .portal-crumb{display:flex;align-items:center;gap:9px;color:#9399a6;font-size:16px}.portal-crumb[hidden],.top-actions[hidden]{display:none}.portal-crumb b{font-weight:400;color:#a3a8b3}.portal-crumb strong{font-weight:400;color:#293042}
    #createView{min-height:calc(100vh - 104px);padding:34px 27px 40px;border-radius:8px;box-shadow:none}.create-head{padding:0;border:0}.create-head h2{margin:0 0 6px;color:#160047;font-size:24px;font-weight:700}.create-head p{margin:0;color:#a0a4af;font-size:16px}.create-form{width:770px;max-width:100%;padding:38px 0 0}.form-row{display:grid;grid-template-columns:140px minmax(0,590px);align-items:center;gap:20px;margin-bottom:30px}.form-label{padding:0;text-align:left;color:#160047;font-size:16px;font-weight:600}.required::before{content:"*";margin-right:4px;color:var(--danger)}.form-content{min-width:0}.form-content>.control{width:590px;max-width:100%;height:60px;padding:0 24px;border:0;border-radius:6px;background:#f2f4f9;color:#17073f;font-size:16px}.method-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:590px;max-width:100%}.method-tab{height:60px;border:1px solid #d8ddea;border-radius:6px;background:#fff;color:#858a96;font-size:16px;transition:color .2s,border-color .2s,background .2s}.method-tab:hover{border-color:#0d50f6;color:#0d50f6}.method-tab.active{border-color:#0d50f6;background:#0d50f6;color:#fff;font-weight:600}.method-tab:disabled{cursor:not-allowed;opacity:.72}.amount-box{display:flex;width:590px;max-width:100%;height:60px;border:0;border-radius:6px;background:#f2f4f9;overflow:hidden}.amount-box:focus-within{box-shadow:0 0 0 2px rgba(13,80,246,.14)}.amount-box input{min-width:0;flex:1;padding:0 16px;border:0;outline:0;background:transparent;color:#17073f;font-size:16px}.amount-box input::placeholder{color:#b1b5be}.amount-box input:disabled{cursor:not-allowed;background:#f2f4f9;color:#7f8490}.amount-unit{min-width:72px;display:grid;place-items:center;padding:0 14px;border-right:1px solid #dfe3ec;background:transparent;color:#767c89;font-size:15px;font-weight:600}.rate-card{display:flex;align-items:center;justify-content:flex-end;gap:3px;width:590px;max-width:100%;margin-top:10px;padding:0;border:0;background:transparent;color:#969ba6;font-size:12px}.rate-caption{color:#969ba6}.rate-value{color:#0d50f6;font-weight:500}.rate-meta{margin:0 0 0 8px;color:#969ba6}.rate-card.rate-error{justify-content:flex-start;color:var(--danger)}.rate-error .rate-caption{display:none}.rate-error .rate-value{color:var(--danger)}.rate-error .rate-meta{display:none}.form-error{min-height:20px;margin-top:7px;color:var(--danger);font-size:13px}.create-actions{display:flex;justify-content:center;gap:36px;width:770px;max-width:100%;margin-top:142px;padding:0;border:0}.create-actions .btn{width:138px;height:46px;border-radius:5px;color:#160047;font-size:16px;font-weight:600}.create-actions .btn.primary{border-color:#190050;background:#190050;color:#fff}.toast{position:fixed;right:20px;bottom:20px;z-index:90;padding:11px 16px;border-radius:6px;background:#303744;color:#fff;box-shadow:0 10px 28px rgba(20,28,42,.24);opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s;pointer-events:none}.toast.show{opacity:1;transform:none}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
    @media(max-width:1300px){.filters{grid-template-columns:repeat(3,minmax(180px,1fr))}.date-range{grid-column:span 2}.filter-actions{grid-column:1/-1;justify-content:flex-start}.content{padding:16px}}
    @media(max-width:760px){html,body{min-width:0}.portal-top{padding:0 14px}.help,.account{display:none}.content{padding:10px}.card{padding:16px 12px}.filters{grid-template-columns:1fr}.date-range{grid-column:auto;grid-template-columns:1fr 22px 1fr}.date-range label{grid-column:1/-1}.filter-actions{justify-content:flex-start}.pager{justify-content:flex-start;overflow:auto}.pager .total{margin-right:0}#createView{padding:24px 18px}.create-head h2{font-size:22px}.create-form{padding-top:30px}.form-row{grid-template-columns:1fr;gap:9px;margin-bottom:24px}.form-label{text-align:left}.method-tabs{gap:8px}.method-tab{height:52px;font-size:14px}.create-actions{margin-top:72px;gap:16px}}
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="portal-top"><span class="menu-glyph" aria-hidden="true">☰</span><h1 id="portalTitle">订单列表</h1><div class="portal-crumb" id="portalCrumb" hidden><span>订单列表</span><b>&gt;</b><strong id="portalCurrent">创建订单</strong></div><div class="top-actions" id="topActions"><button class="help" type="button">帮助</button><span class="avatar">DE</span><span class="account">演示商户</span><button class="logout" type="button">退出</button></div></header>
    <main class="content">
      <section class="card" id="listView" aria-label="美人桥商户订单列表">
        <header class="card-head"><h2 class="card-title">订单列表</h2><button class="btn primary" id="addBtn" type="button">＋ 添加</button></header>
        <div class="filters">
          <div class="field"><input class="control" id="orderNo" placeholder="请输入订单号" aria-label="订单号"></div>
          <div class="field"><label for="merchantName">商户名称</label><input class="control" id="merchantName" placeholder="请输入商户名称"></div>
          <div class="field"><label for="method">充值方式</label><select class="control" id="method"><option value="">请选择充值方式</option><option value="人民币">人民币充值</option><option value="USDT">USDT充值</option><option value="TRX">TRX充值</option></select></div>
          <div class="field"><label for="status">订单状态</label><select class="control" id="status"><option value="">请选择订单状态</option><option value="pending">待处理</option><option value="done">已处理</option><option value="expired">已过期</option><option value="rejected">拒绝</option></select></div>
          <div class="date-range"><label>提交时间</label><input class="control" id="startAt" placeholder="开始日期" aria-label="开始日期"><span>至</span><input class="control" id="endAt" placeholder="结束日期" aria-label="结束日期"></div>
          <div class="filter-actions"><button class="btn query" id="queryBtn" type="button">查询</button><button class="btn" id="resetBtn" type="button">重置</button></div>
        </div>
        <div class="table-wrap"><table><colgroup><col class="order"><col class="staff"><col class="merchant"><col class="processor"><col class="method"><col class="time"><col class="time"><col class="money"><col class="money"><col class="rate"><col class="money"><col class="status"><col class="address"><col class="action"></colgroup><thead><tr><th>订单号</th><th>美人桥工号</th><th>商户</th><th>处理人</th><th>充值币种</th><th>提交时间</th><th>处理时间</th><th>上分金额（CNY）</th><th>应转数量</th><th>兑CNY汇率</th><th>浮动数量</th><th>状态</th><th>收款地址</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
        <footer class="pager"><span class="total" id="total">共 0 条</span><button class="page-btn" disabled aria-label="上一页">‹</button><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">3</button><button class="page-btn">4</button><button class="page-btn">5</button><button class="page-btn">6</button><span>•••</span><button class="page-btn">9</button><button class="page-btn" aria-label="下一页">›</button><select class="page-size" aria-label="每页条数"><option>10条/页</option><option>20条/页</option></select><span>前往</span><input class="jump" type="number" value="1" min="1" max="9" aria-label="页码"><span>页</span></footer>
      </section>
      <section class="card" id="createView" aria-label="创建充值订单" hidden>
        <header class="create-head"><h2 id="createTitle">创建充值订单</h2><p>支持人民币充值、USDT充值和TRX充值</p></header>
        <div class="create-form">
          <div class="form-row"><label class="form-label required" for="createMerchant">选择充值子商户</label><div class="form-content"><select class="control" id="createMerchant"><option value="演示商户">演示商户</option><option value="测试商户">测试商户</option><option value="演示商户 B">演示商户 B</option><option value="演示商户 C">演示商户 C</option></select></div></div>
          <div class="form-row"><span class="form-label required">充值方式</span><div class="form-content"><div class="method-tabs" role="group" aria-label="充值方式"><button class="method-tab active" type="button" data-method="人民币" aria-pressed="true">人民币充值</button><button class="method-tab" type="button" data-method="USDT" aria-pressed="false">USDT充值</button><button class="method-tab" type="button" data-method="TRX" aria-pressed="false">TRX充值</button></div></div></div>
          <div class="form-row"><label class="form-label required" for="createAmount" id="createAmountLabel">请输入金额</label><div class="form-content"><div class="amount-box"><span class="amount-unit" id="amountUnit">¥</span><input id="createAmount" type="text" inputmode="decimal" placeholder="请输入人民币金额"></div><div class="rate-card" id="rateCard"><span class="rate-caption">参考汇率</span><span class="rate-value" id="rateValue">1CNY≈1.00000CNY</span><span class="rate-meta" id="rateMeta"></span></div><div class="form-error" id="formError" role="alert"></div></div></div>
        </div>
        <footer class="create-actions"><button class="btn" id="cancelOrder" type="button">放弃</button><button class="btn primary" id="saveOrder" type="button">提交</button></footer>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const beautyRateStorageKey='bluepay.beauty-merchant-cny-rates.v3';
    const trxCreditRule='TRX 到账后直接上分 CNY，不经过 USDT 中转';
    const defaultBeautyRateSettings={USDT:8,TRX:.95,defaultEnabled:{USDT:true,TRX:false}};
    function loadBeautyRateSettings(){try{const saved=JSON.parse(localStorage.getItem(beautyRateStorageKey)||'{}');return {...defaultBeautyRateSettings,...saved,defaultEnabled:{...defaultBeautyRateSettings.defaultEnabled,...saved.defaultEnabled}}}catch{return {...defaultBeautyRateSettings,defaultEnabled:{...defaultBeautyRateSettings.defaultEnabled}}}}
    const beautyRateSettings=loadBeautyRateSettings();
    const methodConfig={
      人民币:{currency:'CNY',label:'请输入金额',unit:'¥',placeholder:'请输入人民币金额',digits:2},
      USDT:{currency:'USDT',label:'请输入USDT数量',unit:'USDT',placeholder:'请输入USDT数量',digits:6},
      TRX:{currency:'TRX',label:'请输入TRX数量',unit:'TRX',placeholder:'请输入TRX数量',digits:6}
    };
    const onlineUsdtCnyRate=6.71;
    function quoteFor(method){const config=methodConfig[method];if(config.currency==='CNY')return {...config,effective:1,source:'人民币原币充值'};if(config.currency==='USDT'&&!beautyRateSettings.defaultEnabled.USDT)return {...config,effective:onlineUsdtCnyRate,source:'线上 USDT/CNY 汇率'};if(config.currency==='TRX'&&!beautyRateSettings.defaultEnabled.TRX)return {...config,effective:0,source:'',error:'TRX 默认汇率未启用，当前无法创建 TRX 充值订单'};const effective=Number(beautyRateSettings[config.currency]);return {...config,effective:Number.isFinite(effective)&&effective>0?effective:0,source:'美人桥订单管理默认汇率设置',error:'默认汇率无效，当前无法创建订单'}}
    const orders=[
      {no:'MB-DEMO-20260903-TRX',staff:'DEMO-A01',merchant:'演示商户',processor:'',method:'TRX',submitted:'2026.09.03 10:18:26',processed:'—',creditCny:950,payAmount:1000,rate:.95,floatAmount:0,status:'pending',address:'TDEMOTrx9zP4kX7vM2qR5sL8nC1wF6a'},
      {no:'MB-DEMO-20260902-001',staff:'DEMO-A01',merchant:'演示商户',processor:'演示员',method:'USDT',submitted:'2026.09.02 09:32:18',processed:'2026.09.02 09:33:06',creditCny:669,payAmount:100,rate:6.69,floatAmount:0,status:'done',address:'TDEMO9zP4kX7vM2qR5sL8nC1wF6aB3h'},
      {no:'MB-DEMO-20260901-002',staff:'DEMO-A01',merchant:'演示商户',processor:'',method:'USDT',submitted:'2026.09.01 18:12:40',processed:'—',creditCny:67.1,payAmount:10,rate:6.71,floatAmount:0,status:'expired',address:'TDEMO3fH8mQ2xV7pL5kN9rS1cW6yA4b'},
      {no:'MB-DEMO-20260901-003',staff:'DEMO-A02',merchant:'测试商户',processor:'演示员',method:'人民币',submitted:'2026.09.01 15:39:58',processed:'2026.09.01 15:40:24',creditCny:100,payAmount:100,rate:1,floatAmount:0,status:'rejected',address:'线下人民币收款'},
      {no:'MB-DEMO-20260831-004',staff:'DEMO-A02',merchant:'测试商户',processor:'演示员',method:'USDT',submitted:'2026.08.31 15:39:01',processed:'2026.08.31 15:39:45',creditCny:679,payAmount:100,rate:6.79,floatAmount:0,status:'done',address:'TDEMO7wR2nK5pL9xQ4mC8sV1aF6hB3y'},
      {no:'MB-DEMO-20260830-005',staff:'DEMO-A03',merchant:'演示商户 B',processor:'演示员',method:'USDT',submitted:'2026.08.30 15:37:58',processed:'2026.08.30 15:38:28',creditCny:67.9,payAmount:10,rate:6.79,floatAmount:0,status:'rejected',address:'TDEMO7wR2nK5pL9xQ4mC8sV1aF6hB3y'},
      {no:'MB-DEMO-20260829-006',staff:'DEMO-A03',merchant:'演示商户 B',processor:'演示员',method:'USDT',submitted:'2026.08.29 15:36:31',processed:'2026.08.29 15:37:45',creditCny:67.9,payAmount:10,rate:6.79,floatAmount:0,status:'done',address:'TDEMO2mX8qR4vK7nP5sL9cW1aF6hB3y'},
      {no:'MB-DEMO-20260828-007',staff:'DEMO-A04',merchant:'演示商户 C',processor:'演示员',method:'USDT',submitted:'2026.08.28 20:44:04',processed:'2026.08.28 20:44:23',creditCny:67.7,payAmount:10,rate:6.77,floatAmount:0,status:'done',address:'TDEMO2mX8qR4vK7nP5sL9cW1aF6hB3y'},
      {no:'MB-DEMO-20260827-008',staff:'DEMO-A04',merchant:'演示商户 C',processor:'演示员',method:'USDT',submitted:'2026.08.27 20:43:10',processed:'2026.08.27 20:43:26',creditCny:67.7,payAmount:10,rate:6.77,floatAmount:0,status:'done',address:'TDEMO5pL9xQ4mC8sV1aF6hB3yR2nK7w'}
    ];
    const $=id=>document.getElementById(id);const statusText={pending:'待处理',done:'已处理',expired:'已过期',rejected:'拒绝'};let editing=null;let activeMethod='人民币';
    function money(value,digits=2){return Number(value).toLocaleString('zh-CN',{minimumFractionDigits:digits,maximumFractionDigits:digits})}
    function payText(item){const currency=methodConfig[item.method].currency;return `${money(item.payAmount,currency==='CNY'?2:6)} ${currency}`}
    function rateText(item){const currency=methodConfig[item.method].currency;return currency==='CNY'?'1 CNY ≈ 1 CNY':`1 ${currency} ≈ ${money(item.rate,currency==='TRX'?4:2)} CNY`}
    function floatText(item){const currency=methodConfig[item.method].currency;return `${money(item.floatAmount,currency==='CNY'?2:6)} ${currency}`}
    function selected(){const no=$('orderNo').value.trim().toLowerCase(),merchant=$('merchantName').value.trim().toLowerCase(),method=$('method').value,status=$('status').value;return orders.filter(item=>(!no||item.no.toLowerCase().includes(no))&&(!merchant||item.merchant.toLowerCase().includes(merchant))&&(!method||item.method===method)&&(!status||item.status===status))}
    function row(item){const currency=methodConfig[item.method].currency;return `<tr><td><div class="order-cell"><span title="${item.no}">${item.no}</span><button class="copy" type="button" data-copy="${item.no}" aria-label="复制订单号">▣</button></div></td><td>${item.staff}</td><td>${item.merchant}</td><td>${item.processor}</td><td><span class="currency-tag ${item.method==='TRX'?'trx':''}">${currency}</span></td><td>${item.submitted}</td><td>${item.processed}</td><td>${money(item.creditCny)} CNY</td><td title="${payText(item)}">${payText(item)}</td><td title="${rateText(item)}">${rateText(item)}</td><td>${floatText(item)}</td><td><span class="status ${item.status}">${statusText[item.status]}</span></td><td title="${item.address}">${item.address}</td><td><button class="link" type="button" data-edit="${item.no}">编辑</button></td></tr>`}
    function render(){const list=selected();$('rows').innerHTML=list.length?list.map(row).join(''):'<tr><td colspan="14" style="height:120px;color:#999ea8">暂无符合条件的订单</td></tr>';$('total').textContent=`共 ${list.length} 条`}
    function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
    function showList(){const wasEditing=Boolean(editing);$('listView').hidden=false;$('createView').hidden=true;$('portalTitle').hidden=false;$('portalCrumb').hidden=true;$('topActions').hidden=false;editing=null;render();return wasEditing}
    function setMethod(method){
      activeMethod=method;
      const config=methodConfig[method];
      document.querySelectorAll('[data-method]').forEach(button=>{const active=button.dataset.method===method;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))});
      $('createAmountLabel').textContent=config.label;
      $('amountUnit').textContent=config.unit;
      $('createAmount').placeholder=config.placeholder;
      $('createAmount').step=config.digits===2?'0.01':'0.000001';
      updateQuote();
    }
    function updateQuote(){
      const currentQuote=quoteFor(activeMethod);
      const quote=editing?{...currentQuote,effective:Number(editing.rate),source:'本单锁定汇率',error:''}:currentQuote;
      const payAmount=editing?Number(editing.payAmount):Number($('createAmount').value)||0;
      const creditCny=quote.effective?(quote.currency==='CNY'?payAmount:payAmount*quote.effective):0;
      $('rateCard').classList.toggle('rate-error',!quote.effective);
      $('rateValue').textContent=quote.effective?`1${quote.currency}≈${money(quote.effective,5)}CNY`:(quote.error||'当前不可下单');
      $('rateMeta').textContent='';
      return {quote,payAmount,creditCny};
    }
    function openEditor(item=null){editing=item;$('listView').hidden=true;$('createView').hidden=false;$('portalTitle').hidden=true;$('portalCrumb').hidden=false;$('portalCurrent').textContent=item?'编辑订单':'创建订单';$('topActions').hidden=true;$('createTitle').textContent=item?'编辑充值订单':'创建充值订单';$('createMerchant').value=item?.merchant||'演示商户';$('createAmount').value=item?.payAmount||'';$('createAmount').disabled=Boolean(item);document.querySelectorAll('[data-method]').forEach(button=>button.disabled=Boolean(item));$('formError').textContent=item?'已创建订单的充值币种、充值数量、上分金额和锁定汇率不可修改。':'';setMethod(item?.method||'人民币');if(!item)$('createAmount').focus()}
    function decimalPlaces(value){const text=String(value).trim();if(!/^(?:\d+|\d*\.\d+)$/.test(text))return Infinity;return text.includes('.')?text.split('.')[1].length:0}
    $('queryBtn').onclick=render;
    $('resetBtn').onclick=()=>{['orderNo','merchantName','startAt','endAt'].forEach(id=>$(id).value='');$('method').value='';$('status').value='';render()};
    $('addBtn').onclick=()=>openEditor();$('cancelOrder').onclick=showList;
    document.querySelector('.method-tabs').onclick=event=>{const button=event.target.closest('[data-method]');if(button&&!button.disabled)setMethod(button.dataset.method)};
    $('createAmount').addEventListener('input',updateQuote);
    $('rows').onclick=event=>{const copy=event.target.closest('[data-copy]'),edit=event.target.closest('[data-edit]');if(copy)toast(`已复制订单号 ${copy.dataset.copy}`);if(edit)openEditor(orders.find(item=>item.no===edit.dataset.edit))};
    $('saveOrder').onclick=()=>{if(editing){const lockedCurrency=methodConfig[editing.method].currency;editing.merchant=$('createMerchant').value;showList();return toast(`订单资料已更新，保留本单锁定的 ${lockedCurrency}/CNY 汇率`)}const rawAmount=$('createAmount').value,inputAmount=Number(rawAmount),config=methodConfig[activeMethod],{quote,payAmount,creditCny}=updateQuote();$('formError').textContent='';if(!inputAmount||inputAmount<=0)return $('formError').textContent=`请输入大于 0 的${config.currency==='CNY'?'金额':`${config.currency}数量`}`;if(decimalPlaces(rawAmount)>config.digits)return $('formError').textContent=`${config.currency==='CNY'?'人民币金额最多支持 2 位小数':`${config.currency}数量最多支持 6 位小数`}，且不支持科学计数法`;if(!quote.effective)return $('formError').textContent=quote.error||'汇率获取失败，暂时无法创建订单';const next={merchant:$('createMerchant').value,method:activeMethod,creditCny,payAmount,rate:quote.effective,floatAmount:0};const address=activeMethod==='TRX'?'等待分配 TRON 地址':activeMethod==='USDT'?'等待分配 USDT 地址':'等待人民币收款信息';orders.unshift({no:`MB-DEMO-20260903-${String(orders.length+1).padStart(3,'0')}`,staff:'DEMO-NEW',processor:'',submitted:'2026.09.03 11:30:00',processed:'—',status:'pending',address,...next});showList();toast(`订单已创建：应收 ${money(payAmount,quote.currency==='CNY'?2:6)} ${quote.currency}，到账后上分 ${money(creditCny)} CNY`)};
    document.querySelectorAll('.control').forEach(control=>control.addEventListener('keydown',event=>{if(event.key==='Enter'&&!$('createView').hidden)$('saveOrder').click();else if(event.key==='Enter')render()}));
    render();
  </script>
</body>
</html>
