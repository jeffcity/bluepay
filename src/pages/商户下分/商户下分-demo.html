<!-- PAGES: 商户管理 / 商户下分 / 商户充值订单 / 代付商户管理 / 代收商户管理 / 商户代付流水记录 / 商户代收流水记录 / 资金划转订单 -->
<!-- FIDELITY: high / desktop-admin / synthetic-data -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商户增加资金划转｜现状页面</title>
  <style>
    :root {
      --primary: #409eff;
      --primary-hover: #66b1ff;
      --primary-active: #3a8ee6;
      --danger: #f56c6c;
      --warning: #e6a23c;
      --success: #67c23a;
      --info: #909399;
      --page: #f2f5f8;
      --surface: #ffffff;
      --surface-soft: #f5f7fa;
      --text: #303133;
      --regular: #606266;
      --muted: #909399;
      --placeholder: #c0c4cc;
      --line: #ebeef5;
      --control-line: #dcdfe6;
      --sidebar-width: 200px;
      --header-height: 56px;
      --tabs-height: 40px;
      --title-height: 64px;
      --radius: 4px;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --shadow-float: 0 4px 14px rgba(0, 0, 0, 0.12);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-width: 1180px;
      color: var(--regular);
      background: var(--page);
      font: 14px/1.5 var(--font-ui);
    }
    button, input, select { font: inherit; }
    button, a, select { cursor: pointer; }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 2px solid #79bbff;
      outline-offset: 2px;
    }
    button:disabled { cursor: not-allowed; opacity: .55; }

    .topbar {
      position: fixed;
      z-index: 50;
      inset: 0 0 auto 0;
      height: var(--header-height);
      display: flex;
      color: #fff;
      background: linear-gradient(110deg, #409eff 0%, #65adf5 100%);
    }
    .brand {
      width: var(--sidebar-width);
      display: flex;
      align-items: center;
      padding-left: 48px;
      border-right: 1px solid rgba(255, 255, 255, .72);
      font-size: 23px;
      font-weight: 700;
      letter-spacing: 2px;
      white-space: nowrap;
    }
    .user-area {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding-right: 22px;
      font-size: 13px;
    }
    .avatar {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255, 255, 255, .7);
      border-radius: 50%;
      background: #c9ccd1;
    }

    .sidebar {
      position: fixed;
      z-index: 40;
      top: var(--header-height);
      bottom: 0;
      left: 0;
      width: var(--sidebar-width);
      overflow-y: auto;
      background: #fff;
      border-right: 1px solid #e3e7ed;
    }
    .menu-group { border-bottom: 1px solid #f0f2f5; }
    .menu-row {
      min-height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 24px;
      color: #7d8289;
      background: #fff;
      border: 0;
      width: 100%;
      text-align: left;
      transition: color .18s ease, background-color .18s ease;
    }
    .menu-row:hover { color: var(--primary); background: #f7fbff; }
    .menu-row .icon {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      color: #74b5fb;
    }
    .menu-row .label { white-space: nowrap; }
    .menu-row .arrow {
      margin-left: auto;
      color: #7ab8fa;
      font-size: 12px;
      transform: rotate(0);
      transition: transform .18s ease;
    }
    .menu-group.open > .menu-row .arrow { transform: rotate(180deg); }
    .submenu { display: none; padding: 0; background: #f5f7fa; }
    .menu-group.open .submenu { display: block; }
    .submenu button {
      width: 100%;
      min-height: 50px;
      padding: 0 14px 0 40px;
      color: #747980;
      background: transparent;
      border: 0;
      text-align: left;
      transition: color .18s ease, background-color .18s ease;
    }
    .submenu button:hover { color: var(--primary); background: #edf5ff; }
    .submenu button.active {
      color: #656a71;
      background: #dceafb;
    }

    .workspace {
      min-height: 100vh;
      margin-left: var(--sidebar-width);
      padding-top: var(--header-height);
    }
    .tabs-shell {
      height: var(--tabs-height);
      padding: 4px 16px 5px;
      overflow: hidden;
      background: #fff;
      border-bottom: 1px solid #dfe3e9;
      white-space: nowrap;
    }
    .tabs { display: flex; align-items: center; gap: 7px; }
    .tab {
      height: 31px;
      display: inline-flex;
      align-items: center;
      padding: 0 10px;
      color: var(--regular);
      background: #fff;
      border: 1px solid var(--control-line);
      border-radius: 4px;
      font-size: 13px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .03);
      transition: color .18s ease, background-color .18s ease, border-color .18s ease;
    }
    .tab:hover { color: var(--primary); border-color: #9ac7f7; }
    .tab.active { color: #fff; background: var(--primary); border-color: var(--primary); }
    .tab .dot {
      width: 7px;
      height: 7px;
      margin-right: 7px;
      border-radius: 50%;
      background: #fff;
    }
    .tab .x { margin-left: 9px; color: #a8adb3; font-size: 15px; }
    .tab.active .x { color: #d9ecff; }

    .titlebar {
      height: var(--title-height);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 17px 20px 0;
      background: #fff;
      border-bottom: 1px solid #eceff3;
    }
    .titlebar h1 {
      margin: 0;
      color: var(--text);
      font-size: 19px;
      font-weight: 400;
    }
    .page {
      min-height: calc(100vh - var(--header-height) - var(--tabs-height) - var(--title-height));
      padding: 32px 31px;
      background: var(--page);
    }
    .panel {
      min-height: 560px;
      padding: 20px;
      overflow: hidden;
      background: #fff;
      border-radius: var(--radius);
    }

    .filters {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px 28px;
    }
    .filters.two-line { max-width: 1480px; }
    .field {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 34px;
    }
    .field label {
      color: var(--regular);
      white-space: nowrap;
    }
    .control {
      height: 32px;
      padding: 0 11px;
      color: var(--regular);
      background: #fff;
      border: 1px solid var(--control-line);
      border-radius: var(--radius);
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .control:hover { border-color: #c0c4cc; }
    .control:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(64,158,255,.12); }
    input.control { width: 202px; }
    select.control { width: 160px; }
    .control::placeholder { color: var(--placeholder); }
    .range {
      width: 360px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      color: var(--placeholder);
    }
    .range strong { color: var(--regular); font-weight: 400; }

    .btn {
      height: 34px;
      padding: 0 16px;
      color: var(--regular);
      background: #fff;
      border: 1px solid var(--control-line);
      border-radius: var(--radius);
      font-weight: 500;
      transition: color .18s ease, background-color .18s ease, border-color .18s ease;
    }
    .btn:hover { color: var(--primary); border-color: #9ac7f7; background: #ecf5ff; }
    .btn.primary { color: #fff; background: var(--primary); border-color: var(--primary); }
    .btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    .btn.danger { color: #fff; background: var(--danger); border-color: var(--danger); }
    .btn.danger:hover { background: #f78989; border-color: #f78989; }
    .btn.warning { color: #fff; background: var(--warning); border-color: var(--warning); }
    .btn.warning:hover { background: #ebb563; border-color: #ebb563; }
    .btn.success { color: #fff; background: var(--success); border-color: var(--success); }
    .btn.small { height: 28px; padding: 0 11px; font-size: 13px; }
    .button-row { display: flex; gap: 12px; align-items: center; }

    .summary {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px 28px;
      margin-top: 35px;
      color: var(--regular);
    }
    .summary strong { margin-left: 5px; font-weight: 600; }
    .red { color: var(--danger); }
    .green { color: var(--success); }
    .blue { color: var(--primary); }
    .warning-text { color: var(--warning); }
    .action-line { margin-top: 25px; }

    .stats-ribbon {
      min-height: 46px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      margin-top: 24px;
      padding: 0 24px;
      background: #eef3fb;
      border-radius: 12px;
      color: var(--text);
      text-align: center;
      font-size: 15px;
    }
    .stats-ribbon strong { margin-left: 6px; font-size: 18px; font-weight: 500; }

    .recharge-states {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 14px;
      margin: 20px 0 14px;
    }
    .recharge-state {
      min-height: 86px;
      padding: 16px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 2px 8px rgba(35, 62, 96, .035);
    }
    .recharge-state span { display: block; color: var(--regular); }
    .recharge-state strong {
      display: block;
      margin-top: 4px;
      color: var(--primary);
      font-size: 25px;
      font-weight: 500;
    }
    .recharge-state.review strong { color: var(--warning); }
    .recharge-state.done strong { color: var(--success); }
    .recharge-summary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      min-height: 48px;
      margin-bottom: 14px;
      padding: 9px 14px;
      background: #fff;
      border: 1px solid var(--line);
    }
    .recharge-metric {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding-right: 18px;
      margin: 2px 18px 2px 0;
      border-right: 1px solid var(--line);
      white-space: nowrap;
    }
    .recharge-metric:last-child { padding-right: 0; margin-right: 0; border-right: 0; }
    .recharge-metric strong { font-size: 15px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .recharge-empty { height: 120px; color: var(--muted); text-align: center; }

    .subtabs {
      display: flex;
      gap: 36px;
      height: 40px;
      align-items: flex-start;
      border-bottom: 1px solid var(--control-line);
    }
    .subtab {
      position: relative;
      height: 40px;
      padding: 6px 0 0;
      color: var(--text);
      background: transparent;
      border: 0;
      font-weight: 600;
    }
    .subtab.active { color: var(--primary); }
    .subtab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background: var(--primary);
    }

    .table-wrap {
      position: relative;
      margin-top: 30px;
      overflow-x: auto;
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
      scrollbar-color: #c7ccd3 #f3f4f6;
      scrollbar-width: thin;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      color: var(--regular);
      font-size: 13px;
    }
    th, td {
      height: 62px;
      padding: 9px 12px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }
    th {
      height: 40px;
      color: var(--muted);
      background: #fff;
      font-weight: 600;
    }
    tbody tr:nth-child(even) { background: #fcfcfd; }
    tbody tr:hover { background: #f5faff; }
    .cell-center { text-align: center; }
    .wrap { white-space: normal; line-height: 1.55; }
    .ellipsis {
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 9px;
      border-radius: 12px;
      color: var(--regular);
      background: #f1f3f5;
    }
    .tag.success { color: #529b2e; background: #f0f9eb; }
    .tag.warning { color: #b88230; background: #fdf6ec; }
    .tag.danger { color: #c45656; background: #fef0f0; }
    .link {
      color: var(--primary);
      background: transparent;
      border: 0;
      padding: 0;
      text-decoration: none;
    }
    .link:hover { color: var(--primary-hover); }
    .link + .link { margin-left: 10px; }
    .op-links { white-space: normal; line-height: 25px; }
    .op-links .link { display: inline-block; margin: 0 10px 0 0; }
    .switch-line { display: flex; align-items: center; gap: 8px; }
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex: 0 0 auto;
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: #dcdfe6;
      transition: background-color .18s ease;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
      transition: transform .18s ease;
    }
    .switch.on { background: var(--primary); }
    .switch.on::after { transform: translateX(18px); }

    .pagination {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      color: var(--regular);
    }
    .page-button {
      min-width: 28px;
      height: 28px;
      color: var(--regular);
      background: #fff;
      border: 0;
      border-radius: 4px;
    }
    .page-button:hover, .page-button.current { color: var(--primary); }
    .page-button.current { font-weight: 600; background: #ecf5ff; }

    .modal-layer {
      position: fixed;
      z-index: 200;
      inset: 0;
      display: grid;
      place-items: start center;
      padding: 70px 24px 24px;
      background: rgba(0, 0, 0, .48);
    }
    .merchant-modal {
      width: min(800px, calc(100vw - 48px));
      max-height: calc(100vh - 94px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .24);
    }
    .modal-header {
      flex: 0 0 auto;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
    }
    .modal-header h2 { margin: 0; color: var(--text); font-size: 18px; font-weight: 500; }
    .modal-close {
      width: 34px;
      height: 34px;
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 22px;
      line-height: 1;
    }
    .modal-close:hover { color: var(--primary); }
    .modal-body { min-height: 0; padding: 20px 18px 10px; overflow-y: auto; }
    .modal-basic-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 22px;
      margin-bottom: 18px;
    }
    .modal-field {
      display: grid;
      grid-template-columns: 108px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
    }
    .modal-field.full { grid-column: 1 / -1; }
    .modal-field label { color: var(--regular); text-align: right; }
    .modal-field .required::before { content: "*"; margin-right: 4px; color: var(--danger); }
    .modal-control {
      width: 100%;
      min-height: 32px;
      padding: 6px 10px;
      color: var(--regular);
      background: #fff;
      border: 1px solid var(--control-line);
      border-radius: var(--radius);
    }
    textarea.modal-control { min-height: 62px; resize: vertical; }
    .modal-control:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(64, 158, 255, .12); outline: 0; }
    .modal-control:disabled { color: var(--muted); background: #f5f7fa; cursor: not-allowed; }
    .modal-section {
      margin-top: 12px;
      padding: 14px 16px 16px;
      background: #f7f8fa;
      border: 1px solid #eef0f3;
      border-radius: 6px;
    }
    .modal-section-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 11px;
      margin-bottom: 12px;
      border-bottom: 1px solid #e4e7ed;
    }
    .modal-section-head strong { color: var(--text); font-size: 15px; }
    .config-row {
      display: grid;
      grid-template-columns: 155px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      margin-top: 13px;
    }
    .config-label { padding-top: 7px; color: var(--regular); text-align: right; }
    .config-main { min-width: 0; }
    .config-inline { display: flex; align-items: center; gap: 10px; }
    .config-inline .modal-control { flex: 1; }
    .unit {
      height: 32px;
      display: inline-flex;
      align-items: center;
      padding: 0 13px;
      margin-left: -11px;
      color: var(--muted);
      background: #f5f7fa;
      border: 1px solid var(--control-line);
      border-radius: 0 4px 4px 0;
    }
    .switch-copy { color: var(--regular); font-size: 13px; }
    .white-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .white-empty { color: var(--muted); font-size: 12px; }
    .check-row { display: flex; flex-wrap: wrap; gap: 18px; min-height: 32px; align-items: center; }
    .check-row label { display: inline-flex; align-items: center; gap: 6px; }
    .modal-alert {
      margin-top: 12px;
      padding: 9px 11px;
      color: #b88230;
      background: #fdf6ec;
      border: 1px solid #faecd8;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.55;
    }
    .modal-footer {
      flex: 0 0 auto;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 0 18px;
      background: #fff;
      border-top: 1px solid var(--line);
    }

    .toast {
      position: fixed;
      z-index: 100;
      top: 76px;
      left: calc(50% + var(--sidebar-width) / 2);
      transform: translate(-50%, -14px);
      min-width: 300px;
      padding: 10px 16px;
      color: #3f7b23;
      background: #f0f9eb;
      border: 1px solid #e1f3d8;
      border-radius: 5px;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 1000px) {
      :root { --sidebar-width: 68px; }
      body { min-width: 980px; }
      .brand { padding-left: 12px; font-size: 0; letter-spacing: 0; }
      .brand::after { content: "蓝盛"; font-size: 18px; }
      .menu-row { justify-content: center; padding: 0; }
      .menu-row .label, .menu-row .arrow, .submenu { display: none !important; }
      .page { padding: 20px; }
      .recharge-states { grid-template-columns: repeat(2, minmax(160px, 1fr)); }
      .modal-basic-grid { grid-template-columns: 1fr; }
      .modal-field.full { grid-column: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">蓝盛支付</div>
    <div class="user-area">
      <span class="avatar" aria-hidden="true"></span>
      <span>芋道源码</span>
    </div>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="后台导航"></aside>

  <div class="workspace">
    <div class="tabs-shell"><nav class="tabs" id="tabs" aria-label="已打开页面"></nav></div>
    <div class="titlebar">
      <h1 id="pageTitle"></h1>
      <div id="titleActions"></div>
    </div>
    <main class="page"><section class="panel" id="pagePanel"></section></main>
  </div>

  <div id="merchantModalRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const pageMeta = {
      address: { title: "地址查询", href: "/address-query" },
      withdraw: { title: "商户下分", heading: "商户下发", href: "/merchant/merchant-withdraw" },
      recharge: { title: "商户充值订单", href: "/merchant/merchant-recharge-order" },
      payout: { title: "代付商户管理", href: "/daifu/daifu-merchant" },
      collect: { title: "代收商户管理", href: "/daishou/daishou/collect-merchant" },
      merchant: { title: "商户管理", href: "/merchant/merchant" },
      "payout-record": { title: "商户代付流水记录", href: "/record/merchant-daifu-change" },
      "collect-record": { title: "商户代收流水记录", href: "/record/merchant-daifu-total-change" },
      "transfer-orders": { title: "资金划转", href: "/merchant/merchant-transfer" }
    };

    function setupRechargePage() {
      const get = (id) => document.getElementById(id);
      const statusText = { done: "已完成", processing: "充值中", review: "人工审核", expired: "已过期", closed: "已关闭", rejected: "异常关闭" };
      const money = (value) => Number(value).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " USDT";
      function selectedOrders() {
        const order = get("rechargeOrder").value.trim().toLowerCase();
        const merchant = get("rechargeMerchant").value.trim().toLowerCase();
        const keyword = get("rechargeKeyword").value.trim().toLowerCase();
        const status = get("rechargeStatus").value;
        return rechargeOrders.filter((item) =>
          (!order || item.no.toLowerCase().includes(order)) &&
          (!merchant || item.merchant.toLowerCase().includes(merchant)) &&
          (!keyword || item.txid.toLowerCase().includes(keyword) || item.address.toLowerCase().includes(keyword)) &&
          (!status || item.status === status)
        );
      }
      function renderRechargeOrders() {
        const list = selectedOrders();
        const byStatus = (status) => list.filter((item) => item.status === status);
        const sum = (items) => items.reduce((total, item) => total + item.amount, 0);
        const success = byStatus("done");
        const failed = list.filter((item) => ["expired", "closed", "rejected"].includes(item.status));
        const processing = list.filter((item) => ["processing", "review"].includes(item.status));
        get("rechargeAll").textContent = list.length;
        get("rechargeProcessing").textContent = byStatus("processing").length;
        get("rechargeReview").textContent = byStatus("review").length;
        get("rechargeDone").textContent = success.length;
        get("rechargeSuccessAmount").textContent = money(sum(success));
        get("rechargeFailedAmount").textContent = money(sum(failed));
        get("rechargeSuccessCount").textContent = success.length;
        get("rechargeFailedCount").textContent = failed.length;
        get("rechargeSuccessRate").textContent = (success.length + failed.length ? success.length / (success.length + failed.length) * 100 : 0).toFixed(2) + "%";
        get("rechargeProcessingAmount").textContent = money(sum(processing));
        get("rechargeProcessingCount").textContent = processing.length;
        get("rechargeTotal").textContent = "共 " + list.length + " 条";
        get("rechargeRows").innerHTML = list.length ? list.map((item) => {
          const statusClass = item.status === "done" ? "success" : item.status === "processing" || item.status === "review" ? "warning" : "danger";
          return `<tr><td class="mono">${item.no} ${mockLink("复制订单号")}</td><td>${item.merchant}</td><td>${money(item.amount)}</td><td>${money(item.fee)}</td><td>${item.net ? money(item.net) : "—"}</td><td class="mono">${item.address} ${mockLink("复制地址")}</td><td class="mono">${item.txid}${item.txid === "—" ? "" : " " + mockLink("复制TXID")}</td><td>${item.confirm}</td><td><span class="tag ${statusClass}">${statusText[item.status]}</span></td><td>${item.created}</td><td>${mockLink("查看")}</td></tr>`;
        }).join("") : '<tr><td class="recharge-empty" colspan="11">暂无符合条件的订单</td></tr>';
      }
      get("rechargeSearch").addEventListener("click", renderRechargeOrders);
      get("rechargeReset").addEventListener("click", () => {
        ["rechargeOrder", "rechargeMerchant", "rechargeKeyword"].forEach((id) => { get(id).value = ""; });
        get("rechargeStatus").value = "";
        renderRechargeOrders();
      });
      ["rechargeOrder", "rechargeMerchant", "rechargeKeyword", "rechargeStatus"].forEach((id) => {
        get(id).addEventListener("keydown", (event) => {
          if (event.key === "Enter") renderRechargeOrders();
        });
      });
      renderRechargeOrders();
    }

      <div class="subtabs" style="margin-top:22px">${currencies.map((currency) => `<button type="button" class="subtab ${currency === currentCurrency ? "active" : ""}" data-ledger-tab="${kind}:${currency}">${currency}</button>`).join("")}</div>
      <div class="table-wrap"><table style="min-width:1900px"><colgroup><col style="width:70px"><col style="width:150px"><col style="width:145px"><col style="width:190px"><col style="width:175px"><col style="width:145px"><col style="width:80px"><col style="width:130px"><col style="width:150px"><col style="width:140px"><col style="width:175px"><col style="width:280px"><col style="width:150px"></colgroup>
        <thead><tr><th>序号</th><th>商户名称</th><th>商户号</th><th>平台订单号 / 划转单号</th><th>商户订单号</th><th>类型</th><th>币种</th><th>原金额</th><th>变动金额</th><th>变动后金额</th><th>变动时间</th><th>备注 / 对方商户</th><th>操作</th></tr></thead>
        <tbody>${transferRows || `<tr><td colspan="13" class="recharge-empty">当前币种暂无已完成的资金划转记录</td></tr>`}${ordinaryRows}</tbody></table></div>${pagination(transferRows ? completed.length + 1 : 1)}`;
    }

    function transferOrdersPage() {
      const completed = transferOrders.filter((order) => order.status === "已完成");
      const completedByCurrency = completed.reduce((totals, order) => {
        totals[order.currency] = (totals[order.currency] || 0) + order.amount;
        return totals;
      }, {});
      const rows = transferOrders.map((order) => {
        const statusClass = order.status === "已完成" ? "success" : order.status === "确认中" ? "warning" : "danger";
        const action = order.status === "待出款" ? `${mockLink("出款")}${mockLink("取消")}` : order.status === "确认中" ? `${mockLink("手动确认")}${mockLink("取消")}` : "—";
        return `<tr><td class="cell-center"><input type="checkbox" aria-label="选择${order.no}"></td><td class="cell-center">${transferOrders.indexOf(order) + 1}</td><td class="mono">${order.no}</td><td><span class="tag">划转</span></td><td>${order.source[0]}<br><span class="mono">${order.source[1]}</span></td><td>${transferMoney(order.amount, order.currency)}</td><td>${transferMoney(0, order.currency)}</td><td>${transferMoney(order.received, order.currency)}</td><td>${order.currency}</td><td>${order.target[1]} / ${order.target[2]}</td><td>内部划转</td><td>${order.source[1]} / ${order.source[2]}</td><td><span class="tag ${statusClass}">${order.status}</span></td><td><span class="tag ${order.tgStatus === "已确认" ? "success" : "warning"}">${order.tgStatus}</span></td><td>${order.progress}</td><td>${order.confirmers}</td><td>资金划转</td><td>${order.submitted}</td><td>${order.changed}</td><td>${order.operator}</td><td>${order.operationRemark}</td><td>${order.audit}</td><td class="op-links"><button type="button" class="link" data-transfer-detail="${order.no}">查看</button>${action}</td></tr>`;
      }).join("");
      return `<div class="filters" aria-label="资金划转筛选">
        ${field("单号", input("输入单号搜索", 200))}${field("下分单类型", select("全部", 140))}${field("状态", select("全部", 140))}
        ${field("提交时间", '<div class="control range" style="width:280px"><span>◷　开始时间</span><strong>-</strong><span>结束时间</span></div>')}${button("搜索", "primary")}
      </div>
      <div class="stats-ribbon" aria-label="资金划转统计"><span>划转订单<strong>${transferOrders.length}</strong></span><span class="green">已完成<strong>${completed.length}</strong></span><span class="warning-text">确认中<strong>${transferOrders.filter((order) => order.status === "确认中").length}</strong></span><span class="red">资金异常<strong>${transferOrders.filter((order) => order.status === "资金异常").length}</strong></span></div>
      <div class="recharge-summary" aria-label="已完成资金统计">${Object.entries(completedByCurrency).map(([currency, amount]) => `<div class="recharge-metric"><span>已完成${currency}划转：</span><strong class="green">${transferMoney(amount, currency)}</strong></div>`).join("")}<div class="recharge-metric"><span>说明：</span><strong>按币种分别记账，统计不做跨币种汇总</strong></div></div>
      <div class="table-wrap"><table style="min-width:2890px"><colgroup><col style="width:48px"><col style="width:60px"><col style="width:180px"><col style="width:100px"><col style="width:175px"><col style="width:115px"><col style="width:95px"><col style="width:115px"><col style="width:80px"><col style="width:220px"><col style="width:100px"><col style="width:220px"><col style="width:100px"><col style="width:115px"><col style="width:90px"><col style="width:180px"><col style="width:110px"><col style="width:160px"><col style="width:160px"><col style="width:105px"><col style="width:180px"><col style="width:105px"><col style="width:190px"></colgroup>
        <thead><tr><th></th><th>序号</th><th>单号</th><th>下分单类型</th><th>商户名称/商户号</th><th>划转金额</th><th>手续费</th><th>到账金额</th><th>币种</th><th>转入商户/账户</th><th>协议类型</th><th>转出商户/账户</th><th>状态</th><th>TG确认状态</th><th>确认人数</th><th>确认人</th><th>备注</th><th>提交时间</th><th>操作时间</th><th>操作人</th><th>操作备注</th><th>审核图片</th><th>操作</th></tr></thead>
        <tbody>${rows}</tbody></table></div>${pagination(transferOrders.length)}`;
    }

    function openTransferDetail(orderNo) {
      const order = transferOrders.find((item) => item.no === orderNo);
      if (!order) return;
      document.getElementById("merchantModalRoot").innerHTML = `<div class="modal-layer"><section class="merchant-modal" role="dialog" aria-modal="true" aria-labelledby="transferDetailTitle" tabindex="-1"><header class="modal-header"><h2 id="transferDetailTitle">资金划转明细</h2><button type="button" class="modal-close" data-modal-close aria-label="关闭此对话框">×</button></header><div class="modal-body"><div class="modal-section"><div class="modal-section-head"><strong>订单信息</strong><span class="tag ${order.status === "已完成" ? "success" : order.status === "资金异常" ? "danger" : "warning"}">${order.status}</span></div><div class="modal-basic-grid"><div class="modal-field"><label>划转单号</label><div class="mono">${order.no}</div></div><div class="modal-field"><label>币种 / 金额</label><div>${order.currency} / ${transferMoney(order.amount, order.currency)}</div></div><div class="modal-field"><label>提交时间</label><div>${order.submitted}</div></div><div class="modal-field"><label>资金变动时间</label><div>${order.changed}</div></div></div></div><div class="modal-section"><div class="modal-section-head"><strong>双边账户流水</strong></div><div class="modal-basic-grid"><div class="modal-field full"><label>转出</label><div>${order.source[0]}（${order.source[1]}） · ${order.source[2]} · ${transferMoney(order.source[3], order.currency)} → <span class="red">-${transferMoney(order.source[4], order.currency)}</span> → ${transferMoney(order.source[5], order.currency)} · 流水号：${order.source[6]}</div></div><div class="modal-field full"><label>转入</label><div>${order.target[0]}（${order.target[1]}） · ${order.target[2]} · ${transferMoney(order.target[3], order.currency)} → <span class="green">+${transferMoney(order.target[4], order.currency)}</span> → ${transferMoney(order.target[5], order.currency)} · 流水号：${order.target[6]}</div></div></div></div></div><footer class="modal-footer"><button type="button" class="btn" data-modal-close>关闭</button></footer></section></div>`;
      document.body.style.overflow = "hidden";
      document.querySelector(".merchant-modal").focus();
    }

    function renderPage() {
      const meta = pageMeta[currentPage];
      document.title = `蓝盛支付 - ${meta.title}`;
      document.getElementById("pageTitle").textContent = meta.heading || meta.title;
      document.getElementById("titleActions").innerHTML = currentPage === "payout" ? button("关闭进单", "danger") : "";
      const renderers = { merchant: merchantPage, withdraw: withdrawPage, recharge: rechargePage, payout: payoutPage, collect: collectPage, "payout-record": () => accountLedgerPage("payout-record"), "collect-record": () => accountLedgerPage("collect-record"), "transfer-orders": transferOrdersPage };
      document.getElementById("pagePanel").innerHTML = renderers[currentPage]();
      renderSidebar();
      renderTabs();
      if (currentPage === "recharge") setupRechargePage();
      location.hash = currentPage;
    }

    function navigateTo(page) {
      const pageId = pageRoutes[page];
      if (pageId && page !== standalonePage && window.parent !== window) {
        window.parent.postMessage({ type: "bluepay:navigate", pageId }, "*");
        return;
      }
      if (!page || !pageMeta[page] || page === "address") {
        showToast(page === "address" ? "地址查询仅保留页签，本页面聚焦四个目标页面" : "此菜单仅用于还原现状导航");
        return;
      }
      if (page !== standalonePage) {
        showToast("该菜单当前未接入 Demo");
        return;
      }
      currentPage = page;
      renderPage();
      document.querySelector(".page").scrollTop = 0;
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    document.addEventListener("click", (event) => {
      const target = event.target.closest("button");
      if (!target) return;
      if (target.dataset.editIndex !== undefined) {
        openMerchantModal(Number(target.dataset.editIndex));
        return;
      }
      if (target.dataset.transferDetail !== undefined) {
        openTransferDetail(target.dataset.transferDetail);
        return;
      }
      if (target.dataset.ledgerTab !== undefined) {
        const [kind, currency] = target.dataset.ledgerTab.split(":");
        ledgerCurrency[kind] = currency;
        renderPage();
        return;
      }
      if (target.dataset.modalClose !== undefined) {
        closeMerchantModal();
        return;
      }
      if (target.dataset.modalSubmit !== undefined) {
        closeMerchantModal();
        showToast("修改商户已保存（演示）");
        return;
      }
      const configToggle = target.dataset.configToggle;
      if (configToggle) {
        const enabled = !target.classList.contains("on");
        target.classList.toggle("on", enabled);
        target.setAttribute("aria-checked", String(enabled));
        setConfigSectionState(configToggle, enabled);
        return;
      }
      const page = target.dataset.page;
      if (page !== undefined && page !== "") { navigateTo(page); return; }
      const group = target.dataset.group;
      if (group && group.endsWith("-group")) {
        target.closest(".menu-group").classList.toggle("open");
        return;
      }
      if (target.classList.contains("switch")) {
        target.classList.toggle("on");
        showToast("已切换模拟状态，不影响真实后台");
        return;
      }
      const action = target.dataset.action;
      if (action) showToast(`现状页面：${action} 不执行真实业务操作`);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && document.getElementById("merchantModalRoot").innerHTML) closeMerchantModal();
    });

    renderPage();
  </script>
</body>
</html>
