e}.search-icon::after{content:"";position:absolute;right:-4px;bottom:-2px;height:5px;width:1.5px;background:currentColor;transform:rotate(-45deg)}.auto-row{display:flex;align-items:center;gap:12px;font-size:13px}.auto-row select{width:110px}.custom-dates{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}.custom-dates input{width:220px}.summary{display:flex;align-items:center;gap:24px;margin:16px 0;padding:17px 10px;overflow:auto;white-space:nowrap;font-size:13px}.summary-label{color:var(--muted);margin-right:7px}.summary strong{color:#303133;font-weight:600}.summary .green{color:#85b95f}.summary .red{color:#f17878}.summary .blue{color:#5295d8}.table-card{padding:10px 10px 16px}.table-wrap{overflow:auto;max-width:100%;scrollbar-color:#c4c7cd #f5f7fa;scrollbar-width:thin}table{border-collapse:separate;border-spacing:0;width:100%;min-width:4330px;table-layout:fixed;font-size:12px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400;height:66px}th{height:62px;color:var(--muted);background:#fff}tbody tr:nth-child(even){background:#f7f8fb}tbody tr:hover{background:#f5f7fa}.sticky-first{position:sticky;left:0;z-index:2;background:#fff;box-shadow:4px 0 7px #00000008}tbody tr:nth-child(even) .sticky-first{background:#f7f8fb}.sticky-last{position:sticky;right:0;z-index:2;background:#fff;box-shadow:-4px 0 7px #00000008}tbody tr:nth-child(even) .sticky-last{background:#f7f8fb}tbody tr:hover .sticky-first,tbody tr:hover .sticky-last{background:#f5f7fa}thead .sticky-first,thead .sticky-last{z-index:3}.order-pair>div+div{margin-top:8px}.merchant-number{color:#a0a3aa;font-size:11px;margin-top:4px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}.link{padding:2px 4px;border:0;background:transparent;color:var(--blue);font-size:11px;white-space:nowrap}.link:hover{text-decoration:underline}.link:active{opacity:.65}.link.green{color:#85b95f}.link.amber{color:#c9a05b}.link.red{color:#e88787}.op-links{white-space:normal;line-height:26px}.op-links .link{margin-right:9px;padding-left:0}.pill{display:inline-block;border-radius:3px;border:1px solid #ebeef5;background:#f4f4f5;color:#909399;font-size:11px;line-height:18px;padding:0 7px}.pill.green{background:#f0f9eb;border-color:#e1f3d8;color:#85b95f}.pill.blue{background:#ecf5ff;border-color:#d9ecff;color:#72b0ec}.pill.amber{background:#fdf6ec;border-color:#faecd8;color:#c8a061}.pill.red{background:#fef0f0;border-color:#fde2e2;color:#e58e8e}.out-amount{color:#639de0;font-weight:700}.wallet-address{border:1px solid #f0f0f2;border-radius:3px;background:#fafafa;padding:3px 5px}.wallet-address .pill{margin-right:6px;font-size:10px}.pagination{display:flex;gap:12px;justify-content:flex-end;align-items:center;margin-top:18px;font-size:12px}.pagination select{width:100px}.page-button{border:0;background:transparent;padding:4px 8px;color:#606266;font-size:13px}.page-button.active{color:var(--blue);font-weight:700}.jump{width:56px;text-align:center}.empty{text-align:center;color:var(--muted);height:140px}.shade{position:fixed;inset:0;z-index:100;background:#0007;display:flex;align-items:center;justify-content:center;padding:20px}.modal{width:min(680px,100%);max-height:84vh;display:flex;flex-direction:column;background:#fff;border-radius:5px;box-shadow:0 12px 32px #0003}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 17px}.modal-head h2{font-size:17px;font-weight:400;color:#303133;margin:0}.close{border:0;background:transparent;color:#909399;font-size:22px;line-height:26px;padding:0 2px}.modal-body{padding:0 17px;overflow:auto}.details{margin:0}.detail-row{display:grid;grid-template-columns:150px minmax(0,1fr);min-height:41px;align-items:start;border-bottom:1px solid #eee;padding:10px 0;gap:0;font-size:13px}.detail-row dt,.detail-row dd{margin:0;word-break:break-all}.detail-row dd{color:#303133}.modal-foot{display:flex;justify-c .page-heading{padding:18px 20px;background:white;font-size:20px;font-weight:400;margin:0;color:#303133}.page{padding:24px 20px}.main-card{padding:22px 24px}.search-title{margin:0 0 26px;padding-bottom:16px;border-bottom:1px solid #dcdfe6;font-size:16px;font-weight:600;color:#303133}.filter-row{gap:18px 30px;margin-bottom:18px}.order-input{width:180px}.select-filter{width:140px}.time-type-field{display:flex;gap:14px;align-items:center;font-size:13px}.filter-bottom{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:24px 0}.filter-bottom .control{width:220px}.btn.green{background:#67c23a;border-color:#67c23a;color:white}.btn.orange{background:#e6a23c;border-color:#e6a23c;color:white}.btn.red{background:#f56c6c;border-color:#f56c6c;color:white}.summary{padding:18px 0;margin:26px 0;border-top:1px solid #ebeef5;background:white;font-size:13px}.summary-label{color:#303133}.toolbar{display:flex;align-items:center;gap:20px;margin:20px 0 16px;font-size:13px}.switch{width:40px;height:20px;border:0;border-radius:15px;background:#dcdfe6;position:relative;padding:0;vertical-align:middle}.switch:after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:white}.switch.on{background:#409eff}.switch.on:after{left:22px}table{border-collapse:collapse;min-width:2210px;font-size:12px}th,td{border:1px solid #ebeef5;height:66px;text-align:center;white-space:normal;line-height:22px}th{height:44px;font-weight:600}.sticky-last{right:0}.order-pair{overflow:hidden}.order-pair>div{overflow-wrap:anywhere}.status-message{font-size:11px;color:#f56c6c;line-height:18px;margin-top:5px}.list-card .pagination{font-size:12px}.detail-table{min-width:0;width:100%;font-size:13px}.detail-table td{height:auto;padding:9px 12px;text-align:left;vertical-align:top}.detail-table td:first-child{width:145px;background:#fafafa;color:#606266}.detail-table .detail-value{overflow-wrap:anywhere;white-space:normal;color:#303133}.detail-table .detail-value>div+div{ma </style></head><body><h1 class="page-heading">代付订单管理</h1><main class="page"><section class="card main-card list-card"><h2 class="search-title">代付订单搜索</h2><div class="filter-row"><input class="control order-input" id="systemOrder" placeholder="请输入系统订单号" aria-label="系统订单号"><input class="control order-input" id="channelOrder" placeholder="请输入通道订单号" aria-label="通道订单号"><input class="control order-input" id="merchantOrder" placeholder="请输入商家订单号" aria-label="商家订单号"><select class="control select-filter" id="merchantFilter" aria-label="商户"><option value="">商户</option><option>远航演示商户</option><option>北辰演示商户</option></select><select class="control select-filter" id="channelFilter" aria-label="通道"><option value="">通道</option><option>远航演示代付通道</option><option>北辰演示代付通道</option></select><select class="control select-filter" id="providerFilter" aria-label="通道商"><option value="">通道商</option><option>远航演示通道商</option><option>北辰演示通道商</option></select><select class="control select-filter" id="statusFilter" aria-label="支付状态"><option value="">支付状态</option><option>未打款</option><option>打款中</option><option>已打款</option><option>已驳回</option><option>异常</option><option>IP封禁</option></select></div><div class="filter-row"><select class="control select-filter" id="operationTypeFilter" aria-label="订单类型"><option value="">订单类型</option><option>强补订单</option><option>冲销订单</option><option>手提订单</option><option>亏损订单</option></select><select class="control select-filter" id="payoutOrderTypeFilter" aria-label="代付订单类型"><option value="">代付订单类型</option><option>普通订单</option><option>下分</option></select><select class="control select-filter" id="noticeFilter" aria-label="通知状态"><option value="">通知状态</option><option>通知失败</option><option>通知成功</option><option>手动回调成功</option></select><label class="time-type-field">时间类型<select class="control select-filter" id="timeTypeFilter"><option value="created">提交时间</option><option value="callback">回调时间</option></select></label><select class="control select-filter" id="dateFilter" aria-label="时间"><option value="">时间</option><option value="today">今天</option><option value="yesterday">昨天</option><option value="3">近三天</option><option value="7">近一周</option><option value="custom">自定义时间</option></select></div><div id="customDates" class="custom-dates" hidden><input class="control" id="startTime" type="datetime-local" aria-label="开始时间"><span>至</span><input class="control" id="endTime" type="datetime-local" aria-label="结束时间"></div><div class="filter-bottom"><input class="control" id="keyword" placeholder="输入打款金额/姓名/卡号" aria-label="打款金额/姓名/卡号"><button class="btn primary" id="search">搜索</button><button class="btn green" id="refresh">点击开启自动刷新</button><button class="btn primary" id="export">导出数据</button><button class="btn orange" id="failedRecords">失败订单记录（0条）</button><button class="btn red" id="exceptionRecords">异常订单记录（4条）</button></div><div class="summary" id="summary" aria-label="代付订单统计" aria-live="polite"></div><div class="toolbar"><button class="btn primary" id="resubmit">重新下单</button><label>异常订单提醒：<button class="switch" id="exceptionReminder" type="button" role="switch" aria-label="异常订单提醒" aria-checked="false"></button></label></div><div class="table-wrap"><table id="generalPayoutTable"><colgroup id="tableCols"></colgroup><thead><tr id="tableHead"></tr></thead><tbody id="tableRows"></tbody></table></div><footer class="pagination"><span id="totalCount"></span><select class="control" id="pageSize" aria-label="每页条数"><option value="10">10条/页</option><option value="20">20条/页</option><option value="50">50条/页</option></select><button class="page-button" id="prevPage" aria-label="上一页">‹</button><span id="pageButtons"></span><button class="page-button" id="nextPage" aria-label="下一页">›</button><span>前往</span><input class="control jump" type="number" min="1" id="jumpPage" aria-label="页码" value="1"><span>页</span></footer></section></main><div class="shade" id="modalShade" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modal-head"><h2 id="modalTitle"></h2><button class="close" id="closeModal" aria-label="关闭此对话框">×</button></header><div class="modal-body" id="modalBody"></div><footer class="modal-foot"><button class="btn" id="closeModalFooter">关闭</button></footer></section></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>
// GENERAL_PAYOUT_MODEL_START
function payoutOrderType(order) { return order.sourceWithdrawalNo ? '下分' : '普通订单'; }
const GENERAL_PAYOUT_HEADERS=['','系统订单号','代付订单类型','通道订单号/商家订单号','商户名/号','类型','交易金额','支付状态','通知状态','驳回描述','通道商','通道','提交时间/回调时间','操作'];
function generalPayoutFixtures(){return Array.from({length:26},(_,i)=>{const status=i<3||i>=10&&i<16?'已打款':[3,7,8,9].includes(i)?'异常':i===4||i>=16&&i<20?'打款中':i===20||i===21?'已驳回':i===25?'IP封禁':'未打款';const date='2026-11-'+(i<10?'19':i<20?'18':'17'),amount=[100,260,500,120,80,90,200,150,300,180][i%10];return {id:'DF-DEMO-'+String(i+1).padStart(5,'0'),recordId:'DEMO-'+(i+1),merchantId:i%2?'DEMO-M-02':'DEMO-M-01',merchant:i%2?'北辰演示商户':'远航演示商户',merchantNo:i%2?'M-DEMO-002':'M-DEMO-001',merchantOrder:'MO-GENERAL-DEMO-'+String(i+1).padStart(5,'0'),channelOrder:status==='已打款'?'CH-GENERAL-DEMO-'+String(i+1).padStart(5,'0'):'—',sourceWithdrawalNo:[3,4,16,20].includes(i)?'LS-W-DEMO-'+String(i+1).padStart(5,'0'):'',typeCode:i%2?'USDT-DEMO':'BANK-DEMO',operationType:['强补订单','冲销订单','手提订单','亏损订单'][i%4],amount,actualAmount:amount,merchantFee:1,channelFee:.03,merchantCommission:0,channelCommission:0,cost:.03,profit:.97,status,notice:status==='已打款'?'通知成功':'未通知',reject:status==='已驳回'?'演示驳回说明':'—',provider:i%2?'北辰演示通道商':'远航演示通道商',channel:i%2?'北辰演示代付通道':'远航演示代付通道',created:date+' 12:'+String(59-i).padStart(2,'0')+':00',callback:status==='已打款'?date+' 13:'+String(59-i).padStart(2,'0')+':00':'—',message:status==='异常'?'演示通道调用异常':status==='未打款'?'演示订单等待处理':status==='已打款'?'代付下单成功':'',bank:'演示银行',branch:'演示支行',unionNo:'—',account:'DEMO-CARD-'+String(i+1).padStart(4,'0'),payee:i%2?'演示收款人乙':'演示收款人甲',remark:'—'}})}
function filterGeneralPayouts(orders,q={}){const has=(value,needle)=>!needle||String(value).toLowerCase().includes(String(needle).toLowerCase());return orders.filter(o=>has(o.id,q.system)&&has(o.channelOrder,q.channelOrder)&&has(o.merchantOrder,q.merchantOrder)&&(!q.merchant||o.merchant===q.merchant)&&(!q.channel||o.channel===q.channel)&&(!q.provider||o.provider===q.provider)&&(!q.status||o.status===q.status)&&(!q.operationType||o.operationType===q.operationType)&&(!q.origin||payoutOrderType(o)===q.origin)&&(!q.notice||o.notice===q.notice)&&(!q.keyword||[o.amount.toFixed(2),o.payee,o.account].some(v=>has(v,q.keyword)))&&(!q.start||(q.timeType==='callback'?o.callback:o.created)>=q.start)&&(!q.end||(q.timeType==='callback'?o.callback:o.created)<=q.end))}
function generalPayoutSummary(rows){const success=rows.filter(o=>o.status==='已打款'),rejected=rows.filter(o=>o.status==='已驳回'),pending=rows.filter(o=>['未打款','打款中'].includes(o.status)),sum=(items,key)=>items.reduce((n,o)=>n+Math.round(Number(o[key])*100),0)/100;return {successAmount:sum(success,'amount'),rejectedAmount:sum(rejected,'amount'),profit:sum(success,'profit'),channelFees:sum(success,'channelFee'),successCount:success.length,failedCount:0,successRate:rows.length?(success.length/rows.length*100).toFixed(1):'0.0',pendingAmount:sum(pending,'amount'),pendingCount:pending.length}}
// GENERAL_PAYOUT_MODEL_END

const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const orders=generalPayoutFixtures(),selected=new Set();let applied={},page=1,size=10,refreshTimer=null,returnFocus=null;
const money=value=>Number(value).toFixed(2);
function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),2000)}
function originPill(o){const type=payoutOrderType(o);return `<span class="pill source-type ${type==='下分'?'withdraw':''}">${type}</span>`}
function pill(text){return `<span class="pill ${['已打款','通知成功','手动回调成功'].includes(text)?'green':['异常','IP封禁','已驳回','通知失败'].includes(text)?'red':'blue'}">${esc(text)}</span>`}
function copyButton(value){return `<button type="button" class="link" data-copy="${esc(value)}">复制</button>`}
function rowCells(o){return [`<input type="checkbox" data-select="${o.id}" aria-label="选择 ${o.id}" ${o.status==='异常'?'':'disabled'} ${selected.has(o.id)?'checked':''}>`,esc(o.id),originPill(o),`<div class="order-pair"><div>${esc(o.channelOrder)} ${copyButton(o.channelOrder)}</div><div class="merchant-number">${esc(o.merchantOrder)} ${copyButton(o.merchantOrder)}</div></div>`,`<div>${esc(o.merchant)}</div><div class="merchant-number">${esc(o.merchantNo)}</div>`,esc(o.typeCode),money(o.amount),pill(o.status)+(o.message?`<div class="status-message">${esc(o.message)}</div>`:''),pill(o.notice),esc(o.reject),esc(o.provider),esc(o.channel),`<div class="time-pair">${o.created}</div><div class="time-pair">${o.callback}</div>`,`<button class="link" data-order="${o.id}" data-action="详情">详情</button>`+(o.status==='已打款'?`<button class="link" data-order="${o.id}" data-action="补单">补单</button>`:['未打款','打款中'].includes(o.status)?`<button class="link" data-order="${o.id}" data-action="操作">操作</button>`:'')]}
function render(){const rows=filterGeneralPayouts(orders,applied),s=generalPayoutSummary(rows),pages=Math.max(1,Math.ceil(rows.length/size));page=Math.min(Math.max(page,1),pages);const metrics=[['成功订单总额',money(s.successAmount)+'元','green'],['驳回订单总金额',money(s.rejectedAmount)+'元','red'],['平台利润',money(s.profit)+'元',''],['通道服务费',money(s.channelFees)+'元',''],['成功订单数',s.successCount,''],['失败订单',s.failedCount,''],['成功率',s.successRate+'%','green'],['处理中金额',money(s.pendingAmount)+'元',''],['处理中笔',s.pendingCount,'']];$('summary').innerHTML=metrics.map(([label,value,tone])=>`<span><span class="summary-label">${label}：</span><strong class="${tone}">${value}</strong></span>`).join('');$('tableRows').innerHTML=rows.length?rows.slice((page-1)*size,page*size).map(o=>`<tr>${rowCells(o).map((cell,i)=>`<td class="${i===13?'sticky-last op-links':''}">${cell}</td>`).join('')}</tr>`).join(''):'<tr><td class="empty" colspan="14">暂无数据</td></tr>';$('exceptionRecords').textContent='异常订单记录（'+rows.filter(o=>o.status==='异常').length+'条）';$('totalCount').textContent='共 '+rows.length+' 条';$('pageButtons').innerHTML=Array.from({length:pages},(_,i)=>`<button class="page-button ${page===i+1?'active':''}" data-page="${i+1}" aria-label="第 ${i+1} 页">${i+1}</button>`).join('');$('prevPage').disabled=page===1;$('nextPage').disabled=page===pages;$('jumpPage').max=pages;$('jumpPage').value=page}
function dateBounds(){const mode=$('dateFilter').value;if(!mode)return {};if(mode==='custom')return {start:$('startTime').value.replace('T',' '),end:$('endTime').value.replace('T',' ')+($('endTime').value?':59':'')};const now=new Date(),day=offset=>{const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+offset);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};return {start:day(mode==='today'?0:mode==='yesterday'?-1:1-Number(mode))+' 00:00:00',end:day(mode==='yesterday'?-1:0)+' 23:59:59'}}
function search(){const dates=dateBounds();if(dates.start&&dates.end&&dates.start>dates.end)return toast('开始时间不能晚于结束时间');applied={system:$('systemOrder').value.trim(),channelOrder:$('channelOrder').value.trim(),merchantOrder:$('merchantOrder').value.trim(),merchant:$('merchantFilter').value,channel:$('channelFilter').value,provider:$('providerFilter').value,status:$('statusFilter').value,operationType:$('operationTypeFilter').value,origin:$('payoutOrderTypeFilter').value,notice:$('noticeFilter').value,timeType:$('timeTypeFilter').value,keyword:$('keyword').value.trim(),...dates};page=1;render()}
function openModal(title,body){returnFocus=document.activeElement;$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalShade').hidden=false;$('closeModal').focus()}
function closeModal(){$('modalShade').hidden=true;$('modalBody').innerHTML='';if(returnFocus?.isConnected)returnFocus.focus()}
function detail(o){const row=(label,value,copy=false)=>`<tr><td>${label}：</td><td class="detail-value">${esc(value)}${copy?' '+copyButton(value):''}</td></tr>`,entries=[['系统订单号',o.id,true],['代付订单类型',payoutOrderType(o)],['来源下分单号',o.sourceWithdrawalNo||'—'],['订单ID',o.recordId],['商户ID',o.merchantId],['商户号',o.merchantNo],['商户名',o.merchant],['通道订单号',o.channelOrder,true],['商户订单号',o.merchantOrder,true],['类型',o.typeCode],['交易金额',money(o.amount)],['实际金额',money(o.actualAmount)],['商户服务费',money(o.merchantFee)],['通道服务费',money(o.channelFee)],['商户代理返佣',money(o.merchantCommission)],['通道代理返佣',money(o.channelCommission)],['订单成本',money(o.cost)],['订单利润',money(o.profit)],['提交时间',o.created],['回调时间',o.callback],['交易通道',o.channel],['通道商',o.provider],['提交地址','—']];let html='<table class="detail-table"><tbody>'+entries.map(([l,v,c])=>row(l,v,c)).join('');html+=`<tr><td>打款详情：</td><td class="detail-value"><div>订单号：${esc(o.channelOrder)}</div><div>银行名称：${esc(o.bank)}</div><div>支行名称：${esc(o.branch)}</div><div>支行银联号：${esc(o.unionNo)}</div><div>收款卡号码：${esc(o.account)} ${copyButton(o.account)}</div><div>收款人姓名：${esc(o.payee)} ${copyButton(o.payee)}</div><div>打款金额：${money(o.actualAmount)} ${copyButton(money(o.actualAmount))}</div></td></tr>`;html+=[['下单状态','—'],['支付状态',o.status+(o.message?'；'+o.message:'')],['通知状态',o.notice],['驳回描述',o.reject],['备注',o.remark],['请求返回内容','—'],['回调返回内容','—'],['查询返回内容','—'],['请求/查询回复','—']].map(([l,v])=>row(l,v)).join('')+'</tbody></table><h3 class="history-title">下单历史</h3><table class="history-table"><thead><tr><th>下单时间</th><th>下单人</th><th>通道返回结果</th><th>通道名称</th></tr></thead><tbody><tr><td class="empty" colspan="4">暂无下单历史</td></tr></tbody></table>';openModal('系统订单号：'+o.id,html)}
function records(kind){const rows=kind==='异常'?filterGeneralPayouts(orders,applied).filter(o=>o.status==='异常'):[];openModal(kind+'订单记录','<table class="history-table"><thead><tr><th>系统订单号</th><th>代付订单类型</th><th>状态</th><th>说明</th></tr></thead><tbody>'+(rows.length?rows.map(o=>`<tr><td>${o.id}</td><td>${payoutOrderType(o)}</td><td>${o.status}</td><td>${esc(o.message)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">暂无数据</td></tr>')+'</tbody></table>')}
function generalExportRows(rows){return rows.map(o=>[o.id,payoutOrderType(o),o.channelOrder+' / '+o.merchantOrder,o.merchant+'/'+o.merchantNo,o.typeCode,money(o.amount),o.status,o.notice,o.reject,o.provider,o.channel,o.created+' / '+o.callback])}
function exportOrders(){const rows=filterGeneralPayouts(orders,applied),quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"',data=[GENERAL_PAYOUT_HEADERS.slice(1,-1),...generalExportRows(rows)],blob=new Blob(['\uFEFF'+data.map(r=>r.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='代付订单.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.copy){try{await navigator.clipboard.writeText(b.dataset.copy);toast('复制成功')}catch{toast('请选中对应内容复制')}return}if(b.dataset.page){page=Number(b.dataset.page);render();return}if(b.dataset.order){const o=orders.find(o=>o.id===b.dataset.order);if(b.dataset.action==='详情')detail(o);else toast('已选择'+b.dataset.action+'演示');}});document.addEventListener('change',e=>{if(e.target.dataset.select){if(e.target.checked)selected.add(e.target.dataset.select);else selected.delete(e.target.dataset.select)}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modalShade').hidden)closeModal();if(e.key==='Tab'&&!$('modalShade').hidden){const nodes=[...$('modalShade').querySelectorAll('button:not(:disabled)')],first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('search').onclick=search;$('export').onclick=exportOrders;$('failedRecords').onclick=()=>records('失败');$('exceptionRecords').onclick=()=>records('异常');$('resubmit').onclick=()=>toast(selected.size?'已选择 '+selected.size+' 条异常订单进行重新下单演示':'请先选择异常订单');$('refresh').onclick=()=>{if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null;$('refresh').textContent='点击开启自动刷新'}else{refreshTimer=setInterval(render,10000);$('refresh').textContent='点击关闭自动刷新'}};$('exceptionReminder').onclick=()=>{const on=$('exceptionReminder').getAttribute('aria-checked')!=='true';$('exceptionReminder').setAttribute('aria-checked',String(on));$('exceptionReminder').classList.toggle('on',on);if(on){const n=filterGeneralPayouts(orders,applied).filter(o=>o.status==='异常').length;if(n)toast('当前有 '+n+' 条异常订单，请及时处理')}};$('dateFilter').onchange=()=>{$('customDates').hidden=$('dateFilter').value!=='custom'};$('pageSize').onchange=()=>{size=Number($('pageSize').value);page=1;render()};$('prevPage').onclick=()=>{page--;render()};$('nextPage').onclick=()=>{page++;render()};$('jumpPage').onchange=()=>{page=Number($('jumpPage').value)||1;render()};$('closeModal').onclick=$('closeModalFooter').onclick=closeModal;$('modalShade').onclick=e=>{if(e.target===$('modalShade'))closeModal()};addEventListener('pagehide',()=>clearInterval(refreshTimer));document.querySelectorAll('.filter-row input,#keyword').forEach(input=>input.addEventListener('keydown',e=>{if(e.key==='Enter')search()}));const widths=[45,200,140,280,140,120,100,160,100,120,120,120,180,260];$('tableCols').innerHTML=widths.map(w=>`<col style="width:${w}px">`).join('');$('tableHead').innerHTML=GENERAL_PAYOUT_HEADERS.map((label,i)=>`<th class="${i===13?'sticky-last':''}">${label}</th>`).join('');render();
</script>
