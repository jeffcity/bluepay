<body>
<header class="page-head"><h1 id="pageTitle">首页钱包</h1><div class="account"><span>美</span><b id="accountName">演示商户</b></div></header>
<main class="main" id="app"></main>
<div class="modal-shade" id="modalShade" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modal-header"><h2 id="modalTitle"></h2><button class="close" aria-label="关闭弹窗" id="closeModal">×</button></header><div id="modalBody"></div></section></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
// MODEL_START
const WALLET_KEY='bluepay.beauty-wallet.v1', SCALE=1000000;
function units(value){const s=String(value).trim();if(!/^\d+(?:\.\d{1,6})?$/.test(s))throw Error('请输入有效数量，最多6位小数，不支持科学计数法');const [a,b='']=s.split('.');const n=BigInt(a)*1000000n+BigInt(b.padEnd(6,'0'));if(n>BigInt(Number.MAX_SAFE_INTEGER))throw Error('数量超出支持范围');return Number(n)}
function mul(a,b,ceil=false){const n=BigInt(a)*BigInt(b),d=1000000n;const result=(n+(ceil?d-1n:0n))/d;if(result>BigInt(Number.MAX_SAFE_INTEGER))throw Error('金额超出支持范围');return Number(result)}
function seedState(){return {version:1,seq:6,merchants:[{id:'beauty-a',name:'演示商户',usdt:units('12580.66'),trx:units('38420.5'),frozen:0,fees:null},{id:'beauty-b',name:'演示商户 B',usdt:units('6800'),trx:units('9200'),frozen:0,fees:{topupUSDT:{mode:'fixed',value:'2'},topupTRX:{mode:'percent',value:'0.5'},exchange:{mode:'fixed',value:'2'}}}],globalFees:{topupUSDT:{mode:'percent',value:'1'},topupTRX:{mode:'fixed',value:'1'},exchange:{mode:'percent',value:'0.5'}},quote:{mode:'exchange',exchange:'交易所 A',manual:'8',rates:{'交易所 A':'8','交易所 B':'8.1'},available:true,revision:1},topups:[{id:'W-DEMO-001',merchant:'beauty-a',coin:'USDT',amount:units('1000'),fee:units('10'),net:units('990'),feeSource:'全局设置',feeRule:{mode:'percent',value:'1'},status:'success',time:'2026-10-09 09:24:30',completed:'2026-10-09 09:26:15'}],exchanges:[{id:'X-DEMO-001',merchant:'beauty-a',amount:units('100'),fee:units('0.5'),total:units('100.5'),rate:units('8'),trx:units('800'),source:'交易所 A',revision:1,feeSource:'全局设置',feeRule:{mode:'percent',value:'0.5'},status:'success',time:'2026-10-08 16:35:00',completed:'2026-10-08 16:38:20'}],ledger:[{id:'L-001',merchant:'beauty-a',order:'W-DEMO-001',type:'钱包上分',coin:'USDT',amount:units('990'),balance:units('12580.66'),time:'2026-10-09 09:26:15'},{id:'L-002',merchant:'beauty-a',order:'X-DEMO-001',type:'兑换支出',coin:'USDT',amount:-units('100.5'),balance:units('11590.66'),time:'2026-10-08 16:38:20'},{id:'L-003',merchant:'beauty-a',order:'X-DEMO-001',type:'兑换入账',coin:'TRX',amount:units('800'),balance:units('38420.5'),time:'2026-10-08 16:38:20'}]}}
function merchant(s,id){const m=s.merchants.find(x=>x.id===id);if(!m)throw Error('商户不存在');return m}
function effectiveFee(s,id,key){const m=merchant(s,id);return {rule:m.fees?.[key]||s.globalFees[key],source:m.fees?'商户设置':'全局设置'}}
function feeFor(amount,rule){if(!rule||!['fixed','percent'].includes(rule.mode))throw Error('手续费配置无效');const val=units(rule.value);if(rule.mode==='fixed')return val;if(val>100*SCALE)throw Error('比例不能超过100%');const n=BigInt(amount)*BigInt(val),d=100000000n;return Number((n+d-1n)/d)}
function currentQuote(s){const q=s.quote;if(q.mode==='exchange'&&!q.available)throw Error('交易所行情不可用，暂时无法提交新兑换');const rate=units(q.mode==='manual'?q.manual:q.rates[q.exchange]);if(rate<=0)throw Error('汇率无效，暂时无法兑换');return {rate,source:q.mode==='manual'?'手动汇率':q.exchange,revision:q.revision}}
function exchangePreview(s,id,amount){if(amount<=0)throw Error('请输入大于0的兑换本金');const q=currentQuote(s),f=effectiveFee(s,id,'exchange'),fee=feeFor(amount,f.rule),total=amount+fee;if(!Number.isSafeInteger(total))throw Error('金额超出支持范围');const trx=mul(amount,q.rate);if(trx<=0)throw Error('兑换所得TRX必须大于0');return {...q,amount,fee,total,trx,feeSource:f.source,feeRule:{...f.rule}}}
function now(){return new Date().toLocaleString('sv-SE').replace('T',' ')}
function nextId(s,prefix){return `${prefix}-DEMO-${String(++s.seq).padStart(4,'0')}`}
function addLedger(s,m,order,type,coin,amount){s.ledger.unshift({id:nextId(s,'L'),merchant:m.id,order,type,coin,amount,balance:m[coin.toLowerCase()],time:now()})}
// 开发接入：地址分配与到账检查直接复用现有美人桥订单代码；以下仅为原订单Demo已有地址的展示夹具，不新增地址池或分配规则。
const DEMO_COLLECTION={"USDT":{"address":"TDEMO9zP4kX7vM2qR5sL8nC1wF6aB3h","network":"TRON（TRC20）","demo":true},"TRX":{"address":"TDEMOTrx9zP4kX7vM2qR5sL8nC1wF6a","network":"TRON","demo":true}};
function ensureCollectionDisplay(s){for(const o of s.topups)if(!o.collection&&DEMO_COLLECTION[o.coin])o.collection={...DEMO_COLLECTION[o.coin]};return s}
function createTopup(s,id,coin,amount){if(!['USDT','TRX'].includes(coin)||amount<=0)throw Error('请输入有效上分数量');const f=effectiveFee(s,id,'topup'+coin),fee=feeFor(amount,f.rule);if(amount<=fee)throw Error('上分数量必须大于手续费');const o={id:nextId(s,'W'),merchant:id,coin,amount,fee,net:amount-fee,feeSource:f.source,feeRule:{...f.rule},collection:{...DEMO_COLLECTION[coin]},status:'waiting',time:now(),completed:''};s.topups.unshift(o);return o}
// 开发接入：复用现有美人桥订单的到账校验结果/回执，交给本函数做原币钱包净额入账；不要复制旧CNY换算或另建监听器。
function receiveTopup(s,orderId,resolution={mode:'automatic',operator:'系统',reason:''}){const o=s.topups.find(x=>x.id===orderId);if(!o)throw Error('订单不存在');if(o.status!=='waiting')return false;const m=merchant(s,o.merchant),key=o.coin.toLowerCase();if(!Number.isSafeInteger(m[key]+o.net))throw Error('余额超出支持范围');m[key]+=o.net;o.status='success';o.completed=now();o.resolution={...resolution,time:o.completed};addLedger(s,m,o.id,'钱包上分',o.coin,o.net);return true}
// 运营兜底与自动到账使用同一订单状态和入账函数；正式接入必须在服务端以事务竞争待收款状态。
function manualConfirmTopup(s,orderId,reason){const o=s.topups.find(x=>x.id===orderId);if(!o||o.status!=='waiting')throw Error('订单已结束或不存在，不能手动入账');reason=String(reason||'').trim();if(!reason)throw Error('请填写人工核验说明');return receiveTopup(s,orderId,{mode:'manual',operator:'演示运营',reason})}
function cancelTopup(s,orderId,reason){const o=s.topups.find(x=>x.id===orderId);if(!o||o.status!=='waiting')throw Error('订单已结束或不存在，不能取消');reason=String(reason||'').trim();if(!reason)throw Error('请填写取消原因');o.status='cancelled';o.completed=now();o.resolution={mode:'cancelled',operator:'演示运营',reason,time:o.completed};return true}
function createExchange(s,id,amount,expected,requestId){if(!requestId)throw Error('兑换请求标识无效，请重新进入兑换页面');const prior=s.exchanges.find(o=>o.requestId===requestId);if(prior){if(prior.merchant!==id||prior.amount!==amount)throw Error('兑换请求与原订单不一致');return prior}const p=exchangePreview(s,id,amount);if(!expected||['rate','source','revision','fee','total','trx'].some(k=>p[k]!==expected[k]))throw Error('报价或手续费已更新，请重新核对后确认');const m=merchant(s,id);if(m.usdt-m.frozen<p.total)throw Error('USDT可用余额不足，需包含兑换手续费');const nextTrx=m.trx+p.trx;if(!Number.isSafeInteger(nextTrx))throw Error('TRX余额超出支持范围');const time=now(),o={id:nextId(s,'X'),requestId,merchant:id,...p,status:'success',time,completed:time};m.usdt-=p.total;m.trx=nextTrx;s.exchanges.unshift(o);addLedger(s,m,o.id,'兑换支出','USDT',-p.total);addLedger(s,m,o.id,'兑换入账','TRX',p.trx);return o}
function ensureInstantExchange(s){if(s.exchangeMode==='instant-v1')return s;const old=s.exchanges.filter(o=>['pending','processing'].includes(o.status));const released=new Map();for(const o of old)released.set(o.merchant,(released.get(o.merchant)||0)+o.total);for(const [id,total] of released){const m=merchant(s,id);if(!Number.isSafeInteger(total)||m.frozen<total)throw Error('旧版演示冻结记录异常，请核对')}for(const [id,total] of released)merchant(s,id).frozen-=total;for(const o of old){o.status='cancelled';o.completed=now();o.reason='旧版演示未完成订单已取消并释放冻结，请按新流程重新兑换'}s.exchangeMode='instant-v1';return s}
function saveMerchantFees(s,id,enabled,fees){const m=merchant(s,id);if(enabled){for(const key of ['topupUSDT','topupTRX','exchange'])feeFor(SCALE,fees?.[key]);m.fees=fees;m.feeDraft=fees}else{if(m.fees)m.feeDraft=m.fees;m.fees=null}return true}
function getState(){const saved=localStorage.getItem(WALLET_KEY);if(!saved)return ensureCollectionDisplay(ensureInstantExchange(ensureMerchantDemo(seedState())));const s=JSON.parse(saved);if(s.version!==1)throw Error('钱包演示数据版本不匹配');const needsMigration=s.exchangeMode!=='instant-v1'||s.topups.some(o=>!o.collection);ensureMerchantDemo(s);ensureInstantExchange(s);ensureCollectionDisplay(s);if(needsMigration)saveState(s);return s}

function ensureMerchantDemo(s){if(s.merchantDemoVersion)return s;for(let i=3;i<=23;i++){const id='beauty-fixture-'+i;if(!s.merchants.some(m=>m.id===id))s.merchants.push({id,name:'美人桥演示商户 '+String(i).padStart(2,'0'),usdt:0,trx:0,frozen:0,fees:null,profile:{number:'MRQ-DEMO-'+String(i).padStart(3,'0'),agent:'DEMO-'+i,owner:i%2?'演示归属':'演示归属 B',contact:'DEMO-CONTACT-'+i,rate:i%3?'1':'0',floating:i%2?'0.1':'0',login:i%6===0?'locked':'normal',enabled:i%7!==0,group:i===3||i===4?'演示分组':'',created:'2026-10-08 10:00:00'}})}s.merchantDemoVersion=1;return s}
function activeMerchants(s){return s.merchants.filter(m=>!m.deleted)}
function accountTarget(s,id,parent){const list=parent?(merchant(s,parent).subaccounts||[]):s.merchants;const m=list.find(x=>x.id===id&&!x.deleted);if(!m)throw Error('账号不存在');return m}
function validateProfile(v){for(const [key,label] of [['number','美人桥号'],['owner','归属'],['name','商户名称'],['contact','联系方式']])if(!String(v[key]||'').trim())throw Error('请填写'+label);for(const key of ['deposit','rate','floating'])units(v[key]||'0');if(v.bot==='已停用机器人')throw Error('请选择已启用的通知机器人');return v}
function validatePassword(password,confirmation,code){if(!password)throw Error('请填写密码');if(password!==confirmation)throw Error('两次输入的密码不一致');if(code!==undefined&&!/^\d{6}$/.test(code))throw Error('请输入6位谷歌验证码');return true}
function saveAccount(s,id,parent,v,password='',confirmation=''){validateProfile(v);const all=s.merchants.flatMap(m=>[m,...(m.subaccounts||[])]);if(all.some(m=>m.id!==id&&merchantProfile(m).number===v.number))throw Error('美人桥号已存在');if(!id)validatePassword(password,confirmation);const profile={...v};delete profile.name;let m;if(id){m=accountTarget(s,id,parent);m.name=v.name;m.profile={...merchantProfile(m),...profile}}else{m={id:nextId(s,parent?'A':'M'),name:v.name,profile:{...profile,login:'normal',google:false,googleTime:'',created:now()},passwordRevision:1};if(parent){const owner=merchant(s,parent);(owner.subaccounts||=[]).push(m)}else{s.merchants.push({...m,usdt:0,trx:0,frozen:0,fees:null});m=s.merchants.at(-1)}}return m}
function setGroup(s,ids,name){if(!ids.length)throw Error('请选择商户');if(name&&(!/^[\p{Script=Han}A-Za-z0-9]+$/u.test(name)||[...name].length>10))throw Error('分组名称限中文、英文、数字，最多10个字');const targets=ids.map(id=>accountTarget(s,id));for(const m of targets)m.profile={...merchantProfile(m),group:name};return true}
function archiveAccount(s,id,parent){const m=accountTarget(s,id,parent);m.deleted=true;m.deletedAt=now();return m}
function restoreAccount(s,id,parent){const m=(parent?merchant(s,parent).subaccounts||[]:s.merchants).find(x=>x.id===id);if(!m)throw Error('账号不存在');m.deleted=false;return m}
function changePasswordDemo(s,id,parent,password,confirmation,code){validatePassword(password,confirmation,code);const m=accountTarget(s,id,parent);m.passwordRevision=(m.passwordRevision||0)+1;m.passwordChangedAt=now();m.needsInitialPassword=false;return true}
const IMPORT_COLUMNS=['美人桥号','代理id','商户名称','归属','联系方式','押金','费率','上浮费率','地址池标识','TG群ID','通知机器人','是否启用'];
function parseCSV(text){const rows=[];let row=[],field='',quoted=false;const t=text.replace(/^\uFEFF/,'');for(let i=0;i<t.length;i++){const c=t[i];if(c==='"'){if(quoted&&t[i+1]==='"'){field+='"';i++}else if(quoted){quoted=false}else if(!field){quoted=true}else throw Error('CSV引号格式不正确')}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&t[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=c}if(quoted)throw Error('CSV引号未闭合');row.push(field);if(row.some(x=>x.trim()))rows.push(row);return rows}
function prepareImport(s,text){const rows=parseCSV(text),header=rows.shift()||[];if(!IMPORT_COLUMNS.every(x=>header.includes(x)))throw Error('缺少模板必填列，请使用本地CSV模板');if(!rows.length)throw Error('没有可导入的数据');if(rows.length>1000)throw Error('单次最多导入1000条');const seen=new Set(s.merchants.flatMap(m=>[m,...(m.subaccounts||[])]).map(m=>merchantProfile(m).number));return rows.map((r,i)=>{const get=k=>(r[header.indexOf(k)]||'').trim();const v={number:get('美人桥号'),agent:get('代理id'),name:get('商户名称'),owner:get('归属'),contact:get('联系方式'),deposit:get('押金')||'0',rate:get('费率')||'0',floating:get('上浮费率')||'0',pool:get('地址池标识'),tgGroup:get('TG群ID'),bot:get('通知机器人'),enabled:get('是否启用')!=='停用'};try{validateProfile(v);if(seen.has(v.number))throw Error('美人桥号重复');if(!['','启用','停用'].includes(get('是否启用')))throw Error('是否启用只能填启用或停用');seen.add(v.number)}catch(e){throw Error('第'+(i+2)+'行：'+e.message)}return v})}
function importAccounts(s,text){const items=prepareImport(s,text);for(const v of items){const profile={...v,login:'normal',google:false,googleTime:'',created:now()};delete profile.name;s.merchants.push({id:nextId(s,'M'),name:v.name,profile,usdt:0,trx:0,frozen:0,fees:null,needsInitialPassword:true})}return items.length}
function csvText(rows){return '\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/^[=+@\-]/,c=>"'"+c).replace(/"/g,'""')+'"').join(',')).join('\r\n')}

function collectionInfo(o){const info=o.collection;if(!info?.address)return '<div class="receipt"><b>收款信息</b><p>暂未获取到本单收款地址</p></div>';const qr=DEMO_ADDRESS_QR[info.address];return `<div class="receipt collection-info"><div class="collection-head"><h3>收款信息</h3>${info.demo?'<span class="pill">演示地址</span>':''}</div><div class="collection-layout"><div class="collection-qr">${qr?`<svg role="img" aria-label="本单收款地址二维码" data-qr-payload="${esc(info.address)}" viewBox="0 0 ${qr.size} ${qr.size}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="white"/><path d="${qr.path}" fill="#111"/></svg>`:'<p class="small">二维码暂不可用</p>'}<p class="small">地址二维码</p></div><div class="collection-address"><span class="small">本单收款地址</span><code data-collection-address>${esc(info.address)}</code><button class="btn" data-copy-collection="${esc(info.address)}">复制地址</button><div class="small collection-network">网络：${esc(info.network)}</div></div></div><p class="small collection-note">${info.demo?'仅用于演示，勿转账。':''}${o.status==='cancelled'?'订单已取消，请勿继续转账；如已转账，请联系平台核查。':'实际收款到账后自动入账，无需商户确认。'}</p></div>`}

function filters(s,kind){return `<div class="filters"><input class="control" id="searchInput" aria-label="订单号搜索" placeholder="搜索订单号" value="${esc(search)}">${isAdmin?`<select class="control" id="merchantFilter" aria-label="商户筛选"><option value="">全部美人桥商户</option>${activeMerchants(s).map(m=>`<option value="${m.id}" ${adminMerchantFilter===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select>`:''}${kind!=='exchanges'?`<select class="control" id="coinFilter" aria-label="币种筛选"><option value="">全部币种</option>${['USDT','TRX'].map(c=>`<option ${coinFilter===c?'selected':''}>${c}</option>`).join('')}</select>`:''}${kind!=='ledger'?`<select class="control" id="statusFilter" aria-label="状态筛选"><option value="">全部状态</option>${(kind==='topups'?['waiting','success','cancelled']:['success','cancelled']).map(x=>`<option value="${x}" ${statusFilter===x?'selected':''}>${statusNames[x]}</option>`).join('')}</select>`:''}<button class="btn primary" id="queryRecords">查询</button><button class="btn" id="resetFilters">重置</button></div>`}
function filtered(s,kind){const rows=s[kind].filter(o=>(isAdmin?(!adminMerchantFilter||o.merchant===adminMerchantFilter):o.merchant===currentMerchant)&&(!search||(o.id||o.order).toLowerCase().includes(search.toLowerCase()))&&(!coinFilter||o.coin===coinFilter)&&(!statusFilter||o.status===statusFilter));return rows}
function pager(rows){const count=Math.max(1,Math.ceil(rows.length/10));page=Math.min(page,count);return `<div class="section-head" style="margin:18px 0 0"><span class="small">共 ${rows.length} 条</span><div><button class="btn" id="prevPage" ${page<=1?'disabled':''}>上一页</button> <span class="small">${page} / ${count}</span> <button class="btn" id="nextPage" ${page>=count?'disabled':''}>下一页</button></div></div>`}
function records(s,kind){const title=isAdmin?titles[view]:'钱包记录',rows=filtered(s,kind);const pagination=pager(rows);return `<section class="card"><h2 class="card-title">${title}</h2>${!isAdmin?`<div class="wallet-tabs">${[['topups','上分订单'],['exchanges','兑换订单'],['ledger','钱包流水']].map(([id,label])=>`<button class="tab ${recordTab===id?'active':''}" data-record-tab="${id}">${label}</button>`).join('')}</div>`:''}${filters(s,kind)}${kind==='ledger'?ledgerTable(s,rows.slice((page-1)*10,page*10),isAdmin):orderTable(s,rows.slice((page-1)*10,page*10),kind)}${pagination}</section>`}
function ledgerTable(s,rows,admin){return `<div class="table-wrap"><table><thead><tr><th>时间</th>${admin?'<th>商户</th>':''}<th>业务类型</th><th>币种</th><th>收支数量</th><th>账户余额</th><th>关联订单</th></tr></thead><tbody>${rows.length?rows.map(l=>`<tr><td>${esc(l.time)}</td>${admin?`<td>${esc(merchant(s,l.merchant).name)}</td>`:''}<td>${esc(l.type)}</td><td>${l.coin}</td><td class="${l.amount>=0?'positive':'negative'}">${l.amount>=0?'+':''}${fmt(l.amount)}</td><td>${fmt(l.balance)}</td><td>${esc(l.order)}</td></tr>`).join(''):`<tr><td class="empty" colspan="${admin?8:7}">暂无符合条件的流水</td></tr>`}</tbody></table></div>`}
function orderTable(s,rows,kind){const topup=kind==='topups';return `<div class="table-wrap"><table class="${isAdmin&&topup?'admin-topup-table':''}"><thead><tr><th>订单号</th>${isAdmin?'<th>商户</th>':''}<th>${topup?'币种':'兑换本金 USDT'}</th><th>${topup?'收款数量':'手续费 USDT'}</th><th>${topup?'手续费':'合计扣款 USDT'}</th><th>${topup?'净入账':'锁定汇率'}</th>${topup?'':'<th>到账 TRX</th>'}<th>状态</th><th>提交时间</th><th>操作</th></tr></thead><tbody>${rows.length?rows.map(o=>`<tr><td>${esc(o.id)}</td>${isAdmin?`<td>${esc(merchant(s,o.merchant).name)}</td>`:''}<td>${topup?o.coin:fmt(o.amount)}</td><td>${fmt(topup?o.amount:o.fee)}</td><td>${fmt(topup?o.fee:o.total)}</td><td>${topup?(o.status==='cancelled'?'—':fmt(o.net)):fmt(o.rate,4)}</td>${topup?'':`<td>${fmt(o.trx)}</td>`}<td>${badge(o.status)}</td><td>${esc(o.time)}</td><td><div class="order-actions"><button class="link" data-detail="${o.id}">详情</button>${isAdmin&&topup&&o.status==='waiting'?`<button class="link" data-manual-topup="${o.id}">手动确认入账</button><button class="link danger-text" data-cancel-topup="${o.id}">取消订单</button>`:''}</div></td></tr>`).join(''):`<tr><td colspan="${topup?(isAdmin?9:8):(isAdmin?10:9)}" class="empty">暂无符合条件的订单</td></tr>`}</tbody></table></div>`}

function walletManagementTabs(){return `<div class="wallet-tabs wallet-management-tabs" role="tablist" aria-label="钱包管理分类">${[['admin-topups','上分订单'],['admin-exchanges','兑换订单'],['admin-ledger','钱包流水'],['admin-settings','钱包设置']].map(([id,label])=>`<button class="tab ${view===id?'active':''}" role="tab" aria-selected="${view===id}" data-wallet-tab="${id}">${label}</button>`).join('')}</div>`}
function filteredMerchants(s){return activeMerchants(s).filter(m=>{const p=merchantProfile(m);return (!merchantSearch||m.name.toLowerCase().includes(merchantSearch.toLowerCase()))&&(!merchantLoginFilter||p.login===merchantLoginFilter)})}
function accountCells(m){const p=merchantProfile(m);return [p.number,p.agent||'—',m.name,p.group||'—',p.pool||'—',p.owner,p.contact,p.deposit,`<span class="pill protect ${p.login==='normal'?'success':'pending'}">${p.login==='normal'?'正常':'临时封锁'}</span>`,p.rate,p.floating,p.tgGroup||'—',p.bot||'—',`<span class="pill ${p.enabled?'success':''}">${p.enabled?'正常':'停用'}</span>`,`<span class="pill ${p.google?'success':''}">${p.google?'开启':'关闭'}</span>`,p.googleTime||'—',p.created].map((v,i)=>[8,13,14].includes(i)?`<td>${v}</td>`:`<td ${i===16?'class="compact-status" title="'+esc(v)+'"':''}>${esc(v)}</td>`).join('')}
function merchantAdmin(s){const list=filteredMerchants(s),pages=Math.max(1,Math.ceil(list.length/merchantSize));merchantPage=Math.min(merchantPage,pages);const shown=list.slice((merchantPage-1)*merchantSize,merchantPage*merchantSize);for(const id of selectedMerchants)if(!list.some(m=>m.id===id))selectedMerchants.delete(id);return `<section class="card merchant-card"><div class="filters"><input class="control" id="merchantSearch" aria-label="商户名称" placeholder="商户名称" value="${esc(merchantSearch)}"><select class="control" id="merchantLoginFilter" aria-label="登录保护状态"><option value="">请选择登录保护状态</option><option value="normal" ${merchantLoginFilter==='normal'?'selected':''}>正常</option><option value="locked" ${merchantLoginFilter==='locked'?'selected':''}>临时封锁</option></select><button class="btn primary" id="queryMerchants">搜索</button><button class="btn" id="resetMerchants">重置</button><button class="btn primary" id="newMerchant">新增商户</button><button class="btn primary" id="importMerchants">批量导入</button><button class="btn primary" id="exportMerchants">导出</button><button class="btn primary" id="bindMerchants" ${selectedMerchants.size?'':'disabled'}>绑定商户</button><button class="btn" style="background:#e6a23c;color:white;border-color:#e6a23c" id="unbindMerchants" ${selectedMerchants.size?'':'disabled'}>解绑商户</button></div><div class="table-wrap"><table class="merchant-table"><thead><tr><th><input type="checkbox" id="selectAllMerchants" aria-label="选择本页商户" ${shown.length&&shown.every(m=>selectedMerchants.has(m.id))?'checked':''}></th>${['美人桥号','代理id','商户名','绑定分组名称','地址池标识','归属','联系方式','押金','登录保护状态','费率','上浮费率','商户通知群 ID','通知机器人','是否启用','登录谷歌验证','谷歌绑定时间','创建时间','操作'].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${shown.length?shown.map(m=>`<tr><td><input type="checkbox" data-select-merchant="${m.id}" aria-label="选择 ${esc(m.name)}" ${selectedMerchants.has(m.id)?'checked':''}></td>${accountCells(m)}<td><div><button class="link" data-subaccounts="${m.id}">子账户</button><button class="link" data-edit-merchant="${m.id}">编辑</button><button class="link" data-password-merchant="${m.id}">修改密码</button><button class="link danger" data-delete-merchant="${m.id}">删除</button></div><div><button class="link" data-wallet-detail="${m.id}">钱包详情</button><button class="link" data-merchant-fee="${m.id}">钱包手续费</button></div></td></tr>`).join(''):'<tr><td class="empty" colspan="19">暂无数据</td></tr>'}</tbody></table></div><div class="merchant-pagination"><span class="total">共 ${list.length} 条${selectedMerchants.size?' · 已选 '+selectedMerchants.size+' 条':''}</span><button class="page-button" id="merchantPrev" aria-label="上一页" ${merchantPage===1?'disabled':''}>‹</button>${Array.from({length:pages},(_,i)=>`<button class="page-button ${i+1===merchantPage?'active':''}" data-merchant-page="${i+1}" aria-label="第${i+1}页">${i+1}</button>`).join('')}<button class="page-button" id="merchantNext" aria-label="下一页" ${merchantPage===pages?'disabled':''}>›</button><select class="control" id="merchantPageSize" aria-label="每页条数">${[10,20,30,50].map(n=>`<option value="${n}" ${merchantSize===n?'selected':''}>${n}条/页</option>`).join('')}</select><span>前往</span><input class="control page-jump" id="merchantJump" aria-label="前往页码" type="number" min="1" max="${pages}" value="${merchantPage}"><span>页</span></div></section>`}
function walletDetailModal(id){const s=getState(),m=merchant(s,id);openModal('商户钱包 · '+m.name,`<div class="wallet-detail-grid"><div class="summary"><h3>USDT钱包</h3>${kv('总余额',fmt(m.usdt))}${kv('可用余额',fmt(m.usdt-m.frozen))}</div><div class="summary"><h3>TRX钱包</h3>${kv('总余额',fmt(m.trx))}${kv('可用余额',fmt(m.trx))}</div></div><div class="notice">${m.fees?'使用商户单独设置的手续费':'未单独配置，使用全局手续费'}。商户钱包是平台记账账户，实际操作由平台处理。</div><div class="actions"><button class="btn" id="walletDetailLedger">查看钱包流水</button><button class="btn primary" id="walletDetailFee">钱包手续费设置</button></div>`);$('walletDetailLedger').onclick=()=>{closeModal();if(window.parent!==window){sessionStorage.setItem('bluepay.beauty-wallet.filter',id);window.parent.location.hash='admin-beauty-wallet-ledger'}else{adminMerchantFilter=id;view='admin-ledger';resetRecordFilters();render()}};$('walletDetailFee').onclick=()=>merchantFeeModal(id)}
function merchantEditor(id,parent=null){const s=getState(),m=id?accountTarget(s,id,parent):null,p=m?merchantProfile(m):{number:'',agent:'',owner:'',contact:'',deposit:'0',rate:'0',floating:'0',pool:'',tgGroup:'',bot:'',enabled:true};const input=(key,label,value,required=false,type='text')=>`<div class="profile-field"><label for="profile-${key}">${required?'<span class="required">*</span>':''}${label}</label><input class="control" id="profile-${key}" type="${type}" value="${esc(value)}" ${required?'required':''} autocomplete="${type==='password'?'new-password':'off'}"></div>`;const owners=[...new Set(['演示归属','演示归属 B',p.owner].filter(Boolean))];openModal(id?'编辑商户信息 — '+m.name:parent?'新增子账户信息':'新增商户信息',`<div class="profile-form">${input('number','美人桥号',p.number,true)}${input('agent','代理id',p.agent)}<div class="profile-field"><label for="profile-owner"><span class="required">*</span>归属</label><select class="control" id="profile-owner"><option value="">请选择归属</option>${owners.map(o=>`<option ${p.owner===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>${input('name','商户名称',m?.name||'',true)}${input('contact','联系方式',p.contact,true)}${input('deposit','押金',p.deposit,true)}${input('rate','费率',p.rate,true)}${input('floating','上浮费率',p.floating)}${!id?input('password','密码','',true,'password')+input('confirmation','确认密码','',true,'password'):''}${input('pool','地址池标识',p.pool)}<div></div><div class="profile-field full"><label for="profile-tgGroup">TG 群 ID<span class="new-tag">NEW</span></label><input class="control" id="profile-tgGroup" placeholder="请输入群组ID，如 -1001234567890" value="${esc(p.tgGroup)}"><p class="hint">未填写则该商户不发送 TG 通知。⚠️ 修改前请确认 Bot 已加入对应群。</p></div><div class="profile-field full"><label for="profile-bot">通知机器人<span class="new-tag">NEW</span></label><select class="control" id="profile-bot"><option value="">请选择通知机器人</option>${[...new Set(['演示通知机器人 A','演示通知机器人 B',p.bot].filter(Boolean))].map(b=>`<option ${p.bot===b?'selected':''}>${esc(b)}</option>`).join('')}<option disabled>已停用机器人</option></select><p class="hint">仅展示已启用项可选；已停用项灰显</p></div><div class="profile-field full"><label for="profile-enabled">是否启用</label><input id="profile-enabled" type="checkbox" role="switch" class="profile-switch" ${p.enabled?'checked':''}></div></div><div class="error-text" id="profileError"></div><div class="actions"><button class="btn" id="cancelMerchantEdit">取消</button><button class="btn primary" id="saveMerchantProfile">确定</button></div>`);const back=()=>parent?subaccountModal(parent):closeModal();if(parent)modalDismissHandler=back;$('cancelMerchantEdit').onclick=back;$('saveMerchantProfile').onclick=()=>{try{const v=Object.fromEntries(['number','agent','owner','name','contact','deposit','rate','floating','pool','tgGroup','bot'].map(k=>[k,$('profile-'+k).value.trim()]));v.enabled=$('profile-enabled').checked;const state=getState();saveAccount(state,id,parent,v,$('profile-password')?.value||'',$('profile-confirmation')?.value||'');saveState(state);render();back();toast('商户资料已保存')}catch(e){$('profileError').textContent=e.message}}}
function subaccountModal(parent){const s=getState(),m=merchant(s,parent),children=(m.subaccounts||[]).filter(x=>!x.deleted);openModal('子账户列表 - 商户名：'+m.name,`<button class="btn primary" id="newSubaccount">新增子账户</button><div class="table-wrap" style="margin-top:18px"><table><thead><tr>${['美人桥号','代理id','商户名','归属','联系方式','押金','费率','上浮费率','商户通知群 ID','通知机器人','地址池标识','是否启用','操作'].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${children.length?children.map(a=>{const p=merchantProfile(a);return `<tr>${[p.number,p.agent||'—',a.name,p.owner,p.contact,p.deposit,p.rate,p.floating,p.tgGroup||'—',p.bot||'—',p.pool||'—',p.enabled?'正常':'停用'].map(v=>`<td>${esc(v)}</td>`).join('')}<td><button class="link" data-edit-child="${a.id}">编辑</button><button class="link" data-password-child="${a.id}">修改密码</button><button class="link" data-delete-child="${a.id}">删除</button></td></tr>`}).join(''):'<tr><td class="empty" colspan="13">暂无数据</td></tr>'}</tbody></table></div>`);$('newSubaccount').onclick=()=>merchantEditor(null,parent);document.querySelectorAll('[data-edit-child]').forEach(b=>b.onclick=()=>merchantEditor(b.dataset.editChild,parent));document.querySelectorAll('[data-password-child]').forEach(b=>b.onclick=()=>passwordModal(b.dataset.passwordChild,parent));document.querySelectorAll('[data-delete-child]').forEach(b=>b.onclick=()=>deleteMerchantModal(b.dataset.deleteChild,parent))}
function passwordModal(id,parent=null){const m=accountTarget(getState(),id,parent),p=merchantProfile(m);openModal('修改密码 — '+p.number,`<div class="profile-form"><div class="profile-field full"><label>美人桥号</label><input class="control" value="${esc(p.number)}" readonly></div><div class="profile-field full"><label>商户名称</label><input class="control" value="${esc(m.name)}" readonly></div>${[['newPassword','新密码','password','请输入新密码'],['confirmPassword','确认密码','password','请再次输入新密码'],['googleCode','谷歌验证码','text','请输入6位谷歌验证码']].map(([key,label,type,placeholder])=>`<div class="profile-field full"><label for="${key}"><span class="required">*</span>${label}</label><input class="control" id="${key}" type="${type}" placeholder="${placeholder}" autocomplete="off"></div>`).join('')}</div><p class="small" style="margin-top:14px">本地演示：不验证真实谷歌身份，不保存密码或验证码。</p><div class="error-text" id="passwordError"></div><div class="actions"><button class="btn" id="cancelPassword">取消</button><button class="btn primary" id="savePassword">确认修改</button></div>`);const back=()=>parent?subaccountModal(parent):closeModal();if(parent)modalDismissHandler=back;$('cancelPassword').onclick=back;$('savePassword').onclick=()=>{try{const s=getState();changePasswordDemo(s,id,parent,$('newPassword').value,$('confirmPassword').value,$('googleCode').value);saveState(s);back();toast('已模拟修改密码')}catch(e){$('passwordError').textContent=e.message}}}
function deleteMerchantModal(id,parent=null){const m=accountTarget(getState(),id,parent);openModal('删除商户 — '+m.name,`<p>确认删除 ${esc(m.name)}？</p><p class="small">演示删除可恢复，原有钱包余额、订单和流水保留。</p><div class="actions"><button class="btn" id="cancelDeleteMerchant">取消</button><button class="btn danger" id="confirmDeleteMerchant">确定</button></div>`);const back=()=>parent?subaccountModal(parent):closeModal();if(parent)modalDismissHandler=back;$('cancelDeleteMerchant').onclick=back;$('confirmDeleteMerchant').onclick=()=>{if(mutate(s=>archiveAccount(s,id,parent))){selectedMerchants.delete(id);back();toast('已删除，可在演示操作中恢复')}}}
function groupModal(unbind=false){const ids=[...selectedMerchants],s=getState();openModal(unbind?'解绑商户':'绑定商户',`<div class="table-wrap"><table><thead><tr><th>美人桥号</th><th>商户名</th><th>归属</th></tr></thead><tbody>${ids.map(id=>{const m=merchant(s,id),p=merchantProfile(m);return `<tr><td>${esc(p.number)}</td><td>${esc(m.name)}</td><td>${esc(p.owner)}</td></tr>`}).join('')}</tbody></table></div><p style="margin:16px 0">${unbind?'将以上商户解除当前分组绑定？':'将以上商户绑定为一组，显示绑定分组名称为：'}</p>${unbind?'':'<input class="control" id="groupName" aria-label="分组名称" maxlength="10" placeholder="请输入分组名称（中文/英文/数字，最多10个字）"><div class="small" style="text-align:right" id="groupCount">0/10</div>'}<div class="error-text" id="groupError"></div><div class="actions"><button class="btn" id="cancelGroup">取消</button><button class="btn primary" id="saveGroup">确认</button></div>`);$('cancelGroup').onclick=closeModal;if($('groupName'))$('groupName').oninput=()=>$('groupCount').textContent=[...$('groupName').value].length+'/10';$('saveGroup').onclick=()=>{try{const name=unbind?'':$('groupName').value.trim();if(!unbind&&!name)throw Error('请填写分组名称');const next=getState();setGroup(next,ids,name);saveState(next);selectedMerchants.clear();render();closeModal();toast(unbind?'已解除分组绑定':'商户分组已绑定')}catch(e){$('groupError').textContent=e.message}}}
function downloadCSV(name,rows){const url=URL.createObjectURL(new Blob([csvText(rows)],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportMerchants(){const list=filteredMerchants(getState());downloadCSV('美人桥商户-'+new Date().toISOString().slice(0,10)+'.csv',[['美人桥号','代理id','商户名','绑定分组名称','地址池标识','归属','联系方式','押金','登录保护状态','费率','上浮费率','商户通知群 ID','通知机器人','是否启用','登录谷歌验证','谷歌绑定时间','创建时间','USDT余额','TRX余额'],...list.map(m=>{const p=merchantProfile(m);return [p.number,p.agent,m.name,p.group,p.pool,p.owner,p.contact,p.deposit,p.login==='normal'?'正常':'临时封锁',p.rate,p.floating,p.tgGroup,p.bot,p.enabled?'正常':'停用',p.google?'开启':'关闭',p.googleTime,p.created,m.usdt/SCALE,m.trx/SCALE]})]);toast('已导出当前筛选的全部商户')}
function importMerchantModal(){openModal('批量导入商户',`<p>选择本地 CSV 文件，校验并预览后一次导入。新商户钱包初始余额为0。</p><p class="small">本地演示使用CSV模板；线上文件格式及账号初始化规则待接入确认。</p><div class="actions" style="justify-content:flex-start"><button class="btn" id="importTemplate">下载CSV模板</button><input id="importFile" type="file" accept=".csv,text/csv" aria-label="选择商户CSV文件"></div><label for="importText" class="small">也可粘贴CSV内容</label><textarea class="import-text" id="importText" placeholder="粘贴模板表头及商户资料"></textarea><div class="error-text" id="importError"></div><div id="importPreview" class="import-preview"></div><div class="actions"><button class="btn" id="cancelImport">取消</button><button class="btn" id="previewImport">校验预览</button><button class="btn primary" id="confirmImport" disabled>确认导入</button></div>`);let validatedText=null;const invalidate=()=>{validatedText=null;$('confirmImport').disabled=true;$('importPreview').innerHTML=''};$('importText').oninput=invalidate;$('importFile').onchange=async()=>{try{const file=$('importFile').files[0];if(file.size>2*1024*1024)throw Error('文件不能超过2MB');$('importText').value=await file.text();invalidate()}catch(e){$('importError').textContent=e.message}};$('importTemplate').onclick=()=>downloadCSV('美人桥商户导入模板.csv',[IMPORT_COLUMNS,['DEMO-NEW-001','','新增演示商户','演示归属','DEMO-CONTACT','0','1','0','TRX','','','启用']]);$('cancelImport').onclick=closeModal;$('previewImport').onclick=()=>{try{const items=prepareImport(getState(),$('importText').value);validatedText=$('importText').value;$('importError').textContent='';$('importPreview').innerHTML=`<p>校验通过，共 ${items.length} 条</p><table><thead><tr><th>美人桥号</th><th>商户名</th><th>归属</th><th>是否启用</th></tr></thead><tbody>${items.map(v=>`<tr><td>${esc(v.number)}</td><td>${esc(v.name)}</td><td>${esc(v.owner)}</td><td>${v.enabled?'启用':'停用'}</td></tr>`).join('')}</tbody></table>`;$('confirmImport').disabled=false}catch(e){invalidate();$('importError').textContent=e.message}};$('confirmImport').onclick=()=>{try{if(validatedText===null||validatedText!==$('importText').value)throw Error('请重新校验预览');const s=getState(),count=importAccounts(s,validatedText);saveState(s);merchantPage=1;merchantSearch='';merchantLoginFilter='';render();closeModal();toast('已导入 '+count+' 个商户，钱包余额为0')}catch(e){$('importError').textContent=e.message}}}
function feeFields(f,prefix){return [['topupUSDT','USDT上分','USDT'],['topupTRX','TRX上分','TRX'],['exchange','USDT兑换TRX','USDT']].map(([key,label,coin])=>{const r=f[key];return `<div class="fee-row"><label for="${prefix}-${key}-mode">${label}</label><select class="control" id="${prefix}-${key}-mode" data-fee-select="${prefix}-${key}"><option value="fixed" ${r.mode==='fixed'?'selected':''}>固定金额</option><option value="percent" ${r.mode==='percent'?'selected':''}>比例</option></select><div class="fee-value"><input class="control" id="${prefix}-${key}-value" inputmode="decimal" aria-label="${label}手续费值" value="${esc(r.value)}"><span id="${prefix}-${key}-unit">${r.mode==='percent'?'%':coin}</span></div></div>`}).join('')}
function readFeeFields(prefix){const f={};for(const key of ['topupUSDT','topupTRX','exchange']){const mode=$(prefix+'-'+key+'-mode').value,value=$(prefix+'-'+key+'-value').value;feeFor(SCALE,{mode,value});f[key]={mode,value}}return f}
function settings(s){const q=s.quote;return `<div class="split"><section class="card"><h2 class="card-title">全局手续费设置</h2><p class="config-source">商户未单独设置时使用全局；单独设置后覆盖全局，不叠加。</p>${feeFields(s.globalFees,'global')}<p class="small">固定金额与比例二选一。兑换手续费扣USDT。</p><div class="settings-tools"><button class="btn primary" id="saveGlobalFees">保存手续费</button></div></section><section class="card"><h2 class="card-title">USDT / TRX 汇率设置</h2><div class="form-row"><label for="rateMode">汇率来源</label><select class="control" id="rateMode"><option value="exchange" ${q.mode==='exchange'?'selected':''}>交易所行情</option><option value="manual" ${q.mode==='manual'?'selected':''}>手动汇率</option></select></div><div class="form-row" id="exchangeSourceRow" ${q.mode==='manual'?'hidden':''}><label for="exchangeSource">取用交易所</label><select class="control" id="exchangeSource">${Object.keys(q.rates).map(x=>`<option ${x===q.exchange?'selected':''}>${esc(x)}</option>`).join('')}</select><p class="small">此处使用演示来源，实际交易所待接入时确定。</p></div><div class="form-row" id="manualRateRow" ${q.mode==='exchange'?'hidden':''}><label for="manualRate">手动汇率</label><div class="input-unit"><span>1 USDT =</span><input id="manualRate" inputmode="decimal" aria-label="手动汇率" value="${esc(q.manual)}"><span>TRX</span></div></div><div class="notice">保存后用于新订单。已提交订单的汇率、手续费和到账数量保持锁定。</div><div class="settings-tools"><button class="btn primary" id="saveRate">保存汇率</button></div></section></div>`}
function tools(s){return `<details class="demo-tools"><summary>演示操作 · 收款与行情均为模拟数据</summary><div class="tools-body">${isAdmin?`<button class="btn" id="toggleMarket">${s.quote.available?'模拟行情中断':'恢复演示行情'}</button><button class="btn" id="moveMarket">模拟行情变化</button>${view==='admin-merchants'?s.merchants.flatMap(m=>[...(m.deleted?[`<button class="btn" data-restore-merchant="${m.id}">恢复 ${esc(m.name)}</button>`]:[]),...(m.subaccounts||[]).filter(a=>a.deleted).map(a=>`<button class="btn" data-restore-merchant="${a.id}" data-restore-parent="${m.id}">恢复子账户 ${esc(a.name)}</button>`)]).join(''):''}${view==='admin-topups'?s.topups.map(o=>o.status==='waiting'?`<button class="btn" data-receive="${o.id}">模拟收款到账 ${o.id}</button>`:`<button class="btn" data-repeat-receive="${o.id}">测试重复收款通知 ${o.id}</button>`).join(''):''}`:`<label for="demoMerchant">演示登录商户</label><select class="control" id="demoMerchant" style="max-width:220px">${activeMerchants(s).map(m=>`<option value="${m.id}" ${m.id===currentMerchant?'selected':''}>${esc(m.name)}</option>`).join('')}</select>`}<span>用于验证流程，不会发起真实收款、兑换或行情请求。</span></div></details>`}
function render(){const s=getState();if(view==='exchange'&&!exchangeRequestId)exchangeRequestId=crypto.randomUUID();if(!isAdmin&&merchant(s,currentMerchant).deleted)currentMerchant=activeMerchants(s)[0]?.id||currentMerchant;$('accountName').textContent=isAdmin?'美人桥业务后台':merchant(s,currentMerchant).name;$('pageTitle').textContent=isAdmin&&['admin-topups','admin-exchanges','admin-ledger','admin-settings'].includes(view)?'钱包管理':titles[view]||(view==='exchange'?'USDT兑换TRX':view==='topup'?'钱包上分':'钱包上分订单');const content=view==='home'?home(s):view==='topup'||view==='exchange'?form(s,view):view==='records'?records(s,recordTab):view==='admin-merchants'?merchantAdmin(s):view==='admin-settings'?settings(s):view==='receipt'?receipt(s,s.topups.find(o=>o.id===receipt.order)):records(s,view.replace('admin-',''));$('app').innerHTML=(isAdmin&&view!=='admin-merchants'?walletManagementTabs():'')+content+tools(s);bind();if(view==='topup'||view==='exchange')updatePreview()}
function topupOperationModal(id,cancel=false){if(!isAdmin)return;const s=getState(),o=s.topups.find(x=>x.id===id);if(!o||o.status!=='waiting')return toast('订单已结束，不能操作');const title=cancel?'取消订单':'手动确认入账';openModal(title,kv('订单号',esc(o.id))+kv('商户',esc(merchant(s,o.merchant).name))+kv('币种',o.coin)+kv('待转数量',`${fmt(o.amount)} ${o.coin}`)+(!cancel?kv('手续费',`${fmt(o.fee)} ${o.coin}`)+kv('净入账',`${fmt(o.net)} ${o.coin}`,true):'')+`<div class="notice">${cancel?'取消后不增加钱包余额；后续到账通知不自动入账，已付款的情况需联系平台核查。':'请核实本单实际收款后再确认。确认后按本单手续费净额入账，自动到账回执不会重复增加余额。'}</div><div class="form-row"><label for="operationReason">${cancel?'取消原因':'人工核验说明'} <span class="danger-text">*</span></label><textarea class="control" id="operationReason" rows="3" placeholder="${cancel?'请输入取消原因':'请输入收款核验依据或异常说明'}"></textarea></div><div class="error" id="operationError" role="alert"></div><div class="actions"><button class="btn" id="dismissTopupOperation">返回</button><button class="btn ${cancel?'danger':'primary'}" id="confirmTopupOperation">${cancel?'确认取消订单':'确认入账'}</button></div>`);$('operationReason').oninput=()=>{$('operationError').textContent=''};$('dismissTopupOperation').onclick=closeModal;$('confirmTopupOperation').onclick=()=>{const reason=$('operationReason').value;try{const live=getState();if(cancel)cancelTopup(live,id,reason);else manualConfirmTopup(live,id,reason);saveState(live);closeModal();render();toast(cancel?'订单已取消，钱包余额未变':'手动入账成功，已增加钱包净额')}catch(e){$('operationError').textContent=e.message}}}
function detail(id){const s=getState(),o=s.topups.find(x=>x.id===id)||s.exchanges.find(x=>x.id===id);if(!o||(!isAdmin&&o.merchant!==currentMerchant))return toast('该笔历史演示流水暂无订单详情');const t=Boolean(o.coin);openModal(t?'上分订单详情':'兑换订单详情',kv('订单号',esc(o.id))+kv('商户',esc(merchant(s,o.merchant).name))+kv('状态',badge(o.status))+kv('提交时间',esc(o.time))+(t?kv('上分数量',`${fmt(o.amount)} ${o.coin}`)+kv('手续费',`${fmt(o.fee)} ${o.coin}`)+kv(o.status==='waiting'?'预计净入账':'净入账',`${fmt(o.status==='cancelled'?0:o.net)} ${o.coin}`,true):kv('兑换本金',`${fmt(o.amount)} USDT`)+kv('手续费',`${fmt(o.fee)} USDT`)+kv('合计扣款',`${fmt(o.total)} USDT`)+kv('锁定来源',esc(o.source))+kv('锁定汇率',`1 USDT = ${fmt(o.rate,4)} TRX`)+kv('到账数量',`${fmt(o.trx)} TRX`,true))+kv('完成时间',esc(o.completed||'—'))+(o.reason?`<div class="notice">${esc(o.reason)}</div>`:'')+(t&&isAdmin&&o.resolution?kv('处理方式',o.resolution.mode==='manual'?'手动确认入账':o.resolution.mode==='cancelled'?'运营取消':'自动入账')+kv('操作人',esc(o.resolution.operator))+kv('操作时间',esc(o.resolution.time))+(o.resolution.reason?kv('操作说明',esc(o.resolution.reason)):''):'')+(t?collectionInfo(o):''));bindCollectionCopy()}
function merchantFeeModal(id){const s=getState(),m=merchant(s,id);openModal('商户手续费 · '+m.name,`<div class="fee-toggle"><label for="merchantFeeEnabled">启用单独设置</label><input id="merchantFeeEnabled" type="checkbox" role="switch" class="profile-switch" ${m.fees?'checked':''}></div><fieldset id="merchantFeeFields" class="fee-fields" ${m.fees?'':'disabled'}>${feeFields(m.fees||m.feeDraft||s.globalFees,'merchant')}</fieldset><div class="notice" id="merchantFeeHint">${m.fees?'单独设置覆盖全局，不叠加。':'关闭时使用全局手续费，以下单独设置暂不生效。'}</div><div class="error-text" id="merchantFeeError"></div><div class="actions"><button class="btn primary" id="saveMerchantFee">保存</button></div>`);$('merchantFeeEnabled').onchange=()=>{const enabled=$('merchantFeeEnabled').checked;$('merchantFeeFields').disabled=!enabled;$('merchantFeeHint').textContent=enabled?'单独设置覆盖全局，不叠加。':'关闭时使用全局手续费，以下单独设置暂不生效。'};$('saveMerchantFee').onclick=()=>{try{const enabled=$('merchantFeeEnabled').checked,fees=enabled?readFeeFields('merchant'):null;if(mutate(next=>saveMerchantFees(next,id,enabled,fees))===null)return;closeModal();toast('商户手续费已保存')}catch(e){$('merchantFeeError').textContent=e.message}};bindFeeSelects()}
function bindFeeSelects(){document.querySelectorAll('[data-fee-select]').forEach(el=>el.onchange=()=>{const key=el.dataset.feeSelect;$(key+'-unit').textContent=el.value==='percent'?'%':key.endsWith('topupTRX')?'TRX':'USDT'})}
function resetRecordFilters(){search='';statusFilter='';coinFilter='';page=1}
function bind(){const on=(id,fn)=>{if($(id))$(id).onclick=fn};on('openExchange',()=>{exchangeRequestId=crypto.randomUUID();view='exchange';render()});on('backHome',backHome);on('backHome2',backHome);on('allRecords',()=>{view='records';recordTab='topups';resetRecordFilters();render()});document.querySelectorAll('[data-topup]').forEach(b=>b.onclick=()=>{topupCoin=b.dataset.topup;view='topup';render()});if($('tradeAmount'))$('tradeAmount').oninput=updatePreview;if($('topupCurrency'))$('topupCurrency').onchange=()=>{topupCoin=$('topupCurrency').value;updatePreview()};on('submitTrade',()=>{try{const s=getState(),amount=units($('tradeAmount').value);if(view==='exchange'){const o=createExchange(s,currentMerchant,amount,amountPreview,exchangeRequestId);saveState(s);view='records';recordTab='exchanges';resetRecordFilters();render();toast(`兑换成功，扣除 ${fmt(o.total)} USDT，到账 ${fmt(o.trx)} TRX`)}else{const live=effectiveFee(s,currentMerchant,'topup'+topupCoin),fee=feeFor(amount,live.rule);if(!amountPreview||fee!==amountPreview.fee)throw Error('手续费已更新，请重新核对后确认');const o=createTopup(s,currentMerchant,topupCoin,amount);saveState(s);receipt.order=o.id;view='receipt';render()}}catch(e){updatePreview();$('formError').textContent=e.message}});
document.querySelectorAll('[data-wallet-tab]').forEach(b=>b.onclick=()=>{view=b.dataset.walletTab;resetRecordFilters();render()});on('queryMerchants',()=>{merchantSearch=$('merchantSearch').value.trim();merchantLoginFilter=$('merchantLoginFilter').value;merchantPage=1;selectedMerchants.clear();render()});on('resetMerchants',()=>{merchantSearch='';merchantLoginFilter='';merchantPage=1;selectedMerchants.clear();render()});on('newMerchant',()=>merchantEditor(null));on('importMerchants',importMerchantModal);on('exportMerchants',exportMerchants);on('bindMerchants',()=>groupModal());on('unbindMerchants',()=>groupModal(true));on('merchantPrev',()=>{merchantPage--;render()});on('merchantNext',()=>{merchantPage++;render()});if($('merchantPageSize'))$('merchantPageSize').onchange=()=>{merchantSize=Number($('merchantPageSize').value);merchantPage=1;render()};if($('merchantJump'))$('merchantJump').onchange=()=>{merchantPage=Math.min(Math.max(1,Number($('merchantJump').value)||1),Math.max(1,Math.ceil(filteredMerchants(getState()).length/merchantSize)));render()};document.querySelectorAll('[data-merchant-page]').forEach(b=>b.onclick=()=>{merchantPage=Number(b.dataset.merchantPage);render()});if($('selectAllMerchants'))$('selectAllMerchants').onchange=()=>{const checked=$('selectAllMerchants').checked;document.querySelectorAll('[data-select-merchant]').forEach(b=>checked?selectedMerchants.add(b.dataset.selectMerchant):selectedMerchants.delete(b.dataset.selectMerchant));render()};document.querySelectorAll('[data-select-merchant]').forEach(b=>b.onchange=()=>{b.checked?selectedMerchants.add(b.dataset.selectMerchant):selectedMerchants.delete(b.dataset.selectMerchant);render()});document.querySelectorAll('[data-edit-merchant]').forEach(b=>b.onclick=()=>merchantEditor(b.dataset.editMerchant));document.querySelectorAll('[data-subaccounts]').forEach(b=>b.onclick=()=>subaccountModal(b.dataset.subaccounts));document.querySelectorAll('[data-password-merchant]').forEach(b=>b.onclick=()=>passwordModal(b.dataset.passwordMerchant));document.querySelectorAll('[data-delete-merchant]').forEach(b=>b.onclick=()=>deleteMerchantModal(b.dataset.deleteMerchant));document.querySelectorAll('[data-wallet-detail]').forEach(b=>b.onclick=()=>walletDetailModal(b.dataset.walletDetail));document.querySelectorAll('[data-restore-merchant]').forEach(b=>b.onclick=()=>{mutate(s=>restoreAccount(s,b.dataset.restoreMerchant,b.dataset.restoreParent));toast('演示商户已恢复')});document.querySelectorAll('[data-record-tab]').forEach(b=>b.onclick=()=>{recordTab=b.dataset.recordTab;resetRecordFilters();render()});on('queryRecords',()=>{search=$('searchInput').value.trim();statusFilter=$('statusFilter')?.value||'';coinFilter=$('coinFilter')?.value||'';adminMerchantFilter=$('merchantFilter')?.value||'';page=1;render()});on('resetFilters',()=>{resetRecordFilters();adminMerchantFilter='';render()});on('prevPage',()=>{page--;render()});on('nextPage',()=>{page++;render()});document.querySelectorAll('[data-manual-topup]').forEach(b=>b.onclick=()=>topupOperationModal(b.dataset.manualTopup));document.querySelectorAll('[data-cancel-topup]').forEach(b=>b.onclick=()=>topupOperationModal(b.dataset.cancelTopup,true));document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));document.querySelectorAll('[data-merchant-fee]').forEach(b=>b.onclick=()=>merchantFeeModal(b.dataset.merchantFee));document.querySelectorAll('[data-merchant-ledger]').forEach(b=>b.onclick=()=>{adminMerchantFilter=b.dataset.merchantLedger;view='admin-ledger';resetRecordFilters();render()});
on('saveGlobalFees',()=>{try{const fees=readFeeFields('global');if(mutate(s=>s.globalFees=fees)===null)return;toast('全局手续费已保存，商户单独配置保持独立')}catch(e){toast(e.message)}});if($('rateMode'))$('rateMode').onchange=()=>{$('exchangeSourceRow').hidden=$('rateMode').value!=='exchange';$('manualRateRow').hidden=$('rateMode').value!=='manual'};on('saveRate',()=>{try{const mode=$('rateMode').value,exchange=$('exchangeSource').value,manual=$('manualRate').value;if(mode==='manual'&&units(manual)<=0)throw Error('手动汇率必须大于0');if(mutate(s=>{s.quote.mode=mode;s.quote.exchange=exchange;s.quote.manual=manual;s.quote.revision++;return true})===null)return;toast('汇率已保存，已有订单保持锁定报价')}catch(e){toast(e.message)}});on('toggleMarket',()=>{mutate(s=>{s.quote.available=!s.quote.available;s.quote.revision++});toast('演示行情状态已切换')});on('moveMarket',()=>{mutate(s=>{s.quote.rates[s.quote.exchange]=String((units(s.quote.rates[s.quote.exchange])+units('0.1'))/SCALE);s.quote.revision++});toast('演示行情已变化，已有订单报价保持不变')});document.querySelectorAll('[data-receive],[data-repeat-receive]').forEach(b=>b.onclick=()=>{const id=b.dataset.receive||b.dataset.repeatReceive;const result=mutate(s=>receiveTopup(s,id));toast(result?'收款通知已触发原币自动入账':'订单已结束，本次通知未增加余额')});if($('demoMerchant'))$('demoMerchant').onchange=()=>{currentMerchant=$('demoMerchant').value;view='home';resetRecordFilters();render()};bindFeeSelects();bindCollectionCopy()}
$('closeModal').onclick=dismissModal;$('modalShade').onclick=e=>{if(e.target===$('modalShade'))dismissModal()};document.addEventListener('keydown',e=>{if($('modalShade').hidden)return;if(e.key==='Escape')dismissModal();if(e.key==='Tab'){const items=[...$('modalShade').querySelectorAll('button,input,select')].filter(el=>!el.disabled&&el.getClientRects().length);const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});window.addEventListener('storage',e=>{if(e.key===WALLET_KEY){if(view==='exchange'||view==='topup')updatePreview();else render()}});render();
