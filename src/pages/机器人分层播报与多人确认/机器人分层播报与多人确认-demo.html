<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>机器人分层播报与多人确认｜现状页面</title>
  <style>
    :root {
      --primary: #409eff;
      --primary-hover: #66b1ff;
      --primary-active: #3a8ee6;
      --danger: #f56c6c;
      --warning: #e6a23c;
      --success: #67c23a;
      --info: #909399;
      --page: #f2f5f8;
      --surface: #ffffff;
      --surface-soft: #f5f7fa;
      --text: #303133;
      --regular: #606266;
      --muted: #909399;
      --placeholder: #c0c4cc;
      --line: #ebeef5;
      --control-line: #dcdfe6;
      --sidebar-width: 200px;
      --header-height: 56px;
      --tabs-height: 40px;
      --title-height: 64px;

      --shadow-float: 0 4px 14px rgba(0, 0, 0, 0.12);

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-width: 1180px;
      color: var(--regular);
      background: var(--page);
      font: 14px/1.5 var(--font-ui);
    }
    button, input, select { font: inherit; }
    button, a, select { cursor: pointer; }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible {

      outline-offset: 2px;
    }
    button:disabled { cursor: not-allowed; opacity: .55; }

    .topbar {
      position: fixed;
      z-index: 50;
      inset: 0 0 auto 0;
      height: var(--header-height);
      display: flex;
      color: #fff;
      background: linear-gradient(110deg, #409eff 0%, #65adf5 100%);
    }
    .brand {
      width: var(--sidebar-width);
      display: flex;
      align-items: center;
      padding-left: 48px;
      border-right: 1px solid rgba(255, 255, 255, .72);
      font-size: 23px;
      font-weight: 700;
      letter-spacing: 2px;
      white-space: nowrap;
    }
    .user-area {

      display: flex;
      align-items: center;
      gap: 10px;
      padding-right: 22px;
      font-size: 13px;
    }
    .avatar {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255, 255, 255, .7);
      border-radius: 50%;
      background: #c9ccd1;
    }

    .sidebar {
      position: fixed;
      z-index: 40;
      top: var(--header-height);
      bottom: 0;
      left: 0;
      width: var(--sidebar-width);
      overflow-y: auto;
      background: #fff;
      border-right: 1px solid #e3e7ed;
    }
    .menu-group { border-bottom: 1px solid #f0f2f5; }
    .menu-row {
      min-height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 24px;
      color: #7d8289;
      background: #fff;
      border: 0;
      width: 100%;
      text-align: left;
      transition: color .18s ease, background-color .18s ease;
    }
    .menu-row:hover { color: var(--primary); background: #f7fbff; }
    .menu-row .icon {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      color: #74b5fb;
    }
    .menu-row .label { white-space: nowrap; }
    .menu-row .arrow {
      margin-left: auto;
      color: #7ab8fa;
      font-size: 12px;
      transform: rotate(0);
      transition: transform .18s ease;
    }
    .menu-group.open > .menu-row .arrow { transform: rotate(180deg); }
    .submenu { display: none; padding: 0; background: #f5f7fa; }
    .menu-group.open .submenu { display: block; }
    .submenu button {
      width: 100%;
      min-height: 50px;
      padding: 0 14px 0 40px;
      color: #747980;
      background: transparent;
      border: 0;
      text-align: left;
      transition: color .18s ease, background-color .18s ease;
    }
    .submenu button:hover { color: var(--primary); background: #edf5ff; }
    .submenu button.active {
      color: #656a71;
      background: #dceafb;
    }

    .workspace {
      min-height: 100vh;
      margin-left: var(--sidebar-width);
      padding-top: var(--header-height);
    }
    .tabs-shell {
      height: var(--tabs-height);
      padding: 4px 16px 5px;
      overflow: hidden;
      background: #fff;
      border-bottom: 1px solid #dfe3e9;
      white-space: nowrap;
    }
    .tabs { display: flex; align-items: center; gap: 7px; }
    .tab {
      height: 31px;
      display: inline-flex;
      align-items: center;
      padding: 0 10px;
      color: var(--regular);
      background: #fff;
      border: 1px solid var(--control-line);
      border-radius: 4px;
      font-size: 13px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .03);
      transition: color .18s ease, background-color .18s ease, border-color .18s ease;

    .tab:hover { color: var(--primary); border-color: #9ac7f7; }
    .tab.active { color: #fff; background: var(--primary); border-color: var(--primary); }
    .tab .dot {

      height: 7px;
      margin-right: 7px;

    .tab .x { margin-left: 9px; color: #a8adb3; font-size: 15px; }
    .tab.active .x { color: #d9ecff; }

    .titlebar {
      height: var(--title-height);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 17px 20px 0;
      background: #fff;
      border-bottom: 1px solid #eceff3;
    }
    .titlebar h1 {
      margin: 0;
      color: var(--text);
      font-size: 19px;
      font-weight: 400;
    }
    .page {
      min-height: calc(100vh - var(--header-height) - var(--tabs-height) - var(--title-height));
      padding: 32px 31px;
      background: var(--page);
    }
    .panel {
      min-height: 560px;
      padding: 20px;
      overflow: hidden;
      background: #fff;
      border-radius: var(--radius);
    }

    .filters {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px 28px;
    }
    .filters.two-line { max-width: 1480px; }
    .field {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 34px;
    }
    .field label {
      color: var(--regular);
      white-space: nowrap;
    }
    .control {
      height: 32px;
      padding: 0 11px;
      color: var(--regular);
      background: #fff;
      border: 1px solid var(--control-line);
      border-radius: var(--radius);
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .control:hover { border-color: #c0c4cc; }
    .control:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(64,158,255,.12); }
    input.control { width: 202px; }
    select.control { width: 160px; }
    .control::placeholder { color: var(--placeholder); }
    .range {
      width: 360px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      color: var(--placeholder);

    .range strong { color: var(--regular); font-weight: 400; }

    .btn {
      height: 34px;
      padding: 0 16px;
      color: var(--regular);
      background: #fff;
      border: 1px solid var(--control-line);
      border-radius: var(--radius);
      font-weight: 500;
      transition: color .18s ease, background-color .18s ease, border-color .18s ease;
    }
    .btn:hover { color: var(--primary); border-color: #9ac7f7; background: #ecf5ff; }
    .btn.primary { color: #fff; background: var(--primary); border-color: var(--primary); }
    .btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    .btn.danger { color: #fff; background: var(--danger); border-color: var(--danger); }
    .btn.danger:hover { background: #f78989; border-color: #f78989; }
    .btn.warning { color: #fff; background: var(--warning); border-color: var(--warning); }
    .btn.warning:hover { background: #ebb563; border-color: #ebb563; }
    .btn.success { color: #fff; background: var(--success); border-color: var(--success); }
    .btn.small { height: 28px; padding: 0 11px; font-size: 13px; }
    .button-row { display: flex; gap: 12px; align-items: center; }

    .summary {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px 28px;
      margin-top: 35px;
      color: var(--regular);
    }
    .summary strong { margin-left: 5px; font-weight: 600; }
    .red { color: var(--danger); }
    .green { color: var(--success); }
    .blue { color: var(--primary); }
    .warning-text { color: var(--warning); }
    .action-line { margin-top: 25px; }

    .stats-ribbon {
      min-height: 46px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      margin-top: 24px;
      padding: 0 24px;
      background: #eef3fb;
      border-radius: 12px;
      color: var(--text);
      text-align: center;
      font-size: 15px;
    }
    .stats-ribbon strong { margin-left: 6px; font-size: 18px; font-weight: 500; }

    .recharge-states {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 14px;
      margin: 20px 0 14px;
    }
    .recharge-state {
      min-height: 86px;
      padding: 16px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 2px 8px rgba(35, 62, 96, .035);
    }
    .recharge-state span { display: block; color: var(--regular); }
    .recharge-state strong {
      display: block;
      margin-top: 4px;
      color: var(--primary);
      font-size: 25px;
      font-weight: 500;
    }
    .recharge-state.review strong { color: var(--warning); }
    .recharge-state.done strong { color: var(--success); }
    .recharge-summary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      min-height: 48px;
      margin-bottom: 14px;
      padding: 9px 14px;
      background: #fff;
      border: 1px solid var(--line);
    }
    .recharge-metric {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding-right: 18px;
      margin: 2px 18px 2px 0;
      border-right: 1px solid var(--line);
      white-space: nowrap;
    }
    .recharge-metric:last-child { padding-right: 0; margin-right: 0; border-right: 0; }
    .recharge-metric strong { font-size: 15px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .recharge-empty { height: 120px; color: var(--muted); text-align: center; }

    .subtabs {
      display: flex;
      gap: 36px;
      height: 40px;
      align-items: flex-start;
      border-bottom: 1px solid var(--control-line);
    }
    .subtab {
      position: relative;
      height: 40px;
      padding: 6px 0 0;
      color: var(--text);
      background: transparent;
      border: 0;
      font-weight: 600;
    }
    .subtab.active { color: var(--primary); }
    .subtab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background: var(--primary);
    }

    .table-wrap {
      position: relative;
      margin-top: 30px;
      overflow-x: auto;
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
      scrollbar-color: #c7ccd3 #f3f4f6;
      scrollbar-width: thin;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      color: var(--regular);
      font-size: 13px;
    }
    th, td {
      height: 62px;
      padding: 9px 12px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }
    th {
      height: 40px;
      color: var(--muted);
      background: #fff;
      font-weight: 600;
    }
    tbody tr:nth-child(even) { background: #fcfcfd; }
    tbody tr:hover { background: #f5faff; }
    .cell-center { text-align: center; }
    .wrap { white-space: normal; line-height: 1.55; }
    .ellipsis {
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 9px;
      border-radius: 12px;
      color: var(--regular);
      background: #f1f3f5;
    }
    .tag.success { color: #529b2e; background: #f0f9eb; }
    .tag.warning { color: #b88230; background: #fdf6ec; }
    .tag.danger { color: #c45656; background: #fef0f0; }
    .link {
      color: var(--primary);
      background: transparent;
      border: 0;
      padding: 0;
      text-decoration: none;
    }
    .link:hover { color: var(--primary-hover); }
    .link + .link { margin-left: 10px; }
    .op-links { white-space: normal; line-height: 25px; }
    .op-links .link { display: inline-block; margin: 0 10px 0 0; }
    .switch-line { display: flex; align-items: center; gap: 8px; }
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex: 0 0 auto;
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: #dcdfe6;
      transition: background-color .18s ease;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
      transition: transform .18s ease;
    }
    .switch.on { background: var(--primary); }
    .switch.on::after { transform: translateX(18px); }

    .pagination {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      color: var(--regular);
    }
    .page-button {
      min-width: 28px;
      height: 28px;
      color: var(--regular);
      background: #fff;
      border: 0;
      border-radius: 4px;
    }
    .page-button:hover, .page-button.current { color: var(--primary); }
    .page-button.current { font-weight: 600; background: #ecf5ff; }

    .modal-layer {
      position: fixed;
      z-index: 200;
      inset: 0;
      display: grid;
      place-items: start center;
      padding: 70px 24px 24px;
      background: rgba(0, 0, 0, .48);
    }
    .merchant-modal {
      width: min(1040px, calc(100vw - 48px));
      height: min(760px, calc(100vh - 94px));
      max-height: calc(100vh - 94px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .24);
    }
    .modal-header {
      flex: 0 0 auto;
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .modal-header-copy { min-width: 0; }
    .modal-header h2 { margin: 0; color: var(--text); font-size: 18px; font-weight: 500; }
    .modal-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .modal-close {
      width: 34px;
      height: 34px;
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 22px;
      line-height: 1;
    }
    .modal-close:hover { color: var(--primary); }
    .modal-body {
      min-height: 0;
      flex: 1;
      padding: 0;
      overflow: hidden;
      background: #fff;
    }
    .merchant-config-shell {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-columns: 198px minmax(0, 1fr);
    }
    .merchant-config-nav {
      min-height: 0;
      padding: 18px 12px;
      overflow-y: auto;
      background: #f7f9fc;
      border-right: 1px solid #e7ebf2;
    }
    .config-nav-label {
      padding: 0 10px 9px;
      color: #a0a7b4;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
    }
    .config-nav-label.grouped {
      margin: 12px 10px 7px;
      padding: 12px 0 0;
      border-top: 1px solid #e7ebf2;
    }
    .config-nav-button {
      position: relative;
      width: 100%;
      min-height: 54px;
      display: grid;
      gap: 3px;
      align-content: center;
      padding: 9px 12px 9px 15px;
      margin-bottom: 4px;
      color: #5f6875;
      background: transparent;
      border: 0;
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
      transition: color .2s ease, background-color .2s ease;
    }
    .config-nav-button::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 3px;
      background: transparent;
      border-radius: 0 3px 3px 0;
    }
    .config-nav-button:hover { color: var(--primary); background: #f0f6ff; }
    .config-nav-button:focus-visible {
      outline: 2px solid rgba(64, 158, 255, .4);
      outline-offset: 1px;
    }
    .config-nav-button.active {
      color: #2f7fd4;
      background: #eaf4ff;
    }
    .config-nav-button.active::before { background: var(--primary); }
    .config-nav-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: inherit;
      font-size: 14px;
      font-weight: 500;
    }
    .config-nav-subtitle {
      color: #9aa2ae;
      font-size: 11px;
      font-weight: 400;
    }
    .config-nav-button.active .config-nav-subtitle { color: #6f9dca; }
    .config-nav-badge {
      min-width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      color: #2f7fd4;
      background: #fff;
      border: 1px solid #cfe7ff;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }
    .merchant-config-content {
      min-width: 0;
      min-height: 0;
      padding: 22px 24px 28px;
      overflow-y: auto;
      background: #fff;
      scroll-behavior: smooth;
    }
    .config-panel[hidden] { display: none; }
    .config-panel-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 16px;
      margin-bottom: 18px;
      border-bottom: 1px solid #edf0f5;
    }
    .config-panel-header h3 {
      margin: 0;
      color: var(--text);
      font-size: 18px;
      font-weight: 600;
    }
    .config-panel-header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }
    .config-panel-status {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 0 10px;
      color: #337ecc;
      background: #ecf5ff;
      border: 1px solid #d9ecff;
      border-radius: 13px;
      font-size: 12px;
    }
    .config-card {
      margin: 0;
      padding: 18px;
      background: #fbfcfe;
      border: 1px solid #e8edf3;
      border-radius: 8px;
    }
    .config-card .modal-basic-grid { margin-bottom: 0; }
    .config-card .config-row:first-child { margin-top: 0; }
    .modal-basic-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 22px;
      margin-bottom: 18px;
    }
    .modal-field {
      display: grid;
      grid-template-columns: 108px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
    }
    .modal-field.full { grid-column: 1 / -1; }
    .modal-field label { color: var(--regular); text-align: right; }
    .modal-field .required::before { content: "*"; margin-right: 4px; color: var(--danger); }
    .modal-control {
      width: 100%;
      min-height: 32px;
      padding: 6px 10px;
      color: var(--regular);
      background: #fff;
      border: 1px solid var(--control-line);
      border-radius: var(--radius);
    }
    textarea.modal-control { min-height: 62px; resize: vertical; }
    .modal-control:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(64, 158, 255, .12); outline: 0; }
    .modal-control:disabled { color: var(--muted); background: #f5f7fa; cursor: not-allowed; }
    .modal-section {
      margin-top: 12px;
      padding: 14px 16px 16px;
      background: #f7f8fa;
      border: 1px solid #eef0f3;
      border-radius: 6px;
    }
    .config-panel > .modal-section {
      margin-top: 0;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
    }
    .config-panel > .modal-section > .modal-section-head {
      padding: 0 0 12px;
      margin-bottom: 12px;
    }
    .modal-section-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 11px;
      margin-bottom: 12px;
      border-bottom: 1px solid #e4e7ed;
    }
    .modal-section-head strong { color: var(--text); font-size: 15px; }
    .config-row {
      display: grid;
      grid-template-columns: 155px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      margin-top: 13px;
    }

      function selectedOrders() {
        const order = get("rechargeOrder").value.trim().toLowerCase();

      function renderRechargeOrders() {
        const list = selectedOrders();
        const byStatus = (status) => list.filter((item) => item.status === status);
        const sum = (items) => items.reduce((total, item) => total + item.amount, 0);
        const success = byStatus("done");
        const failed = list.filter((item) => ["expired", "closed", "rejected"].includes(item.status));
        const processing = list.filter((item) => ["processing", "review"].includes(item.status));
        get("rechargeAll").textContent = list.length;
        get("rechargeProcessing").textContent = byStatus("processing").length;
        get("rechargeReview").textContent = byStatus("review").length;
        get("rechargeDone").textContent = success.length;

        get("rechargeFailedAmount").textContent = money(sum(failed));
        get("rechargeSuccessCount").textContent = success.length;
        get("rechargeFailedCount").textContent = failed.length;
        get("rechargeSuccessRate").textContent = (success.length + failed.length ? success.length / (success.length + failed.length) * 100 : 0).toFixed(2) + "%";

    function saveTierRule() {
      const editor = document.getElementById("tierRuleEditor");
      const error = document.getElementById("tierRuleError");
      if (!editor || !error) return;
      const start = Number(document.getElementById("tierStartAmount").value);
      const groupId = document.getElementById("tierGroupId").value.trim();
      const people = [...new Set(document.getElementById("tierPeople").value.split(/[\s,，;；]+/).map((item) => item.trim()).filter(Boolean))];
      const required = Number(document.getElementById("tierRequiredCount").value);
      const index = Number(editor.dataset.editIndex);
      let message = "";
      if (!Number.isFinite(start) || start < 0) message = "请输入正确的起始金额";
      else if (tierRules.some((rule, ruleIndex) => ruleIndex !== index && rule.start === start)) message = "起始金额不能与已有阶梯相同";
      else if (index >= 0 && tierRules[index].start === 0 && start !== 0) message = "第一阶起始金额必须为 0";
      else if (!groupId) message = "请输入 TG 群 ID";
      else if (!Number.isInteger(required) || required < 1) message = "需确认人数必须为正整数";
      else if (people.length < required) message = "确认人员数量不能少于需确认人数";
      if (message) {
        error.textContent = message;
        error.hidden = false;
        return;
      }
      const rule = {
        start,
        groupId,
        people,
        required
      };
      if (index >= 0) tierRules[index] = rule;
      else tierRules.push(rule);
      tierRules.sort((a, b) => a.start - b.start);
      renderTierRuleRows();
      closeTierRuleEditor();
      showToast(index >= 0 ? "金额区间配置已更新（演示）" : "金额区间配置已新增（演示）");
    }

    function setMerchantConfigPanel(key) {
      const root = document.getElementById("merchantModalRoot");
      const content = root.querySelector("#merchantConfigContent");
      root.querySelectorAll("[data-modal-section-target]").forEach((button) => {
        const selected = button.dataset.modalSectionTarget === key;
        button.classList.toggle("active", selected);
        button.setAttribute("aria-selected", String(selected));
      });
      root.querySelectorAll("[data-modal-section-panel]").forEach((panel) => {
        panel.hidden = panel.dataset.modalSectionPanel !== key;
      });
      if (key !== "payout-confirm") closeTierRuleEditor();
      if (content) content.scrollTop = 0;
    }

    }

    function walletOptionsHtml(selectedWallet) {

    function targetMerchantOptions(sourceNo, selectedNo) {
      const targets = transferRelations[sourceNo] || [];

      return targets.map((merchantNo) => `<option value="${merchantNo}" ${merchantNo === selectedNo ? "selected" : ""}>${merchantLabel(merchantNo)}</option>`).join("");
    }

      root.querySelector(".merchant-modal").focus();

    function refreshTransferModal(root) {
      const sourceNo = root.querySelector("[data-transfer-source]").value;
      const targetSelect = root.querySelector("[data-transfer-target]");
      const previousTarget = targetSelect.value;
      targetSelect.innerHTML = targetMerchantOptions(sourceNo, previousTarget);
      const targetNo = targetSelect.value;
      const sourceWallet = root.querySelector("[data-transfer-source-wallet]").value;
      const targetWallet = root.querySelector("[data-transfer-target-wallet]").value;
      root.querySelector("[data-transfer-source-name]").textContent = merchantLabel(sourceNo);
      root.querySelector("[data-transfer-target-name]").textContent = merchantLabel(targetNo);
      root.querySelector("[data-transfer-source-wallet-name]").textContent = walletLabel(sourceWallet);
      root.querySelector("[data-transfer-target-wallet-name]").textContent = walletLabel(targetWallet);
      root.querySelector("[data-transfer-review-info]").textContent = transferReviewInfo(sourceNo);
    }

    function closeTransferModal() {
      document.getElementById("transferModalRoot").innerHTML = "";
      document.body.style.overflow = "";
    }

    function submitTransferOrder() {
      const root = document.getElementById("transferModalRoot");
      const sourceNo = root.querySelector("[data-transfer-source]").value;
      const targetNo = root.querySelector("[data-transfer-target]").value;
      const sourceWallet = root.querySelector("[data-transfer-source-wallet]").value;
      const targetWallet = root.querySelector("[data-transfer-target-wallet]").value;
      const amount = Number(root.querySelector("[data-transfer-amount]").value);
      const error = root.querySelector("[data-transfer-error]");
      const allowedTargets = transferRelations[sourceNo] || [];
      const config = transferReviewConfigs[sourceNo];
      const sharedBot = withdrawConfirmConfigs[sourceNo]?.bot;
      const fail = (message) => { error.hidden = false; error.textContent = message; };
      if (!allowedTargets.includes(targetNo)) return fail("目标商户不在被划出商户的可互转配置中。");
      if (!sharedBot || !config || !config.group || !config.reviewers.length || !config.required) return fail("请先完整配置被划出商户的下分确认机器人，以及资金划转审核群、确认人和确认人数。");
      if (!Number.isFinite(amount) || amount <= 0) return fail("请输入大于 0 的划转金额。");
      if (amount > walletBalance(sourceNo, sourceWallet)) return fail(`划转金额不能超过该商户的模拟${walletLabel(sourceWallet)}。`);
      transferOrders.unshift({ no: `TRF-DEMO-${String(transferSequence++).padStart(4, "0")}`, sourceNo, targetNo, sourceWallet, targetWallet, amount: amount.toFixed(6), bot: sharedBot, group: config.group, reviewers: config.reviewers, required: config.required, created: "2026-08-05 12:00:00" });
      closeTransferModal();
      navigateTo("withdraw");
      showToast("资金划转订单已提交，等待审核群多人确认（演示）。");
    }

      transferReviewConfigs[merchantNo] = { ...current, group: section.querySelector("[data-transfer-group]").value.trim(), required: Number(section.querySelector("[data-transfer-required]").value) || current.required };

        ${field("提交时间", '<div class="control range" style="width:280px"><span>◷　开始时间</span><strong>-</strong><span>结束时间</span></div>')}

      </div>
      <div class="table-wrap"><table style="min-width:2600px">
        <colgroup><col style="width:45px"><col style="width:60px"><col style="width:150px"><col style="width:100px"><col style="width:170px"><col style="width:90px"><col style="width:85px"><col style="width:90px"><col style="width:75px"><col style="width:210px"><col style="width:90px"><col style="width:210px"><col style="width:100px"><col style="width:105px"><col style="width:85px"><col style="width:190px"><col style="width:120px"><col style="width:145px"><col style="width:145px"><col style="width:100px"><col style="width:150px"><col style="width:100px"><col style="width:150px"></colgroup>
        <thead><tr><th></th><th>序号</th><th>单号</th><th>下分单类型</th><th>商户名称/商户号</th><th>提现金额</th><th>手续费</th><th>到账金额</th><th>币种</th><th>收款钱包地址</th><th>协议类型</th><th>付款地址</th><th>状态</th><th>TG确认状态</th><th>确认人数</th><th>确认人</th><th>备注</th><th>提交时间</th><th>操作时间</th><th>操作人</th><th>操作备注</th><th>审核图片</th><th>操作</th></tr></thead>
        <tbody>${rows}</tbody></table></div>${pagination(229)}`;
    }

    function payoutPage() {
      const rows = merchants.map((m, i) => `<tr>
        <td class="cell-center"><input type="checkbox" aria-label="选择${m[0]}"></td><td>${m[0]}</td><td>${m[1]}</td><td>${i ? "—" : "示例代理"}</td><td>0</td>
        <td>${switchControl(true, "正常")}</td><td>${switchControl(true, "开启")}</td><td>${switchControl(false, "禁用")}</td>
        <td>${i === 4 ? "1" : "0"}　${mockLink("编辑")}</td><td>0</td><td>${m[2]}　${mockLink("调额")}</td><td>${m[3]}</td><td>${m[3]}　${mockLink("调额")}</td>
        <td>${i === 3 ? "20" : "0"}</td><td>${m[2]}　${mockLink("调额")}</td><td><span class="balance-action">${m[3]} ${transferLink("payout", i)}</span></td><td>${m[3]}　${mockLink("调额")}</td>
        <td>0</td><td>0</td><td>${i === 3 ? "122.00" : "0.00"}　${mockLink("资金调整")}</td><td>${i === 3 ? "28.00" : "0.00"}</td>
        <td class="op-links">${["IP白名单","绑定代付通道","设置代付费率","对接信息","单独清算","USDT下单测试"].map(mockLink).join("")}</td>
      </tr>`).join("");
      return `<div class="filters">
        ${field("商户号", input("请输入商户号"))}${field("商户名称", input("请输入商户名称"))}
        ${button("查询","primary")}${button("一键清算商户","warning")}
      </div>
      <div class="summary"><span>代付商户数量：<strong class="green">96</strong></span><span>冻结额度：<strong class="red">0</strong></span>
        <span>总余额：<strong class="green">1215.6</strong></span><span>剩余预付：<strong class="red">4484.4</strong></span><span>总预付：<strong class="green">5700</strong></span></div>
      <div class="action-line">${button("一键编辑费率","danger")}</div>
      <div class="table-wrap"><table style="min-width:2650px">
        <colgroup><col style="width:48px"><col style="width:120px"><col style="width:125px"><col style="width:110px"><col style="width:110px"><col style="width:110px"><col style="width:110px"><col style="width:130px"><col style="width:110px"><col style="width:100px"><col style="width:125px"><col style="width:135px"><col style="width:135px"><col style="width:120px"><col style="width:130px"><col style="width:145px"><col style="width:145px"><col style="width:145px"><col style="width:145px"><col style="width:175px"><col style="width:175px"><col style="width:380px"></colgroup>
        <thead><tr><th></th><th>商户名称</th><th>商户号</th><th>代理</th><th>代理利润</th><th>代付功能</th><th>手动下单</th><th>通道驳回通知</th><th>单笔费用</th><th>冻结额度</th><th>代付额度</th><th>代付剩余预付</th><th>代付总预付</th><th>USDT冻结额度</th><th>USDT代付额度</th><th>USDT代付剩余预付</th><th>USDT代付总预付</th><th>USDT今日代付预付</th><th>USDT今日代付额度</th><th>USDT代付手续费可用余额</th><th>USDT代付手续费冻结余额</th><th>操作</th></tr></thead>
        <tbody>${rows}</tbody></table></div>${pagination(96)}`;
    }

    function collectPage() {
      const rows = merchants.map((m, i) => `<tr>
        <td class="cell-center"><input type="checkbox" aria-label="选择${m[0]}"></td><td>${m[0]}</td><td>0</td><td>${i === 3 ? "30.01" : "0"}</td>
        <td>${i === 4 ? "11205.00" : i === 2 ? "19.00" : "0.00"}　${mockLink("调整")} ${mockLink("下发")}</td>
        <td>${i === 4 ? "30000.00" : i === 2 ? "30.00" : "0.00"}　${mockLink("调整")}</td>
        <td>${i === 4 ? "18795.00" : i === 2 ? "11.00" : "0.00"}　${mockLink("结算")}</td>
        <td><span class="balance-action">${m[2]}　${mockLink("调整")} ${mockLink("下发")} ${transferLink("collect", i)}</span></td><td>${m[3]}　${mockLink("调整")}</td>
        <td>${i === 3 ? "-70.00" : "0.00"}　${mockLink("结算")}</td><td>${switchControl(true)}</td>
        <td class="op-links">${button("代收产品","primary small")}${button("测试下单","success small")}${button("对接","warning small")}</td>
      </tr>`).join("");
      return `<div class="filters">
        ${field("商户号", input("请输入商户号"))}${field("商户名称", input("请输入商户名称"))}
        ${field("账户状态", select("请选择", 150))}${field("所属代理", select("直接输入或选择代理", 200))}
        ${button("查询","primary")}${button("重置")}${button("导出","primary")}
      </div>
      <div class="summary"><span>商户数量：<strong class="red">10</strong></span><span>总余额：<strong class="red">11234.00元</strong></span>
        <span>剩余预付：<strong class="red">27845.00元</strong></span><span>总代收交易笔数：<strong class="red">0</strong></span></div>
      <div class="button-row action-line">${button("全部开启","warning")}${button("全部关闭","danger")}${button("一键结算人民币余额","warning")}${button("一键结算USDT余额","warning")}</div>
      <div class="table-wrap"><table style="min-width:1680px">
        <colgroup><col style="width:48px"><col style="width:130px"><col style="width:120px"><col style="width:140px"><col style="width:170px"><col style="width:135px"><col style="width:145px"><col style="width:170px"><col style="width:150px"><col style="width:155px"><col style="width:110px"><col style="width:240px"></colgroup>
        <thead><tr><th></th><th>商户名称</th><th>今日成交</th><th>USDT累计跑量</th><th>代收账户余额</th><th>预付</th><th>剩余预付</th><th>USDT余额</th><th>USDT预付</th><th>USDT剩余预付</th><th>代收状态</th><th>操作</th></tr></thead>
        <tbody>${rows}</tbody></table></div>${pagination(96)}`;
    }

    function renderPage() {
      const meta = pageMeta[currentPage];
      document.title = `蓝盛支付 - ${meta.title}`;
      document.getElementById("pageTitle").textContent = meta.heading || meta.title;
      document.getElementById("titleActions").innerHTML = currentPage === "payout" ? button("关闭进单", "danger") : "";
      const renderers = { merchant: merchantPage, withdraw: withdrawPage, recharge: rechargePage, payout: payoutPage, collect: collectPage };
      document.getElementById("pagePanel").innerHTML = renderers[currentPage]();
      renderSidebar();
      renderTabs();
      if (currentPage === "recharge") setupRechargePage();
      location.hash = currentPage;
    }

    function navigateTo(page) {
      if (!page || !pageMeta[page] || page === "address") {
        showToast(page === "address" ? "地址查询仅保留页签，本页面聚焦四个目标页面" : "此菜单仅用于还原现状导航");
        return;
      }
      currentPage = page;
      renderPage();
      document.querySelector(".page").scrollTop = 0;
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    document.addEventListener("click", (event) => {
      const target = event.target.closest("button");
      if (!target) return;
      if (target.dataset.transferOpen !== undefined) {
        renderTransferModal(target.dataset.transferOpen, Number(target.dataset.transferIndex));
        return;
      }
      if (target.dataset.transferClose !== undefined) {
        closeTransferModal();
        return;
      }
      if (target.dataset.transferSubmit !== undefined) {
        submitTransferOrder();
        return;
      }
      if (target.dataset.editIndex !== undefined) {
        openMerchantModal(Number(target.dataset.editIndex));
        return;
      }
      if (target.dataset.transferConfigIndex !== undefined) {
        openMerchantModal(Number(target.dataset.transferConfigIndex), true);
        return;
      }
      if (target.dataset.transferAddRelation !== undefined) {
        const section = target.closest("[data-transfer-config]");
        const sourceNo = section.dataset.transferConfig;
        const targetNo = section.querySelector("[data-transfer-relation-select]").value;
        if (!targetNo) return showToast("请先选择可互转商户。");
        transferRelations[sourceNo] = transferRelations[sourceNo] || [];
        transferRelations[targetNo] = transferRelations[targetNo] || [];
        if (!transferRelations[sourceNo].includes(targetNo)) transferRelations[sourceNo].push(targetNo);
        if (!transferRelations[targetNo].includes(sourceNo)) transferRelations[targetNo].push(sourceNo);
        refreshRelationTags(section);
        showToast("已更新可互转商户关系（演示）。");
        return;
      }
      if (target.dataset.transferRemoveRelation !== undefined) {
        const section = target.closest("[data-transfer-config]");
        const sourceNo = section.dataset.transferConfig;
        const targetNo = target.dataset.transferRemoveRelation;
        transferRelations[sourceNo] = (transferRelations[sourceNo] || []).filter((item) => item !== targetNo);
        transferRelations[targetNo] = (transferRelations[targetNo] || []).filter((item) => item !== sourceNo);
        refreshRelationTags(section);
        showToast("已移除可互转商户关系（演示）。");
        return;
      }
      if (target.dataset.transferAddReviewer !== undefined) {
        const section = target.closest("[data-transfer-config]");
        const sourceNo = section.dataset.transferConfig;
        const input = section.querySelector("[data-transfer-reviewer-input]");
        const reviewer = input.value.trim();
        if (!reviewer) return showToast("请输入有效确认人。");
        transferReviewConfigs[sourceNo] = transferReviewConfigs[sourceNo] || { group: "", reviewers: [], required: 2 };
        if (!transferReviewConfigs[sourceNo].reviewers.includes(reviewer)) transferReviewConfigs[sourceNo].reviewers.push(reviewer);
        input.value = "";
        refreshReviewerTags(section);
        showToast("已添加有效确认人（演示）。");
        return;
      }
      if (target.dataset.transferRemoveReviewer !== undefined) {
        const section = target.closest("[data-transfer-config]");
        const sourceNo = section.dataset.transferConfig;
        transferReviewConfigs[sourceNo].reviewers = transferReviewConfigs[sourceNo].reviewers.filter((item) => item !== target.dataset.transferRemoveReviewer);
        refreshReviewerTags(section);
        showToast("已移除有效确认人（演示）。");
        return;
      }
      if (target.dataset.modalClose !== undefined) {
        closeMerchantModal();
        return;
      }
      if (target.dataset.modalSubmit !== undefined) {
        saveWithdrawConfirmConfig(document.getElementById("merchantModalRoot"));
        saveTransferConfig(document.getElementById("merchantModalRoot"));
        closeMerchantModal();
        showToast("商户与资金划转配置已保存（演示）");
        return;
      }
      const modalSectionTarget = target.dataset.modalSectionTarget;
      if (modalSectionTarget) {
        setMerchantConfigPanel(modalSectionTarget);
        return;
      }
      const tierAction = target.dataset.tierAction;
      if (tierAction) {
        const index = Number(target.dataset.tierIndex);
        if (tierAction === "add") openTierRuleEditor();
        if (tierAction === "edit") openTierRuleEditor(index);
        if (tierAction === "cancel") closeTierRuleEditor();
        if (tierAction === "save") saveTierRule();
        if (tierAction === "delete" && Number.isInteger(index)) {
          if (tierRules[index] && tierRules[index].start === 0) {
            showToast("第一阶起始金额为 0，不能删除");
          } else {
            tierRules.splice(index, 1);
            renderTierRuleRows();
            closeTierRuleEditor();
            showToast("金额阶梯配置已删除（演示）");
          }
        }
        return;
      }
      const configToggle = target.dataset.configToggle;
      if (configToggle) {
        const enabled = !target.classList.contains("on");
        target.classList.toggle("on", enabled);
        target.setAttribute("aria-checked", String(enabled));
        setConfigSectionState(configToggle, enabled);
        return;
      }
      const page = target.dataset.page;
      if (page !== undefined && page !== "") { navigateTo(page); return; }
      const group = target.dataset.group;
      if (group && group.endsWith("-group")) {
        target.closest(".menu-group").classList.toggle("open");
        return;
      }
      if (target.classList.contains("switch")) {
        target.classList.toggle("on");
        showToast("已切换模拟状态，不影响真实后台");
        return;
      }
      const action = target.dataset.action;
      if (action) showToast(`现状页面：${action} 不执行真实业务操作`);
    });
    document.addEventListener("change", (event) => {
      if (event.target.matches("[data-transfer-source], [data-transfer-target], [data-transfer-source-wallet], [data-transfer-target-wallet]")) refreshTransferModal(document.getElementById("transferModalRoot"));
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && document.getElementById("transferModalRoot").innerHTML) {
        closeTransferModal();
        return;
      }
      if (event.key !== "Escape" || !document.getElementById("merchantModalRoot").innerHTML) return;
      const editor = document.getElementById("tierRuleEditor");
      if (editor && !editor.hidden) closeTierRuleEditor();
      else closeMerchantModal();
    });

    const hashPage = location.hash.replace("#", "");
    if (["merchant", "withdraw", "recharge", "payout", "collect"].includes(hashPage)) currentPage = hashPage;
    renderPage();
  </script>
</body>
</html>
