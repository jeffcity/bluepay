  <style>
    :root {

      align-items: center;

    .withdraw-auto-refresh-label { color: var(--regular); }
    .withdraw-auto-refresh-help {
      position: relative;

      border-radius: 50%;

      font-weight: 600;

    .withdraw-auto-refresh-help::before,
    .withdraw-auto-refresh-help::after {

      transform: translate(-50%, 4px);

    .withdraw-auto-refresh-help::after {
      content: attr(data-tooltip);
      bottom: calc(100% + 13px);
      width: max-content;
      max-width: 240px;
      padding: 8px 10px;
      color: #fff;
      background: #303133;
      border-radius: 4px;
      box-shadow: var(--shadow-float);

      line-height: 1.5;

    .withdraw-auto-refresh-help:hover::before,
    .withdraw-auto-refresh-help:hover::after,
    .withdraw-auto-refresh-help:focus-visible::before,
    .withdraw-auto-refresh-help:focus-visible::after {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);

    .withdraw-auto-refresh-status { min-width: 136px; color: var(--muted); font-size: 12px; }

    .field {
      display: inline-flex;

    .subtabs {

    .toast {

      padding: 10px 16px;

      .menu-row { justify-content: center; padding: 0; }

      .config-nav-button { padding-left: 13px; }

    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }

  <script>

// PAYOUT_CHANNEL_MODEL_START
const PAYOUT_CHANNEL_STORAGE_KEY = 'bluepay.payout-channel-demo.v1';
const PAYOUT_CHANNEL_PRODUCTS = {
  'DEMO-CRYPTO': '【DEMO-CRYPTO】虚拟币代付演示产品',
  'DEMO-BANK': '【DEMO-BANK】银行卡代付演示产品',
  'DEMO-CNY': '【DEMO-CNY】人民币代付演示产品',
};
function payoutChannelSeed() {
  const providers=['新万能通道商','远航演示通道商','北辰演示通道商'];
  const channels=Array.from({length:41},(_,i)=>({id:'PC-DEMO-'+String(i+1).padStart(3,'0'),name:i===0?'新万能下分演示通道':i===1?'远航下分演示通道':i===2?'北辰停用下分演示通道':'普通代付演示通道 '+String(i-2).padStart(2,'0'),category:i<3?'下分':'普通',productType:i<3||i%3===0?'DEMO-CRYPTO':i%3===1?'DEMO-BANK':'DEMO-CNY',provider:providers[i%3],interface:i<3||i%3===0?'USDT':'chpay',code:'DEMO-CHANNEL-'+String(i+1).padStart(3,'0'),enabled:i!==2,tg:false,balance:0,usdtBalance:0,limited:false,successRate:'0%',weight:i===3?8:1,rate:0,singleFee:0,agentProfit:0,agentName:'—',acceptCallback:true,callbackTime:0,group:''}));
  return {version:1,nextId:42,channels};
}
function readPayoutChannelState() {
  try {
    if(typeof localStorage==='undefined')return payoutChannelSeed();
    const raw=localStorage.getItem(PAYOUT_CHANNEL_STORAGE_KEY);
    if(!raw)return payoutChannelSeed();
    const state=JSON.parse(raw);
    if(state.version!==1||!Array.isArray(state.channels)||!Number.isInteger(state.nextId)||state.nextId<1||new Set(state.channels.map(c=>c.id)).size!==state.channels.length||state.channels.some(c=>!c.id||!c.name||!['普通','下分'].includes(c.category)||typeof c.enabled!=='boolean'))return payoutChannelSeed();
    return state;
  }catch{return payoutChannelSeed()}
}
function savePayoutChannelState(state) {
  try {localStorage.setItem(PAYOUT_CHANNEL_STORAGE_KEY,JSON.stringify(state))}
  catch {throw new Error('通道资料保存失败，请检查浏览器存储后重试')}
}
function eligiblePayoutChannels(state) {return state.channels.filter(c=>c.category==='下分'&&c.enabled)}
function filterPayoutChannels(state,q={}) {const needle=String(q.keyword||'').trim().toLowerCase();return state.channels.filter(c=>(!needle||[c.name,c.code,c.id].some(v=>String(v).toLowerCase().includes(needle)))&&(!q.productType||c.productType===q.productType)&&(!q.category||c.category===q.category)&&(!q.provider||c.provider===q.provider)&&(q.enabled===''||q.enabled==null||c.enabled===(q.enabled==='true'||q.enabled===true)))}
function payoutChannelFields(input) {
  const data={name:String(input.name||'').trim(),interface:input.interface,provider:input.provider,category:input.category,weight:Number(input.weight),group:String(input.group||'').trim(),enabled:input.enabled};
  if(!['chpay','USDT'].includes(data.interface))throw new Error('请选择接口类型');
  if(!data.provider)throw new Error('请选择通道商');
  if(!['普通','下分'].includes(data.category))throw new Error('请选择通道类型');
  data.productType = validatePayoutChannelProduct(input.productType, data.category);
  if(!data.name)throw new Error('请输入通道名称');
  if(!Number.isInteger(data.weight)||data.weight<1||data.weight>9)throw new Error('权重须为1至9的整数');
  if(typeof data.enabled!=='boolean')throw new Error('请选择状态');
  return data;
}
function payoutChannelProductRequired(category) {
  return category !== '下分';
}
function validatePayoutChannelProduct(value, category) {
  const productType = String(value ?? '').trim();
  if (!productType && !payoutChannelProductRequired(category)) return '';
  if (!Object.hasOwn(PAYOUT_CHANNEL_PRODUCTS, productType)) throw new Error('请选择代付类型');
  return productType;
}
function setPayoutChannelProduct(state, id, productType) {
  const channel = state.channels.find(c => c.id === id);
  if (!channel) throw new Error('通道已不存在，请刷新列表');
  channel.productType = validatePayoutChannelProduct(productType, channel.category);
}
function savePayoutChannel(state, id, input) {
  if (id) {
    const channel = state.channels.find(c => c.id === id);
    if (!channel) throw new Error('通道已不存在，请刷新列表');
    if (input.category !== undefined && input.category !== channel.category) {
      throw new Error('通道类型创建后不可修改');
    }
    const fields = payoutChannelFields({ ...input, category: channel.category });
    Object.assign(channel, fields);
    return channel;
  }

  const fields = payoutChannelFields(input);
  const channel = {
    ...payoutChannelSeed().channels[0], ...fields,
    id: 'PC-DEMO-' + String(state.nextId).padStart(3,'0'),
    code: '—', balance: 0, usdtBalance: 0,
  };
  state.nextId++;
  state.channels.unshift(channel);
  return channel;
}
// PAYOUT_CHANNEL_MODEL_END

// WITHDRAW_ORDER_INFO_START
function withdrawOrderInfoHtml(order) {
  const esc=value=>String(value??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=value=>value==null?'—':Number(value).toFixed(2);
  const pair=(label,value)=>`<td class="manual-withdraw-label">${label}</td><td class="manual-withdraw-value">${esc(value)}</td>`;
  return `<section class="manual-withdraw-section"><h4 class="manual-withdraw-title"><span class="manual-withdraw-risk-icon" aria-hidden="true">!</span>收款地址风险</h4><div class="manual-withdraw-risk">查询失败</div></section>
    <section class="manual-withdraw-section" aria-label="订单信息"><h4 class="manual-withdraw-title">订单信息</h4><table class="manual-withdraw-table"><tbody>
    <tr>${pair('单号',order.id)+pair('提交时间',order.created)}</tr>
    <tr>${pair('商户名称/商户号',order.merchant)+pair('操作时间',order.operated)}</tr>
    <tr>${pair('提现金额',money(order.amount))+pair('操作人',order.operator)}</tr>
    <tr>${pair('手续费',money(order.fee))}<td class="manual-withdraw-label">状态</td><td class="manual-withdraw-value pending">${esc(order.status)}</td></tr>
    <tr>${pair('到账金额',money(order.net))+pair('币种',order.currency)}</tr>
    <tr>${pair('协议类型',order.protocol)}<td class="manual-withdraw-label"></td><td class="manual-withdraw-value"></td></tr>
    <tr><td class="manual-withdraw-label">收款钱包地址</td><td class="manual-withdraw-value manual-withdraw-mono" colspan="3">${esc(order.recipient)}</td></tr>
    <tr><td class="manual-withdraw-label">备注</td><td class="manual-withdraw-value" colspan="3">${esc(order.remark)}</td></tr>
    </tbody></table></section>`;
}
// WITHDRAW_ORDER_INFO_END

function canSubmitThirdPartyPayout(order) {
  return !!order && ['待处理', '待支付'].includes(order.status) && order.confirm === '已确认' && order.third === '未提交';
}
function selectedThirdPartyChannel(order, id) {
  return (order.getChannels?.() || []).find(c=>c.id===id && c.category==='下分' && c.enabled);
}
function submitThirdPartyPayout(order, channel) {
  if (!canSubmitThirdPartyPayout(order)) return false;
  if (order.business === 'withdraw') {
    if (!channel || channel.category !== '下分' || !channel.enabled) return false;
    order.sourceWithdrawalNo = order.id;
    order.channelId = channel.id; order.channelName = channel.name; order.channelProvider = channel.provider;
  }
  order.status = '代付处理中';
  order.third = '已提交';
  return true;
}
function thirdPartyPayoutBody(order, channels = order.getChannels?.() || []) {
  const escape = text => String(text ?? '—').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const currency = escape(order.currency), amount = Number(order.outAmount).toFixed(2), balance = Number(order.balance).toFixed(2);
  const withdrawal = order.business === 'withdraw';
  const chain = `<span class="third-payout-chain">${escape(order.chain)}</span>`;
  const row = (label, value) => `<div class="third-payout-row"><span class="third-payout-label">${label}</span><span class="third-payout-value">${value}</span></div>`;
  if (withdrawal) {
    const info = order.withdrawInfo || {id:order.id,merchant:order.merchant+'/'+order.merchantNo,amount:order.amount,fee:order.fee,net:order.outAmount,currency:order.currency,protocol:order.chain,recipient:order.recipient,status:order.status};
    return `${withdrawOrderInfoHtml(info)}
      <section class="manual-withdraw-section"><h4 class="manual-withdraw-title"><label for="withdrawPayoutChannel">代付通道</label></h4><select class="third-payout-channel-select" id="withdrawPayoutChannel" aria-label="代付通道" ${channels.length?'':'disabled'}><option value="">${channels.length?'请选择下分代付通道':'暂无已开启的下分通道'}</option>${channels.map(c=>`<option value="${escape(c.id)}">${escape(c.name)}</option>`).join('')}</select><p class="manual-withdraw-hint">仅可选择已开启的下分类通道；确认后提交至所选通道，等待通道回调更新出款结果。</p></section>
      <div class="manual-withdraw-amount">到账金额：${Number(info.net).toFixed(2)} ${currency} <span>（按此金额提交所选通道）</span></div>
      <div class="manual-withdraw-field"><label for="thirdPayoutRemark">备注：</label><input class="manual-withdraw-input" id="thirdPayoutRemark" placeholder="请输入备注"></div>
      <div class="manual-withdraw-field"><span class="manual-withdraw-field-label">审核图片：</span><div><div class="manual-withdraw-upload-list" id="thirdPayoutImages"><label class="manual-withdraw-upload">+<input id="thirdPayoutImageInput" type="file" multiple accept="image/jpeg,image/png,image/gif" aria-label="上传审核图片"></label></div><p class="manual-withdraw-hint">可上传多张凭证图</p><p class="manual-withdraw-error" id="thirdPayoutUploadError" role="status"></p></div></div>
      <p class="third-payout-error" role="status" aria-live="polite"></p>`;
  }
  return `<div class="third-payout-alert" role="alert"><span class="third-payout-alert-icon" aria-hidden="true">!</span><span>确认后订单将提交到三方代付，当前状态改为「代付处理中」。需等待三方转账回调后，再同步最终状态给商户。</span></div>
    <div class="third-payout-info">${[
      row('商户订单号', `<span class="third-payout-mono">${escape(order.merchantOrder)}</span>`),
      row('平台订单号', `<span class="third-payout-mono">${escape(order.id)}</span>`),
      row('商户名称', escape(order.merchant)), row('商户号', escape(order.merchantNo)),
      row(currency + '剩余预付', balance + ' ' + currency),
      row('收款钱包地址', chain + `<span class="third-payout-mono">${escape(order.recipient)}</span><button type="button" class="third-payout-copy" data-third-copy="${escape(order.recipient)}" aria-label="复制收款钱包地址">▣</button>`),
      row('协议类型', chain),
      row('出款金额', `<span class="third-payout-amount">${amount} ${currency}</span><button type="button" class="third-payout-copy" data-third-copy="${amount}" aria-label="复制出款金额">复制</button>`),
      row('三方处理状态', '未提交第三方：本地订单未记录第三方订单号，可走普通提交第三方流程'),
      row('处理方式', '提交三方代付，等待三方转账回调')
    ].join('')}</div><p class="third-payout-error" role="status" aria-live="polite"></p>`;
}

function openThirdPartyPayout(order, onSubmitted, notify) {
  if (!canSubmitThirdPartyPayout(order)) return notify('该订单当前不可提交代付');
  if (document.querySelector('.third-payout-shade')) return;
  const previousFocus = document.activeElement, previousOverflow = document.body.style.overflow, images = [];
  const shade = document.createElement('div');
  shade.className = 'third-payout-shade';
  shade.innerHTML = `<section class="third-payout-dialog ${order.business === 'withdraw' ? 'third-payout-withdraw-dialog' : ''}" role="dialog" aria-modal="true" aria-labelledby="thirdPayoutTitle"><header class="third-payout-head"><h2 id="thirdPayoutTitle">代付出款</h2><button class="third-payout-close" type="button" aria-label="关闭此对话框">×</button></header><div class="third-payout-body">${thirdPartyPayoutBody(order)}</div><footer class="third-payout-foot"><button type="button" class="third-payout-button third-payout-cancel">取消</button><button type="button" class="third-payout-button third-payout-submit">${order.business === 'withdraw' ? '确认提交代付出款' : '确认提交三方代付'}</button></footer></section>`;
  function close() { images.forEach(image=>URL.revokeObjectURL(image.url)); shade.remove(); document.body.style.overflow = previousOverflow; document.removeEventListener('keydown', keydown, true); if (previousFocus?.isConnected) previousFocus.focus(); }
  function keydown(event) {
    if (event.key === 'Escape') { event.preventDefault(); event.stopImmediatePropagation(); close(); return; }
    if (event.key !== 'Tab') return;
    const buttons = [...shade.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled)')].filter(el=>el.getClientRects().length), first = buttons[0], last = buttons.at(-1);
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  }
  shade.querySelector('.third-payout-close').onclick = shade.querySelector('.third-payout-cancel').onclick = close;
  shade.onclick = event => { if (event.target === shade) close(); };
  shade.querySelectorAll('[data-third-copy]').forEach(button => button.onclick = async () => {
    try { await navigator.clipboard.writeText(button.dataset.thirdCopy); notify('复制成功'); }
    catch { shade.querySelector('.third-payout-error').textContent = '请选中对应内容复制'; }
  });
  const upload = shade.querySelector('#thirdPayoutImageInput');
  if (upload) upload.onchange = event => {
    const errors=[];
    for (const file of event.target.files) {
      if (!['image/jpeg','image/png','image/gif'].includes(file.type)) { errors.push(file.name); continue; }
      const image={name:file.name,url:URL.createObjectURL(file)}, item=document.createElement('div');images.push(image);item.className='manual-withdraw-preview';
      const preview=document.createElement('img');preview.src=image.url;preview.alt=file.name;
      const remove=document.createElement('button');remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','移除审核图片 '+file.name);remove.onclick=()=>{URL.revokeObjectURL(image.url);images.splice(images.indexOf(image),1);item.remove()};
      item.append(preview,remove);shade.querySelector('#thirdPayoutImages').insertBefore(item,shade.querySelector('.manual-withdraw-upload'));
    }
    shade.querySelector('#thirdPayoutUploadError').textContent=errors.length?'请选择 JPG、PNG 或 GIF 图片':'';event.target.value='';
  };
  const selector = shade.querySelector('#withdrawPayoutChannel'), submit = shade.querySelector('.third-payout-submit');
  if (selector) { submit.disabled = true; selector.onchange = () => { submit.disabled = !selector.value; shade.querySelector('.third-payout-error').textContent = ''; }; }
  shade.querySelector('.third-payout-submit').onclick = () => {
    const channel = selector ? selectedThirdPartyChannel(order, selector.value) : undefined;
    if (selector && !channel) { submit.disabled = true; shade.querySelector('.third-payout-error').textContent = '请选择已开启的下分通道；所选通道可能已关闭或被删除'; return; }
    if (!submitThirdPartyPayout(order, channel)) { shade.querySelector('.third-payout-error').textContent = '订单状态已变化，请关闭后刷新查看'; return; }
    if (selector) { order.operationRemark=shade.querySelector('#thirdPayoutRemark').value.trim(); order.auditImageNames=images.map(image=>image.name); }
    close(); onSubmitted(order); notify(order.business === 'withdraw' ? '已模拟提交至'+order.channelName+'，等待通道回调' : '已模拟提交新万能代付，等待三方回调');
  };
  document.body.appendChild(shade); document.body.style.overflow = 'hidden';
  document.addEventListener('keydown', keydown, true); shade.querySelector('.third-payout-cancel').focus();
}
// THIRD_PARTY_PAYOUT_END

    function setupRechargePage() {
      const get = (id) => document.getElementById(id);
      const statusText = { done: "已完成", processing: "充值中", review: "人工审核", expired: "已过期", closed: "已关闭", rejected: "异常关闭" };
      const money = (value) => Number(value).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " USDT";
      function selectedOrders() {
        const order = get("rechargeOrder").value.trim().toLowerCase();
        const merchant = get("rechargeMerchant").value.trim().toLowerCase();
        const keyword = get("rechargeKeyword").value.trim().toLowerCase();
        const status = get("rechargeStatus").value;
        return rechargeOrders.filter((item) =>
          (!order || item.no.toLowerCase().includes(order)) &&
          (!merchant || item.merchant.toLowerCase().includes(merchant)) &&
          (!keyword || item.txid.toLowerCase().includes(keyword) || item.address.toLowerCase().includes(keyword)) &&
          (!status || item.status === status)
        );
      }
      function renderRechargeOrders() {
        const list = selectedOrders();
        const byStatus = (status) => list.filter((item) => item.status === status);
        const sum = (items) => items.reduce((total, item) => total + item.amount, 0);
        const success = byStatus("done");
        const failed = list.filter((item) => ["expired", "closed", "rejected"].includes(item.status));
        const processing = list.filter((item) => ["processing", "review"].includes(item.status));
        get("rechargeAll").textContent = list.length;
        get("rechargeProcessing").textContent = byStatus("processing").length;
        get("rechargeReview").textContent = byStatus("review").length;
        get("rechargeDone").textContent = success.length;
        get("rechargeSuccessAmount").textContent = money(sum(success));
        get("rechargeFailedAmount").textContent = money(sum(failed));
        get("rechargeSuccessCount").textContent = success.length;
        get("rechargeFailedCount").textContent = failed.length;
        get("rechargeSuccessRate").textContent = (success.length + failed.length ? success.length / (success.length + failed.length) * 100 : 0).toFixed(2) + "%";
        get("rechargeProcessingAmount").textContent = money(sum(processing));
        get("rechargeProcessingCount").textContent = processing.length;
        get("rechargeTotal").textContent = "共 " + list.length + " 条";
        get("rechargeRows").innerHTML = list.length ? list.map((item) => {
          const statusClass = item.status === "done" ? "success" : item.status === "processing" || item.status === "review" ? "warning" : "danger";
          return `<tr><td class="mono">${item.no} ${mockLink("复制订单号")}</td><td>${item.merchant}</td><td>${money(item.amount)}</td><td>${money(item.fee)}</td><td>${item.net ? money(item.net) : "—"}</td><td class="mono">${item.address} ${mockLink("复制地址")}</td><td class="mono">${item.txid}${item.txid === "—" ? "" : " " + mockLink("复制TXID")}</td><td>${item.confirm}</td><td><span class="tag ${statusClass}">${statusText[item.status]}</span></td><td>${item.created}</td><td>${mockLink("查看")}</td></tr>`;
        }).join("") : '<tr><td class="recharge-empty" colspan="11">暂无符合条件的订单</td></tr>';
      }
      get("rechargeSearch").addEventListener("click", renderRechargeOrders);
      get("rechargeReset").addEventListener("click", () => {
        ["rechargeOrder", "rechargeMerchant", "rechargeKeyword"].forEach((id) => { get(id).value = ""; });
        get("rechargeStatus").value = "";
        renderRechargeOrders();
      });

        get(id).addEventListener("keydown", (event) => {
          if (event.key === "Enter") renderRechargeOrders();
        });
      });
      renderRechargeOrders();
    }

    function saveTierRule() {
      const editor = document.getElementById("tierRuleEditor");
      const error = document.getElementById("tierRuleError");
      if (!editor || !error) return;
      const start = Number(document.getElementById("tierStartAmount").value);
      const groupId = document.getElementById("tierGroupId").value.trim();
      const people = [...new Set(document.getElementById("tierPeople").value.split(/[\s,，;；]+/).map((item) => item.trim()).filter(Boolean))];
      const required = Number(document.getElementById("tierRequiredCount").value);
      const index = Number(editor.dataset.editIndex);
      let message = "";
      if (!Number.isFinite(start) || start < 0) message = "请输入正确的起始金额";
      else if (tierRules.some((rule, ruleIndex) => ruleIndex !== index && rule.start === start)) message = "起始金额不能与已有阶梯相同";
      else if (index >= 0 && tierRules[index].start === 0 && start !== 0) message = "第一阶起始金额必须为 0";
      else if (!groupId) message = "请输入 TG 群 ID";
      else if (!Number.isInteger(required) || required < 1) message = "需确认人数必须为正整数";
      else if (people.length < required) message = "确认人员数量不能少于需确认人数";
      if (message) {
        error.textContent = message;
        error.hidden = false;
        return;
      }
      const rule = {
        start,
        groupId,
        people,
        required
      };
      if (index >= 0) tierRules[index] = rule;
      else tierRules.push(rule);
      tierRules.sort((a, b) => a.start - b.start);
      renderTierRuleRows();
      closeTierRuleEditor();
      showToast(index >= 0 ? "金额区间配置已更新" : "金额区间配置已新增");
    }

    function setMerchantConfigPanel(key) {
      const root = document.getElementById("merchantModalRoot");
      const content = root.querySelector("#merchantConfigContent");
      root.querySelectorAll("[data-modal-section-target]").forEach((button) => {
        const selected = button.dataset.modalSectionTarget === key;
        button.classList.toggle("active", selected);
        button.setAttribute("aria-selected", String(selected));
      });
      root.querySelectorAll("[data-modal-section-panel]").forEach((panel) => {
        panel.hidden = panel.dataset.modalSectionPanel !== key;
      });
      if (key !== "payout-confirm") closeTierRuleEditor();
      if (content) content.scrollTop = 0;
    }

    function submitTransferOrder() {
      const root = document.getElementById("transferModalRoot");
      const sourceNo = root.querySelector("[data-transfer-source]").value;
      const targetNo = root.querySelector("[data-transfer-target]").value;
      const sourceWallet = root.querySelector("[data-transfer-source-wallet]").value;
      const targetWallet = root.querySelector("[data-transfer-target-wallet]").value;
      const amount = Number(root.querySelector("[data-transfer-amount]").value);
      const error = root.querySelector("[data-transfer-error]");
      const allowedTargets = transferRelations[sourceNo] || [];
      const config = transferReviewConfigs[sourceNo];
      const sharedBot = withdrawConfirmConfigs[sourceNo]?.bot;
      const fail = (message) => { error.hidden = false; error.textContent = message; };
      if (!allowedTargets.includes(targetNo)) return fail("目标商户不在被划出商户的可互转配置中。");
      if (!sharedBot || !config || !config.group || !config.reviewers.length || !config.required) return fail("请先完整配置被划出商户的下分确认机器人，以及资金划转审核群、确认人和确认人数。");
      if (!Number.isFinite(amount) || amount <= 0) return fail("请输入大于 0 的划转金额。");
      if (amount > walletBalance(sourceNo, sourceWallet)) return fail(`划转金额不能超过该商户的模拟${walletLabel(sourceWallet)}。`);
      transferOrders.unshift({ no: `TRF20260805${String(transferSequence++).padStart(4, "0")}`, sourceNo, targetNo, sourceWallet, targetWallet, amount: amount.toFixed(6), bot: sharedBot, group: config.group, reviewers: config.reviewers, required: config.required, created: "2026-08-05 12:00:00" });
      closeTransferModal();
      navigateTo("withdraw");
      showToast("资金划转订单已提交，等待审核群多人确认。");
    }

    function addTransferNotifyUsers(section) {
      const input = section.querySelector("[data-transfer-notify-input]");
      const names = input.value.split(/[，,\s]+/).map((item) => item.trim().replace(/^@+/, "")).filter(Boolean);
      if (!names.length) return showToast("请输入 Telegram username。");
      if (names.some((name) => !/^[A-Za-z0-9_]{5,32}$/.test(name))) return showToast("Telegram username 仅支持 5–32 位字母、数字或下划线。");
      const sourceNo = section.dataset.transferConfig;
      const config = transferReviewConfigs[sourceNo] ||= { group: "", reviewers: [], notifyUsers: [], required: 2 };
      config.notifyUsers ||= [];
      const users = names.map((name) => `@${name}`);
      const added = users.filter((username) => !config.notifyUsers.includes(username));
      if (!added.length) return showToast("输入的 TG 通知人已全部存在。");
      config.notifyUsers.push(...added);
      input.value = "";
      refreshTransferNotifyTags(section);
      showToast(`已添加 ${added.length} 位 TG 通知人。`);
    }

function manualWithdrawData(row, index) {
  const chain = row[8] === 'TRON' ? 'TRC20' : row[8];
  return {id:row[1],merchant:row[3],amount:Number(row[4]),fee:Number(row[5]),net:Number(row[6]),currency:row[7],protocol:row[7]+'-'+chain,
    recipient:'TDEMOWithdrawRecipientAddress00001',status:row[9],created:'2026-08-04 10:2'+index+':00',
    operated:index<3?'2026-08-04 10:30:00':'—',operator:index<3?'运营员':'—',remark:index===0?'优先处理':'—'};
}
function validManualWithdrawAddress(value, protocol) {

    function withdrawSummary(records) {

    function filterCryptoOrders(orders, query) {

        includes(order.channel, query.channel) &&
        includes(order.merch, query.merch) &&

      );

    function cryptoOrdersCsv(orders) {
      const quoteCell = (value) => {
        let text = String(value ?? "");
        // Spreadsheet apps interpret these prefixes as formulas even inside quoted CSV cells.
        if (/^\s*[=+@-]/.test(text) && !/^-\d+(?:\.\d+)?$/.test(text)) text = "'" + text;
        return '"' + text.replaceAll('"', '""') + '"';
      };
      const records = orders.map(cryptoOrderRecord);
      const lines = [Object.keys(cryptoOrderRecord({})), ...records.map(Object.values)];
      return "\uFEFF" + lines.map((line) => line.map(quoteCell).join(",")).join("\r\n");
    }

    function stepCryptoRepairAmount(value, step) {
      const parts = /^(\d+)(?:\.(\d+))?$/.exec(value);
      const whole = BigInt(parts?.[1] ?? "0") + BigInt(step);
      const fraction = (parts?.[2] ?? "").padEnd(2, "0");
      const limit = BigInt(Number.MAX_SAFE_INTEGER);
      if (whole < 0n) return "0." + "0".repeat(fraction.length);
      if (whole >= limit) return limit + "." + "0".repeat(fraction.length);
      return whole + "." + fraction;
    }

        refreshRelationTags(section);
        showToast("已更新可互转商户关系。");
        return;
      }
      if (target.dataset.transferRemoveRelation !== undefined) {
        const section = target.closest("[data-transfer-config]");
        const sourceNo = section.dataset.transferConfig;
        const targetNo = target.dataset.transferRemoveRelation;
        transferRelations[sourceNo] = (transferRelations[sourceNo] || []).filter((item) => item !== targetNo);
        transferRelations[targetNo] = (transferRelations[targetNo] || []).filter((item) => item !== sourceNo);
        refreshRelationTags(section);
        showToast("已移除可互转商户关系。");
        return;
      }
      if (target.dataset.transferAddReviewer !== undefined) {
        const section = target.closest("[data-transfer-config]");
        const sourceNo = section.dataset.transferConfig;
        const input = section.querySelector("[data-transfer-reviewer-input]");
        const reviewer = input.value.trim();
        if (!reviewer) return showToast("请输入有效确认人。");
        transferReviewConfigs[sourceNo] = transferReviewConfigs[sourceNo] || { group: "", reviewers: [], required: 2 };
        if (!transferReviewConfigs[sourceNo].reviewers.includes(reviewer)) transferReviewConfigs[sourceNo].reviewers.push(reviewer);
        input.value = "";
        refreshReviewerTags(section);
        showToast("已添加有效确认人。");
        return;
      }
      if (target.dataset.transferAddNotify !== undefined) {
        addTransferNotifyUsers(target.closest("[data-transfer-config]"));
        return;
      }
      if (target.dataset.transferRemoveNotifyUser !== undefined) {
        const section = target.closest("[data-transfer-config]");
        const config = transferReviewConfigs[section.dataset.transferConfig];
        config.notifyUsers = (config.notifyUsers || []).filter((username) => username !== target.dataset.transferRemoveNotifyUser);
        refreshTransferNotifyTags(section);
        showToast("已移除 TG 通知人。");
        return;
      }
      if (target.dataset.transferRemoveReviewer !== undefined) {
        const section = target.closest("[data-transfer-config]");
        const sourceNo = section.dataset.transferConfig;
        transferReviewConfigs[sourceNo].reviewers = transferReviewConfigs[sourceNo].reviewers.filter((item) => item !== target.dataset.transferRemoveReviewer);
        refreshReviewerTags(section);
        showToast("已移除有效确认人。");
        return;
      }
      if (target.dataset.balanceAlertAddNotifyUser !== undefined) {
        addBalanceAlertNotifyUsers(target.closest("[data-balance-alert-config]"));
        return;
      }
      if (target.dataset.balanceAlertRemoveNotifyUser !== undefined) {
        const section = target.closest("[data-balance-alert-config]");
        const config = balanceAlertConfig(section.dataset.balanceAlertConfig);
        config.notifyUsers = config.notifyUsers.filter((username) => username !== target.dataset.balanceAlertRemoveNotifyUser);
        refreshBalanceAlertNotifyTags(section);
        showToast("已移除 TG 通知人。");
        return;
      }
      if (target.dataset.modalClose !== undefined) {
        closeMerchantModal();
        return;
      }
      if (target.dataset.modalSubmit !== undefined) {
        saveWithdrawConfirmConfig(document.getElementById("merchantModalRoot"));
        saveTransferConfig(document.getElementById("merchantModalRoot"));
        closeMerchantModal();
        showToast("商户与资金划转配置已保存");
        return;
      }
      const modalSectionTarget = target.dataset.modalSectionTarget;
      if (modalSectionTarget) {
        setMerchantConfigPanel(modalSectionTarget);
        return;
      }
      const tierAction = target.dataset.tierAction;
      if (tierAction) {
        const index = Number(target.dataset.tierIndex);
        if (tierAction === "add") openTierRuleEditor();
        if (tierAction === "edit") openTierRuleEditor(index);
        if (tierAction === "cancel") closeTierRuleEditor();
        if (tierAction === "save") saveTierRule();
        if (tierAction === "delete" && Number.isInteger(index)) {
          if (tierRules[index] && tierRules[index].start === 0) {
            showToast("第一阶起始金额为 0，不能删除");
          } else {
            tierRules.splice(index, 1);
            renderTierRuleRows();
            closeTierRuleEditor();
            showToast("金额阶梯配置已删除");
          }
        }
        return;
      }
      const configToggle = target.dataset.configToggle;
      if (configToggle) {
        const enabled = !target.classList.contains("on");
        target.classList.toggle("on", enabled);
        target.setAttribute("aria-checked", String(enabled));
        setConfigSectionState(configToggle, enabled);
        if (configToggle === "balance-alert") {
          const section = target.closest("[data-balance-alert-config]");
          balanceAlertConfig(section.dataset.balanceAlertConfig).enabled = enabled;
          refreshBalanceAlertNotifyTags(section);
        }
        return;
      }
      if (target.dataset.currency) {
        accountCurrency = target.dataset.currency;
        renderPage();
        showToast(accountCurrency + " 数据已刷新");
        return;
      }
      if (target.dataset.cryptoRateEdit) {
        openCryptoRateModal(target.dataset.cryptoRateEdit);
        return;
      }
      if (target.dataset.cryptoRateClose !== undefined) {
        closeCryptoRateModal();
        return;
      }
      if (target.dataset.cryptoRateSave) {
        saveCryptoRateModal(target.dataset.cryptoRateSave);
        return;
      }
      if (target.dataset.action === "新增币种") {
        const select = document.getElementById("cryptoNewCurrency");
        const option = cryptoCurrencyOptions.find((item) => item.cur === select?.value);
        if (!option || cryptoRateRows.some((item) => item.cur === option.cur)) return showToast("该币种已配置");
        const base = cryptoRateNumber(option.base);
        cryptoRateRows.push({ ...option, floating: formatCryptoRate(option.cur, 0), effective: formatCryptoRate(option.cur, base), quoteStatus: "已获取" });
        renderPage();
        showToast(option.cur + " 已加入指定币种汇率配置");
        return;
      }
      const page = target.dataset.page;
      if (page !== undefined && page !== "") { navigateTo(page); return; }
      const group = target.dataset.group;
      if (group && group.endsWith("-group")) {
        target.closest(".menu-group").classList.toggle("open");
        return;
      }
      if (target.classList.contains("switch")) {
        target.classList.toggle("on");
        showToast("已切换模拟状态，不影响真实后台");
        return;
      }
      const action = target.dataset.action;
      if (action) showToast(`现状页面：${action} 不执行真实业务操作`);
    });
    document.addEventListener("change", (event) => {
      if (event.target.matches("[data-transfer-source], [data-transfer-target], [data-transfer-source-wallet], [data-transfer-target-wallet]")) refreshTransferModal(document.getElementById("transferModalRoot"));
      if (event.target.matches("[data-crypto-rate-source]")) updateCryptoRatePreview();
    });
    document.addEventListener("input", (event) => {
      if (event.target.matches("[data-crypto-rate-floating]")) updateCryptoRatePreview();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && event.target.matches("[data-transfer-notify-input]")) {
        event.preventDefault();
        addTransferNotifyUsers(event.target.closest("[data-transfer-config]"));
        return;
      }
      if (event.key === "Enter" && event.target.matches("[data-balance-alert-notify-input]")) {
        event.preventDefault();
        addBalanceAlertNotifyUsers(event.target.closest("[data-balance-alert-config]"));
        return;
      }
      if (event.key === "Escape" && document.getElementById("cryptoRateModalRoot").innerHTML) {
        closeCryptoRateModal();
        return;
      }
      if (event.key === "Escape" && document.getElementById("transferModalRoot").innerHTML) {
        closeTransferModal();
        return;
      }
      if (event.key !== "Escape" || !document.getElementById("merchantModalRoot").innerHTML) return;
      const editor = document.getElementById("tierRuleEditor");
      if (editor && !editor.hidden) closeTierRuleEditor();
      else closeMerchantModal();
    });

    const openPages = ["merchant","feeConfig","withdraw","recharge","payout","collect","cryptoConfig","cryptoOrder","mcFlow","chFlow","mcPrepay","mpFlow","mpPrepay","daily"];
    const bootPage = (typeof window !== "undefined" && window.__BP_BOOT__) || location.hash.replace("#", "") || new URLSearchParams(location.search).get("page") || "";
    if (openPages.includes(bootPage)) currentPage = bootPage;
    if (["mcFlow","chFlow","mcPrepay","mpFlow","mpPrepay","daily"].includes(currentPage)) accountCurrency = "TRX";
    syncWithdrawAutoRefresh();
    renderPage();
  </script>
</body>
</html>
