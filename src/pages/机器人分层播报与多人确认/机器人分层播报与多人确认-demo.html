    function setupRechargePage() {
      const get = (id) => document.getElementById(id);
      const statusText = { done: "已完成", processing: "充值中", review: "人工审核", expired: "已过期", closed: "已关闭", rejected: "异常关闭" };
      const money = (value) => Number(value).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " USDT";
      function selectedOrders() {
        const order = get("rechargeOrder").value.trim().toLowerCase();
        const merchant = get("rechargeMerchant").value.trim().toLowerCase();
        const keyword = get("rechargeKeyword").value.trim().toLowerCase();
        const status = get("rechargeStatus").value;
        return rechargeOrders.filter((item) =>
          (!order || item.no.toLowerCase().includes(order)) &&
          (!merchant || item.merchant.toLowerCase().includes(merchant)) &&
          (!keyword || item.txid.toLowerCase().includes(keyword) || item.address.toLowerCase().includes(keyword)) &&
          (!status || item.status === status)
        );
      }
      function renderRechargeOrders() {
        const list = selectedOrders();
        const byStatus = (status) => list.filter((item) => item.status === status);
        const sum = (items) => items.reduce((total, item) => total + item.amount, 0);
        const success = byStatus("done");
        const failed = list.filter((item) => ["expired", "closed", "rejected"].includes(item.status));
        const processing = list.filter((item) => ["processing", "review"].includes(item.status));
        get("rechargeAll").textContent = list.length;
        get("rechargeProcessing").textContent = byStatus("processing").length;
        get("rechargeReview").textContent = byStatus("review").length;
        get("rechargeDone").textContent = success.length;
        get("rechargeSuccessAmount").textContent = money(sum(success));
        get("rechargeFailedAmount").textContent = money(sum(failed));
        get("rechargeSuccessCount").textContent = success.length;
        get("rechargeFailedCount").textContent = failed.length;
        get("rechargeSuccessRate").textContent = (success.length + failed.length ? success.length / (success.length + failed.length) * 100 : 0).toFixed(2) + "%";
        get("rechargeProcessingAmount").textContent = money(sum(processing));
        get("rechargeProcessingCount").textContent = processing.length;
        get("rechargeTotal").textContent = "共 " + list.length + " 条";
        get("rechargeRows").innerHTML = list.length ? list.map((item) => {
          const statusClass = item.status === "done" ? "success" : item.status === "processing" || item.status === "review" ? "warning" : "danger";
          return `<tr><td class="mono">${item.no} ${mockLink("复制订单号")}</td><td>${item.merchant}</td><td>${money(item.amount)}</td><td>${money(item.fee)}</td><td>${item.net ? money(item.net) : "—"}</td><td class="mono">${item.address} ${mockLink("复制地址")}</td><td class="mono">${item.txid}${item.txid === "—" ? "" : " " + mockLink("复制TXID")}</td><td>${item.confirm}</td><td><span class="tag ${statusClass}">${statusText[item.status]}</span></td><td>${item.created}</td><td>${mockLink("查看")}</td></tr>`;
        }).join("") : '<tr><td class="recharge-empty" colspan="11">暂无符合条件的订单</td></tr>';
      }
      get("rechargeSearch").addEventListener("click", renderRechargeOrders);
      get("rechargeReset").addEventListener("click", () => {
        ["rechargeOrder", "rechargeMerchant", "rechargeKeyword"].forEach((id) => { get(id).value = ""; });
        get("rechargeStatus").value = "";
        renderRechargeOrders();
      });
      ["rechargeOrder", "rechargeMerchant", "rechargeKeyword", "rechargeStatus"].forEach((id) => {
        get(id).addEventListener("keydown", (event) => {
          if (event.key === "Enter") renderRechargeOrders();
        });
      });
      renderRechargeOrders();
    }

    function escapeTierText(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[char]);
    }

    function formatTierAmount(value) {
      return Number(value).toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function tierRuleRows() {
      return tierRules.map((rule, index) => {
        const nextRule = tierRules[index + 1];
        const range = nextRule
          ? `<span>${formatTierAmount(rule.start)} USDT 起</span><span class="tier-range-end">${formatTierAmount(nextRule.start)} USDT 前</span>`
          : `<span>${formatTierAmount(rule.start)} USDT 起</span><span class="tier-range-end">无上限</span>`;
        const people = rule.people.map((username) =>
          `<span class="tier-person">${escapeTierText(username)}</span>`
        ).join("");
        return `<tr data-tier-row="${index}">
          <td><div class="tier-range">${range}</div></td>
          <td><span class="tier-group">${escapeTierText(rule.groupId)}</span></td>
          <td><div class="tier-people">${people}</div></td>
          <td><span class="tier-required">${rule.required} 人</span></td>
          <td><div class="tier-actions"><button type="button" class="link" data-tier-action="edit" data-tier-index="${index}">修改</button><button type="button" class="link" data-tier-action="delete" data-tier-index="${index}">删除</button></div></td>
        </tr>`;
      }).join("");
    }

    function renderTierRuleRows() {
      const rows = document.getElementById("tierRuleRows");

    function openTierRuleEditor(index = -1) {
      const editor = document.getElementById("tierRuleEditor");
      if (!editor) return;
      const rule = index >= 0 ? tierRules[index] : null;
      editor.dataset.editIndex = String(index);
      document.getElementById("tierEditorTitle").textContent = rule ? "修改金额区间配置" : "新增金额区间配置";
      document.getElementById("tierStartAmount").value = rule ? rule.start : "";
      document.getElementById("tierGroupId").value = rule ? rule.groupId : "";
      document.getElementById("tierPeople").value = rule ? rule.people.join(", ") : "";
      document.getElementById("tierRequiredCount").value = rule ? rule.required : 1;
      document.getElementById("tierRuleError").hidden = true;
      editor.hidden = false;
      editor.scrollIntoView({ behavior: "smooth", block: "nearest" });
      document.getElementById("tierStartAmount").focus();
    }

    function closeTierRuleEditor() {
      const editor = document.getElementById("tierRuleEditor");
      if (editor) editor.hidden = true;
    }

    function saveTierRule() {
      const editor = document.getElementById("tierRuleEditor");
      const error = document.getElementById("tierRuleError");
      if (!editor || !error) return;
      const start = Number(document.getElementById("tierStartAmount").value);
      const groupId = document.getElementById("tierGroupId").value.trim();
      const people = [...new Set(document.getElementById("tierPeople").value.split(/[\s,，;；]+/).map((item) => item.trim()).filter(Boolean))];
      const required = Number(document.getElementById("tierRequiredCount").value);
      const index = Number(editor.dataset.editIndex);
      let message = "";
      if (!Number.isFinite(start) || start < 0) message = "请输入正确的起始金额";
      else if (tierRules.some((rule, ruleIndex) => ruleIndex !== index && rule.start === start)) message = "起始金额不能与已有阶梯相同";
      else if (index >= 0 && tierRules[index].start === 0 && start !== 0) message = "第一阶起始金额必须为 0";
      else if (!groupId) message = "请输入 TG 群 ID";
      else if (!Number.isInteger(required) || required < 1) message = "需确认人数必须为正整数";
      else if (people.length < required) message = "确认人员数量不能少于需确认人数";
      if (message) {
        error.textContent = message;
        error.hidden = false;
        return;
      }
      const rule = {
        start,
        groupId,
        people,
        required
      };
      if (index >= 0) tierRules[index] = rule;
      else tierRules.push(rule);
      tierRules.sort((a, b) => a.start - b.start);
      renderTierRuleRows();
      closeTierRuleEditor();
      showToast(index >= 0 ? "金额区间配置已更新" : "金额区间配置已新增");
    }

      const sourceWallet = root.querySelector("[data-transfer-source-wallet]").value;

      if (!allowedTargets.includes(targetNo)) return fail("目标商户不在被划出商户的可互转配置中。");

    function withdrawSummary(records) {
      const statisticRecords = records.filter((record) => record.type !== "划转");
      const currencies = [...new Set(["USDT", "TRX", ...statisticRecords.map((record) => record.currency)])];
      const recordsFor = (currency) => statisticRecords.filter((record) => record.currency === currency);
      const count = (currency, status) => recordsFor(currency).filter((record) => record.status === status).length;
      const total = (currency, key, onlyProcessed = false) => recordsFor(currency).reduce((sum, record) => sum + ((!onlyProcessed || record.status === "已处理") ? record[key] : 0), 0);
      const rows = [
        ["总下分笔数", (currency) => recordsFor(currency).length, ""],
        ["待处理笔数", (currency) => count(currency, "待处理"), "pending"],
        ["已处理笔数", (currency) => count(currency, "已处理"), "done"],
        ["已取消笔数", (currency) => count(currency, "已取消"), "cancelled"],
        ["下分申请金额", (currency) => total(currency, "amount").toFixed(2), "amount"],
        ["实际到账金额", (currency) => total(currency, "net", true).toFixed(2), "done"],

      const cols = kind.startsWith("ch") || kind.includes("mc") || kind.includes("mp")
        ? ["序号", titleEntity, "平台订单号", "商户订单号", "类型", "币种", "原金额", "变动金额", "变动后金额", "变动时间", "备注"]
        : ["序号", "平台订单号", "商户订单号", "类型", "币种", "原金额", "变动金额", "变动后金额", "变动时间", "备注"];
      const rows = data.length ? data.map((r) => `<tr>
        <td>${r.idx}</td><td>${r.entity}</td>
        <td class="mono">${r.plat}</td><td class="mono">${r.merch}</td><td>${r.type}</td><td>${r.cur}</td>
        <td class="mono">${r.orig}</td><td>${deltaHtml(r.delta)}</td><td class="mono">${r.after}</td><td>${r.time}</td><td>${r.remark||"—"}</td>
      </tr>`).join("") : `<tr><td colspan="11" style="text-align:center;padding:36px;color:var(--muted)">暂无 ${accountCurrency} 数据</td></tr>`;
      return `<div class="filters">
        ${field("平台订单号", input("平台订单号"))}${field("商户订单号", input("商户订单号"))}
        ${field("类型", select("全部类型", 120))}
        ${button("搜索","primary")}${button("重置")}${button("导出")}
      </div>
      ${currencyTabs(accountCurrency)}
      <div class="table-wrap"><table style="min-width:1100px">
        <thead><tr>${cols.map((c)=>`<th>${c}</th>`).join("")}</tr></thead>
        <tbody>${rows}</tbody></table></div>${pagination(data.length)}
      <p style="margin:12px 0 0;color:var(--muted);font-size:12px">TRX tab 与 CNY / USDT 并列；搜索/重置/导出只作用于当前币种；金额 6 位小数。</p>`;
    }
    function dailyPage() {
      const data = dailyByCur[accountCurrency] || [];
      const rows = data.length ? data.map((r) => `<tr>
        <td>${r.entity}</td><td class="mono">${r.amt}</td><td>${r.cnt}</td><td>${r.ok}</td><td>${r.rate}</td>
        <td class="mono">${r.fee}</td><td class="mono">${r.b0}</td><td class="mono">${r.b1}</td>
        <td class="mono">${r.p0}</td><td class="mono">${r.p1}</td><td>${mockLink("详情")}</td>
      </tr>`).join("") : `<tr><td colspan="11" style="text-align:center;padding:36px;color:var(--muted)">暂无 ${accountCurrency} 数据</td></tr>`;
      return `<div class="filters">
        ${field("商户", select("全部商户", 160))}
        ${button("搜索","primary")}${button("重置")}${button("导出")}
      </div>
      ${currencyTabs(accountCurrency)}
      <div class="table-wrap"><table style="min-width:1200px">
        <thead><tr><th>商户名称</th><th>订单金额</th><th>订单单量</th><th>成功订单量</th><th>成功率</th><th>商户服务费</th><th>期初余额</th><th>末期余额</th><th>期初预付</th><th>末期预付</th><th>操作</th></tr></thead>
        <tbody>${rows}</tbody></table></div>${pagination(data.length)}
      <p style="margin:12px 0 0;color:var(--muted);font-size:12px">TRX tab 宽表金额以 TRX 为单位；合计/导出仅当前 tab 币种。</p>`;
    }

    function renderPage() {
      const meta = pageMeta[currentPage];
      document.title = `蓝盛支付 - ${meta.title}`;
      document.getElementById("pageTitle").textContent = meta.heading || meta.title;
      document.getElementById("titleActions").innerHTML = currentPage === "payout" ? button("关闭进单", "danger") : "";
      const renderers = {
        merchant: merchantPage, feeConfig: feeConfigPage, withdraw: withdrawPage, recharge: rechargePage, payout: payoutPage, collect: collectPage,
        cryptoConfig: cryptoConfigPage,
        cryptoOrder: cryptoOrderPage,
        mcFlow: () => accountFlowPage("mcFlow"),
        chFlow: () => accountFlowPage("chFlow"),
        mcPrepay: () => accountFlowPage("mcPrepay"),
        mpFlow: () => accountFlowPage("mpFlow"),
        mpPrepay: () => accountFlowPage("mpPrepay"),
        daily: dailyPage
      };
      document.getElementById("pagePanel").innerHTML = renderers[currentPage]();
      renderSidebar();
      renderTabs();
      if (currentPage === "recharge") setupRechargePage();
      if (!(typeof window !== "undefined" && window.__BP_EMBED__)) location.hash = currentPage;
    }

    function navigateTo(page) {
      if (!page || !pageMeta[page] || page === "address") {
        showToast(page === "address" ? "地址查询仅保留页签展示" : "此菜单仅用于还原现状导航");
        return;
      }
      currentPage = page;
      if (["mcFlow","chFlow","mcPrepay","mpFlow","mpPrepay","daily"].includes(page)) accountCurrency = "TRX";
      renderPage();
      document.querySelector(".page").scrollTop = 0;
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    document.addEventListener("click", (event) => {
      const target = event.target.closest("button");
      if (!target) return;
      if (target.dataset.transferOpen !== undefined) {
        renderTransferModal(target.dataset.transferOpen, Number(target.dataset.transferIndex));
        return;
      }
      if (target.dataset.withdrawSearch !== undefined) {
        withdrawQuery = {
          order: document.getElementById("withdrawOrder")?.value.trim() || "",
          type: document.getElementById("withdrawType")?.value || "",
          status: document.getElementById("withdrawStatus")?.value || ""
        };
        renderPage();
        showToast("已按当前筛选条件刷新下分统计与记录。");
        return;
      }
      if (target.dataset.withdrawExport !== undefined) {
        const records = withdrawRecords();
        showToast(records.length ? `已按当前筛选条件生成 ${records.length} 条模拟导出（完整结果）。` : "当前筛选条件下暂无可导出数据。");
        return;
      }
      if (target.dataset.transferClose !== undefined) {
        closeTransferModal();
        return;
      }
      if (target.dataset.transferSubmit !== undefined) {
        submitTransferOrder();
        return;
      }
      if (target.dataset.editIndex !== undefined) {
        openMerchantModal(Number(target.dataset.editIndex));
        return;
      }
      if (target.dataset.transferConfigIndex !== undefined) {
        openMerchantModal(Number(target.dataset.transferConfigIndex), true);
        return;
      }
      if (target.dataset.feeCurrency !== undefined) {
        activeWithdrawFeeCurrency = target.dataset.feeCurrency;
        editingWithdrawFeeIndex = null;
        renderPage();
        return;
      }
      if (target.dataset.feeEdit !== undefined) {
        editingWithdrawFeeIndex = Number(target.dataset.feeEdit);
        renderPage();
        return;
      }
      if (target.dataset.feeCancel !== undefined) {
        editingWithdrawFeeIndex = null;
        renderPage();
        return;
      }
      if (target.dataset.feeSave !== undefined) {
        const start = Number(document.getElementById("feeRuleStart")?.value);
        const fee = Number(document.getElementById("feeRuleAmount")?.value);
        const rules = withdrawFeeRules[activeWithdrawFeeCurrency];
        if (!Number.isFinite(start) || start < 0 || !Number.isFinite(fee) || fee < 0) return showToast("请输入合法的起始金额和手续费。");
        if (rules.some((rule, index) => index !== editingWithdrawFeeIndex && rule.start === start)) return showToast("金额起始不能与已有阶梯相同。");
        if (editingWithdrawFeeIndex === 0 && start !== 0) return showToast("起始档金额必须为 0。");
        if (editingWithdrawFeeIndex === null) rules.push({ start, fee });
        else rules[editingWithdrawFeeIndex] = { start, fee };
        rules.sort((a, b) => a.start - b.start);
        editingWithdrawFeeIndex = null;
        renderPage();
        showToast(`${activeWithdrawFeeCurrency} 阶梯手续费已保存。`);
        return;
      }
      if (target.dataset.feeDelete !== undefined) {
        withdrawFeeRules[activeWithdrawFeeCurrency].splice(Number(target.dataset.feeDelete), 1);
        editingWithdrawFeeIndex = null;
        renderPage();
        showToast("阶梯手续费已删除。");
        return;
      }
      if (target.dataset.transferAddRelation !== undefined) {
        const section = target.closest("[data-transfer-config]");
        const sourceNo = section.dataset.transferConfig;
        const targetNo = section.querySelector("[data-transfer-relation-select]").value;
        if (!targetNo) return showToast("请先选择可互转商户。");
        transferRelations[sourceNo] = transferRelations[sourceNo] || [];
        transferRelations[targetNo] = transferRelations[targetNo] || [];
        if (!transferRelations[sourceNo].includes(targetNo)) transferRelations[sourceNo].push(targetNo);
        if (!transferRelations[targetNo].includes(sourceNo)) transferRelations[targetNo].push(sourceNo);
        refreshRelationTags(section);
        showToast("已更新可互转商户关系。");
        return;
      }
      if (target.dataset.transferRemoveRelation !== undefined) {
        const section = target.closest("[data-transfer-config]");
        const sourceNo = section.dataset.transferConfig;
        const targetNo = target.dataset.transferRemoveRelation;
        transferRelations[sourceNo] = (transferRelations[sourceNo] || []).filter((item) => item !== targetNo);
        transferRelations[targetNo] = (transferRelations[targetNo] || []).filter((item) => item !== sourceNo);
        refreshRelationTags(section);
        showToast("已移除可互转商户关系。");
        return;
      }
      if (target.dataset.transferAddReviewer !== undefined) {
        const section = target.closest("[data-transfer-config]");
        const sourceNo = section.dataset.transferConfig;
        const input = section.querySelector("[data-transfer-reviewer-input]");
        const reviewer = input.value.trim();
        if (!reviewer) return showToast("请输入有效确认人。");
        transferReviewConfigs[sourceNo] = transferReviewConfigs[sourceNo] || { group: "", reviewers: [], required: 2 };
        if (!transferReviewConfigs[sourceNo].reviewers.includes(reviewer)) transferReviewConfigs[sourceNo].reviewers.push(reviewer);
        input.value = "";
        refreshReviewerTags(section);
        showToast("已添加有效确认人。");
        return;
      }
      if (target.dataset.transferAddNotify !== undefined) {
        addTransferNotifyUsers(target.closest("[data-transfer-config]"));
        return;
      }
      if (target.dataset.transferRemoveNotifyUser !== undefined) {
        const section = target.closest("[data-transfer-config]");
        const config = transferReviewConfigs[section.dataset.transferConfig];
        config.notifyUsers = (config.notifyUsers || []).filter((username) => username !== target.dataset.transferRemoveNotifyUser);
        refreshTransferNotifyTags(section);
        showToast("已移除 TG 通知人。");
        return;
      }
      if (target.dataset.transferRemoveReviewer !== undefined) {
        const section = target.closest("[data-transfer-config]");
        const sourceNo = section.dataset.transferConfig;
        transferReviewConfigs[sourceNo].reviewers = transferReviewConfigs[sourceNo].reviewers.filter((item) => item !== target.dataset.transferRemoveReviewer);
        refreshReviewerTags(section);
        showToast("已移除有效确认人。");
        return;
      }
      if (target.dataset.balanceAlertAddNotifyUser !== undefined) {
        addBalanceAlertNotifyUsers(target.closest("[data-balance-alert-config]"));
        return;
      }
      if (target.dataset.balanceAlertRemoveNotifyUser !== undefined) {
        const section = target.closest("[data-balance-alert-config]");
        const config = balanceAlertConfig(section.dataset.balanceAlertConfig);
        config.notifyUsers = config.notifyUsers.filter((username) => username !== target.dataset.balanceAlertRemoveNotifyUser);
        refreshBalanceAlertNotifyTags(section);
        showToast("已移除 TG 通知人。");
        return;
      }
      if (target.dataset.modalClose !== undefined) {
        closeMerchantModal();
        return;
      }
      if (target.dataset.modalSubmit !== undefined) {
        saveWithdrawConfirmConfig(document.getElementById("merchantModalRoot"));
        saveTransferConfig(document.getElementById("merchantModalRoot"));
        closeMerchantModal();
        showToast("商户与资金划转配置已保存");
        return;
      }
      const modalSectionTarget = target.dataset.modalSectionTarget;
      if (modalSectionTarget) {
        setMerchantConfigPanel(modalSectionTarget);
        return;
      }
      const tierAction = target.dataset.tierAction;
      if (tierAction) {
        const index = Number(target.dataset.tierIndex);
        if (tierAction === "add") openTierRuleEditor();
        if (tierAction === "edit") openTierRuleEditor(index);
        if (tierAction === "cancel") closeTierRuleEditor();
        if (tierAction === "save") saveTierRule();
        if (tierAction === "delete" && Number.isInteger(index)) {
          if (tierRules[index] && tierRules[index].start === 0) {
            showToast("第一阶起始金额为 0，不能删除");
          } else {
            tierRules.splice(index, 1);
            renderTierRuleRows();
            closeTierRuleEditor();
            showToast("金额阶梯配置已删除");
          }
        }
        return;
      }
      const configToggle = target.dataset.configToggle;
      if (configToggle) {
        const enabled = !target.classList.contains("on");
        target.classList.toggle("on", enabled);
        target.setAttribute("aria-checked", String(enabled));
        setConfigSectionState(configToggle, enabled);
        if (configToggle === "balance-alert") {
          const section = target.closest("[data-balance-alert-config]");
          balanceAlertConfig(section.dataset.balanceAlertConfig).enabled = enabled;
          refreshBalanceAlertNotifyTags(section);
        }
        return;
      }
      if (target.dataset.currency) {
        accountCurrency = target.dataset.currency;
        renderPage();
        showToast(accountCurrency + " 数据已刷新");
        return;
      }
      if (target.dataset.cryptoRateEdit) {
        openCryptoRateModal(target.dataset.cryptoRateEdit);
        return;
      }
      if (target.dataset.cryptoRateClose !== undefined) {
        closeCryptoRateModal();
        return;
      }
      if (target.dataset.cryptoRateSave) {
        saveCryptoRateModal(target.dataset.cryptoRateSave);
        return;
      }
      if (target.dataset.action === "新增币种") {
        const select = document.getElementById("cryptoNewCurrency");
        const option = cryptoCurrencyOptions.find((item) => item.cur === select?.value);
        if (!option || cryptoRateRows.some((item) => item.cur === option.cur)) return showToast("该币种已配置");
        cryptoRateRows.push({ ...option, quoteStatus: "已获取" });
        renderPage();
        showToast(option.cur + " 已加入指定币种汇率配置");
        return;
      }
      const page = target.dataset.page;
      if (page !== undefined && page !== "") { navigateTo(page); return; }
      const group = target.dataset.group;
      if (group && group.endsWith("-group")) {
        target.closest(".menu-group").classList.toggle("open");
        return;
      }
      if (target.classList.contains("switch")) {
        target.classList.toggle("on");
        showToast("已切换模拟状态，不影响真实后台");
        return;
      }
      const action = target.dataset.action;
      if (action) showToast(`现状页面：${action} 不执行真实业务操作`);
    });
    document.addEventListener("change", (event) => {
      if (event.target.matches("[data-transfer-source], [data-transfer-target], [data-transfer-source-wallet], [data-transfer-target-wallet]")) refreshTransferModal(document.getElementById("transferModalRoot"));
      if (event.target.matches("[data-crypto-rate-source]")) updateCryptoRatePreview();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && event.target.matches("[data-transfer-notify-input]")) {
        event.preventDefault();
        addTransferNotifyUsers(event.target.closest("[data-transfer-config]"));
        return;
      }
      if (event.key === "Enter" && event.target.matches("[data-balance-alert-notify-input]")) {
        event.preventDefault();
        addBalanceAlertNotifyUsers(event.target.closest("[data-balance-alert-config]"));
        return;
      }
      if (event.key === "Escape" && document.getElementById("cryptoRateModalRoot").innerHTML) {
        closeCryptoRateModal();
        return;
      }
      if (event.key === "Escape" && document.getElementById("transferModalRoot").innerHTML) {
        closeTransferModal();
        return;
      }
      if (event.key !== "Escape" || !document.getElementById("merchantModalRoot").innerHTML) return;
      const editor = document.getElementById("tierRuleEditor");
      if (editor && !editor.hidden) closeTierRuleEditor();
      else closeMerchantModal();
    });

    const openPages = ["merchant","feeConfig","withdraw","recharge","payout","collect","cryptoConfig","cryptoOrder","mcFlow","chFlow","mcPrepay","mpFlow","mpPrepay","daily"];
    const bootPage = (typeof window !== "undefined" && window.__BP_BOOT__) || location.hash.replace("#", "") || new URLSearchParams(location.search).get("page") || "";
    if (openPages.includes(bootPage)) currentPage = bootPage;
    if (["mcFlow","chFlow","mcPrepay","mpFlow","mpPrepay","daily"].includes(currentPage)) accountCurrency = "TRX";
    renderPage();
  </script>
</body>
</html>
