<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>蓝盛支付 - 虚拟币代付订单</title>
<style>
:root{--blue:#409eff;--line:#ebeef5;--text:#606266;--muted:#909399;--canvas:#f5f7fa;--green:#67c23a;--red:#f56c6c;--amber:#e6a23c;font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;color:var(--text)}*{box-sizing:border-box}body{margin:0;background:var(--canvas)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b3d8ff;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.45}[hidden]{display:none!important}.page{padding:18px 20px 28px}h1{font-size:20px;color:#303133;margin:0 0 20px;font-weight:600}.card{background:#fff;border-radius:4px}.filter-card{padding:10px 10px 20px}.filter-row{display:flex;align-items:center;gap:18px 30px;flex-wrap:wrap;margin-bottom:18px}.filter-row:last-child{margin-bottom:0}.control{height:32px;padding:0 12px;border:1px solid #dcdfe6;background:#fff;border-radius:4px;min-width:0;color:var(--text);font-size:12px}.control::placeholder{color:#a8abb2}.control:hover{border-color:#c0c4cc}.control:focus{border-color:var(--blue)}.order-input{width:200px}.merchant-filter{width:220px}.select-filter{width:120px}.confirm-filter{width:140px}.confirmer-input{width:160px}.amount-range{display:flex;align-items:center;gap:8px;width:260px}.amount-range input{width:calc(50% - 10px)}.date-filter{width:130px}.filter-actions{display:flex;gap:12px;flex-wrap:wrap}.btn{height:32px;padding:0 15px;border:1px solid #dcdfe6;background:#fff;border-radius:4px;color:var(--text);font-size:12px;white-space:nowrap}.btn:hover{color:var(--blue);border-color:#c6e2ff;background:#ecf5ff}.btn:active{transform:translateY(1px)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#66b1ff;border-color:#66b1ff}.search-icon{display:inline-block;width:12px;height:12px;border:1.5px solid currentColor;border-radius:50%;margin-right:8px;vertical-align:-2px;position:relative}.search-icon::after{content:"";position:absolute;right:-4px;bottom:-2px;height:5px;width:1.5px;background:currentColor;transform:rotate(-45deg)}.auto-row{display:flex;align-items:center;gap:12px;font-size:13px}.auto-row select{width:110px}.custom-dates{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}.custom-dates input{width:220px}.summary{display:flex;align-items:center;gap:24px;margin:16px 0;padding:17px 10px;overflow:auto;white-space:nowrap;font-size:13px}.summary-label{color:var(--muted);margin-right:7px}.summary strong{color:#303133;font-weight:600}.summary .green{color:#85b95f}.summary .red{color:#f17878}.summary .blue{color:#5295d8}.table-card{padding:10px 10px 16px}.table-wrap{overflow:auto;max-width:100%;scrollbar-color:#c4c7cd #f5f7fa;scrollbar-width:thin}table{border-collapse:separate;border-spacing:0;width:100%;min-width:4470px;table-layout:fixed;font-size:12px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400;height:66px}th{height:62px;color:var(--muted);background:#fff}tbody tr:nth-child(even){background:#f7f8fb}tbody tr:hover{background:#f5f7fa}.sticky-first{position:sticky;left:0;z-index:2;background:#fff;box-shadow:4px 0 7px #00000008}tbody tr:nth-child(even) .sticky-first{background:#f7f8fb}.sticky-last{position:sticky;right:0;z-index:2;background:#fff;box-shadow:-4px 0 7px #00000008}tbody tr:nth-child(even) .sticky-last{background:#f7f8fb}tbody tr:hover .sticky-first,tbody tr:hover .sticky-last{background:#f5f7fa}thead .sticky-first,thead .sticky-last{z-index:3}.order-pair>div+div{margin-top:8px}.merchant-number{color:#a0a3aa;font-size:11px;margin-top:4px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}.link{padding:2px 4px;border:0;background:transparent;color:var(--blue);font-size:11px;white-space:nowrap}.link:hover{text-decoration:underline}.link:active{opacity:.65}.link.green{color:#85b95f}.link.amber{color:#c9a05b}.link.red{color:#e88787}.op-links{white-space:normal;line-height:26px}.op-links .link{margin-right:9px;padding-left:0}.pill{display:inline-block;border-radius:3px;border:1px solid #ebeef5;background:#f4f4f5;color:#909399;font-size:11px;line-height:18px;padding:0 7px}.pill.green{background:#f0f9eb;border-color:#e1f3d8;color:#85b95f}.pill.blue{background:#ecf5ff;border-color:#d9ecff;color:#72b0ec}.pill.amber{background:#fdf6ec;border-color:#faecd8;color:#c8a061}.pill.red{background:#fef0f0;border-color:#fde2e2;color:#e58e8e}.out-amount{color:#639de0;font-weight:700}.wallet-address{border:1px solid #f0f0f2;border-radius:3px;background:#fafafa;padding:3px 5px}.wallet-address .pill{margin-right:6px;font-size:10px}.pagination{display:flex;gap:12px;justify-content:flex-end;align-items:center;margin-top:18px;font-size:12px}.pagination select{width:100px}.page-button{border:0;background:transparent;padding:4px 8px;color:#606266;font-size:13px}.page-button.active{color:var(--blue);font-weight:700}.jump{width:56px;text-align:center}.empty{text-align:center;color:var(--muted);height:140px}.shade{position:fixed;inset:0;z-index:100;background:#0007;display:flex;align-items:center;justify-content:center;padding:20px}.modal{width:min(680px,100%);max-height:84vh;display:flex;flex-direction:column;background:#fff;border-radius:5px;box-shadow:0 12px 32px #0003}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 17px}.modal-head h2{font-size:17px;font-weight:400;color:#303133;margin:0}.close{border:0;background:transparent;color:#909399;font-size:22px;line-height:26px;padding:0 2px}.modal-body{padding:0 17px;overflow:auto}.details{margin:0}.detail-row{display:grid;grid-template-columns:150px minmax(0,1fr);min-height:41px;align-items:start;border-bottom:1px solid #eee;padding:10px 0;gap:0;font-size:13px}.detail-row dt,.detail-row dd{margin:0;word-break:break-all}.detail-row dd{color:#303133}.modal-foot{display:flex;justify-content:flex-end;padding:16px 17px;gap:12px}.task-table{min-width:0;table-layout:fixed}.task-table th,.task-table td{height:42px;border-right:1px solid var(--line);padding:10px}.task-table th{background:#fafafa}.task-table .empty{height:105px}.toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-8px);padding:10px 17px;border:1px solid #d9ecff;border-radius:4px;background:#ecf5ff;color:#409eff;z-index:120;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.page{padding:16px 12px}.filter-row{gap:12px}.order-input{width:calc(50% - 6px)}.merchant-filter{width:calc(50% - 6px)}.summary{gap:18px}.pagination{gap:6px;flex-wrap:wrap}.detail-row{grid-template-columns:125px minmax(0,1fr)}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* THIRD_PARTY_PAYOUT_STYLE_START */
.third-payout-shade{position:fixed;inset:0;z-index:3000;background:#0007;display:flex;align-items:center;justify-content:center;padding:20px}
.third-payout-dialog{width:min(720px,100%);max-height:90vh;background:#fff;border-radius:4px;box-shadow:0 12px 32px #0003;display:flex;flex-direction:column;font-size:13px;line-height:1.5;color:#606266}
.third-payout-head{display:flex;align-items:center;justify-content:space-between;padding:16px}
.third-payout-head h2{margin:0;font-size:18px;font-weight:400;color:#303133}.third-payout-close{border:0;background:transparent;font-size:22px;line-height:24px;color:#909399;cursor:pointer}
.third-payout-body{padding:0 16px;overflow:auto}.third-payout-alert{display:flex;gap:10px;align-items:center;background:#fdf6ec;color:#c8a061;border-radius:4px;padding:10px 16px;margin-bottom:0;font-size:13px;line-height:24px}.third-payout-alert-icon{flex:none;background:#e6a23c;color:#fff;border-radius:50%;width:14px;height:14px;line-height:14px;text-align:center;font-size:11px;font-weight:700}
.third-payout-info{background:#f2f9fd;border:1px solid #e4eaf0;border-radius:6px;padding:10px 12px}.third-payout-row{display:grid;grid-template-columns:130px minmax(0,1fr);gap:0;min-height:28px;align-items:center}.third-payout-label{color:#909399}.third-payout-value{overflow-wrap:anywhere}.third-payout-mono{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.third-payout-chain{display:inline-block;padding:0 6px;line-height:18px;border:1px solid #fde2e2;background:#fef0f0;border-radius:3px;color:#f56c6c;font-size:11px;margin-right:6px}.third-payout-amount{font-size:16px;font-weight:600;color:#409eff}.third-payout-copy{border:0;background:transparent;color:#409eff;font-size:12px;cursor:pointer;padding:0 5px}.third-payout-foot{padding:16px;display:flex;gap:12px;justify-content:flex-end}.third-payout-button{height:32px;border:1px solid #dcdfe6;border-radius:4px;background:#fff;color:#606266;padding:0 15px;cursor:pointer;font-size:13px}.third-payout-button:hover{background:#ecf5ff;color:#409eff;border-color:#c6e2ff}.third-payout-submit{background:#409eff;color:#fff;border-color:#409eff}.third-payout-submit:hover{background:#66b1ff;color:#fff;border-color:#66b1ff}.third-payout-dialog button:focus-visible{outline:2px solid #79bbff;outline-offset:2px}.third-payout-error{color:#f56c6c;margin:8px 0 0}.third-payout-error:empty{display:none}
@media(max-width:560px){.third-payout-shade{padding:12px}.third-payout-row{grid-template-columns:110px minmax(0,1fr);padding:3px 0}.third-payout-foot{flex-wrap:wrap}}
.third-payout-channel-select{width:100%;height:32px;border:1px solid #dcdfe6;border-radius:4px;background:#fff;color:#606266;padding:0 10px;font:inherit}.third-payout-submit:disabled{cursor:not-allowed;background:#a0cfff;border-color:#a0cfff}
.third-payout-withdraw-dialog{width:min(800px,100%);max-height:90vh}.third-payout-withdraw-dialog .third-payout-head h2{font-size:16px;font-weight:600}.third-payout-withdraw-dialog .third-payout-body{padding-bottom:16px}
/* THIRD_PARTY_PAYOUT_STYLE_END */
</style>
</head>
<body>
<main class="page">
<h1>虚拟币代付订单</h1>
<section class="card filter-card" aria-label="虚拟币代付订单筛选">
 <div class="filter-row">
  <input class="control order-input" id="systemOrder" placeholder="请输入系统订单号" aria-label="系统订单号">
  <input class="control order-input" id="channelOrder" placeholder="请输入通道订单号" aria-label="通道订单号">
  <input class="control order-input" id="merchantOrder" placeholder="请输入商户订单号" aria-label="商户订单号">
  <select class="control merchant-filter" id="merchantFilter" aria-label="商户"><option value="">商户</option><option>远航演示商户</option><option>北辰演示商户</option></select>
  <select class="control select-filter" id="currencyFilter" aria-label="币种"><option>CNY</option><option selected>USDT</option></select>
  <select class="control select-filter" id="payoutFilter" aria-label="代付状态"><option value="">代付状态</option><option>待支付</option><option>支付成功</option><option>支付失败(驳回)</option><option>冲正</option><option>异常</option><option>IP封禁</option><option>代付处理中</option></select>
  <select class="control select-filter" id="payoutOrderTypeFilter" aria-label="代付订单类型"><option value="">代付订单类型</option><option>普通订单</option><option>下分</option></select>
  <select class="control select-filter" id="noticeFilter" aria-label="通知状态"><option value="">通知状态</option><option>未通知</option><option>通知成功</option><option>通知失败</option><option>手动回调成功</option></select>
 </div>
 <div class="filter-row">
  <select class="control confirm-filter" id="confirmFilter" aria-label="确认状态"><option value="">确认状态</option><option>无需确认</option><option>待 TG 确认</option><option>TG 已取消</option><option>人工确认</option><option>已确认</option><option>确认超时</option><option>TG 异常</option></select>
  <input class="control confirmer-input" id="confirmerFilter" placeholder="请输入确认人" aria-label="确认人">
  <select class="control select-filter" id="chainFilter" aria-label="协议类型"><option selected>TRC20</option><option>ERC20</option></select>
  <div class="amount-range"><input class="control" id="amountMin" placeholder="出款金额起" inputmode="decimal" aria-label="出款金额起"><span>–</span><input class="control" id="amountMax" placeholder="出款金额止" inputmode="decimal" aria-label="出款金额止"></div>
  <select class="control date-filter" id="dateFilter" aria-label="时间范围"><option value="today">今天</option><option value="yesterday">昨天</option><option value="7">近 7 天</option><option value="30" selected>近 30 天</option><option value="custom">自定义</option></select>
  <div class="filter-actions"><button class="btn primary" id="search"><span class="search-icon" aria-hidden="true"></span>搜索</button><button class="btn" id="export">导出数据</button><button class="btn" id="exportTasks">导出任务列表</button></div>
 </div>
 <div class="custom-dates" id="customDates" hidden><input class="control" id="startTime" type="datetime-local" aria-label="开始时间"><span>至</span><input class="control" id="endTime" type="datetime-local" aria-label="结束时间"></div>
 <div class="auto-row"><label for="autoRefresh">自动刷新</label><select class="control" id="autoRefresh"><option value="0">关闭</option><option value="5">5 秒</option><option value="10">10 秒</option><option value="15">15 秒</option><option value="30">30 秒</option><option value="60">60 秒</option></select></div>
</section>
<section class="card summary" id="summary" aria-label="虚拟币代付统计" aria-live="polite"></section>
<section class="card table-card" aria-label="虚拟币代付订单列表">
 <div class="table-wrap"><table id="payoutTable"><colgroup id="tableCols"></colgroup><thead><tr id="tableHead"></tr></thead><tbody id="tableRows"></tbody></table></div>
 <footer class="pagination"><span id="totalCount"></span><select class="control" id="pageSize" aria-label="每页条数"><option value="10">10条/页</option><option value="20">20条/页</option><option value="50">50条/页</option></select><button class="page-button" id="prevPage" aria-label="上一页">‹</button><span id="pageButtons"></span><button class="page-button" id="nextPage" aria-label="下一页">›</button><span>前往</span><input class="control jump" id="jumpPage" type="number" min="1" value="1" aria-label="页码"><span>页</span></footer>
</section>
</main>
<div class="shade" id="modalShade" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modal-head"><h2 id="modalTitle"></h2><button class="close" id="closeModal" aria-label="关闭此对话框">×</button></header><div class="modal-body" id="modalBody"></div><footer class="modal-foot"><button class="btn" id="closeModalFooter">关闭</button></footer></section></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>

// THIRD_PARTY_PAYOUT_START

// WITHDRAW_ORDER_INFO_START
function withdrawOrderInfoHtml(order) {
  const esc=value=>String(value??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=value=>value==null?'—':Number(value).toFixed(2);
  const pair=(label,value)=>`<td class="manual-withdraw-label">${label}</td><td class="manual-withdraw-value">${esc(value)}</td>`;
  return `<section class="manual-withdraw-section"><h4 class="manual-withdraw-title"><span class="manual-withdraw-risk-icon" aria-hidden="true">!</span>收款地址风险</h4><div class="manual-withdraw-risk">查询失败</div></section>
    <section class="manual-withdraw-section" aria-label="订单信息"><h4 class="manual-withdraw-title">订单信息</h4><table class="manual-withdraw-table"><tbody>
    <tr>${pair('单号',order.id)+pair('提交时间',order.created)}</tr>
    <tr>${pair('商户名称/商户号',order.merchant)+pair('操作时间',order.operated)}</tr>
    <tr>${pair('提现金额',money(order.amount))+pair('操作人',order.operator)}</tr>
    <tr>${pair('手续费',money(order.fee))}<td class="manual-withdraw-label">状态</td><td class="manual-withdraw-value pending">${esc(order.status)}</td></tr>
    <tr>${pair('到账金额',money(order.net))+pair('币种',order.currency)}</tr>
    <tr>${pair('协议类型',order.protocol)}<td class="manual-withdraw-label"></td><td class="manual-withdraw-value"></td></tr>
    <tr><td class="manual-withdraw-label">收款钱包地址</td><td class="manual-withdraw-value manual-withdraw-mono" colspan="3">${esc(order.recipient)}</td></tr>
    <tr><td class="manual-withdraw-label">备注</td><td class="manual-withdraw-value" colspan="3">${esc(order.remark)}</td></tr>
    </tbody></table></section>`;
}
// WITHDRAW_ORDER_INFO_END

function canSubmitThirdPartyPayout(order) {
  return !!order && ['待处理', '待支付'].includes(order.status) && order.confirm === '已确认' && order.third === '未提交';
}
function selectedThirdPartyChannel(order, id) {
  return (order.getChannels?.() || []).find(c=>c.id===id && c.category==='下分' && c.enabled);
}
function submitThirdPartyPayout(order, channel) {
  if (!canSubmitThirdPartyPayout(order)) return false;
  if (order.business === 'withdraw') {
    if (!channel || channel.category !== '下分' || !channel.enabled) return false;
    order.sourceWithdrawalNo = order.id;
    order.channelId = channel.id; order.channelName = channel.name; order.channelProvider = channel.provider;
  }
  order.status = '代付处理中';
  order.third = '已提交';
  return true;
}
function thirdPartyPayoutBody(order, channels = order.getChannels?.() || []) {
  const escape = text => String(text ?? '—').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const currency = escape(order.currency), amount = Number(order.outAmount).toFixed(2), balance = Number(order.balance).toFixed(2);
  const withdrawal = order.business === 'withdraw';
  const chain = `<span class="third-payout-chain">${escape(order.chain)}</span>`;
  const row = (label, value) => `<div class="third-payout-row"><span class="third-payout-label">${label}</span><span class="third-payout-value">${value}</span></div>`;
  if (withdrawal) {
    const info = order.withdrawInfo || {id:order.id,merchant:order.merchant+'/'+order.merchantNo,amount:order.amount,fee:order.fee,net:order.outAmount,currency:order.currency,protocol:order.chain,recipient:order.recipient,status:order.status};
    return `${withdrawOrderInfoHtml(info)}
      <section class="manual-withdraw-section"><h4 class="manual-withdraw-title"><label for="withdrawPayoutChannel">代付通道</label></h4><select class="third-payout-channel-select" id="withdrawPayoutChannel" aria-label="代付通道" ${channels.length?'':'disabled'}><option value="">${channels.length?'请选择下分代付通道':'暂无已开启的下分通道'}</option>${channels.map(c=>`<option value="${escape(c.id)}">${escape(c.name)}</option>`).join('')}</select><p class="manual-withdraw-hint">仅可选择已开启的下分类通道；确认后提交至所选通道，等待通道回调更新出款结果。</p></section>
      <div class="manual-withdraw-amount">到账金额：${Number(info.net).toFixed(2)} ${currency} <span>（按此金额提交所选通道）</span></div>
      <div class="manual-withdraw-field"><label for="thirdPayoutRemark">备注：</label><input class="manual-withdraw-input" id="thirdPayoutRemark" placeholder="请输入备注"></div>
      <div class="manual-withdraw-field"><span class="manual-withdraw-field-label">审核图片：</span><div><div class="manual-withdraw-upload-list" id="thirdPayoutImages"><label class="manual-withdraw-upload">+<input id="thirdPayoutImageInput" type="file" multiple accept="image/jpeg,image/png,image/gif" aria-label="上传审核图片"></label></div><p class="manual-withdraw-hint">可上传多张凭证图</p><p class="manual-withdraw-error" id="thirdPayoutUploadError" role="status"></p></div></div>
      <p class="third-payout-error" role="status" aria-live="polite"></p>`;
  }
  return `<div class="third-payout-alert" role="alert"><span class="third-payout-alert-icon" aria-hidden="true">!</span><span>确认后订单将提交到三方代付，当前状态改为「代付处理中」。需等待三方转账回调后，再同步最终状态给商户。</span></div>
    <div class="third-payout-info">${[
      row('商户订单号', `<span class="third-payout-mono">${escape(order.merchantOrder)}</span>`),
      row('平台订单号', `<span class="third-payout-mono">${escape(order.id)}</span>`),
      row('商户名称', escape(order.merchant)), row('商户号', escape(order.merchantNo)),
      row(currency + '剩余预付', balance + ' ' + currency),
      row('收款钱包地址', chain + `<span class="third-payout-mono">${escape(order.recipient)}</span><button type="button" class="third-payout-copy" data-third-copy="${escape(order.recipient)}" aria-label="复制收款钱包地址">▣</button>`),
      row('协议类型', chain),
      row('出款金额', `<span class="third-payout-amount">${amount} ${currency}</span><button type="button" class="third-payout-copy" data-third-copy="${amount}" aria-label="复制出款金额">复制</button>`),
      row('三方处理状态', '未提交第三方：本地订单未记录第三方订单号，可走普通提交第三方流程'),
      row('处理方式', '提交三方代付，等待三方转账回调')
    ].join('')}</div><p class="third-payout-error" role="status" aria-live="polite"></p>`;
}

function openThirdPartyPayout(order, onSubmitted, notify) {
  if (!canSubmitThirdPartyPayout(order)) return notify('该订单当前不可提交代付');
  if (document.querySelector('.third-payout-shade')) return;
  const previousFocus = document.activeElement, previousOverflow = document.body.style.overflow, images = [];
  const shade = document.createElement('div');
  shade.className = 'third-payout-shade';
